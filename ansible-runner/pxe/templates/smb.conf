[global]
    server role = standalone server
    server min protocol = SMB2
    map to guest = never
    disable netbios = yes
    smb ports = 445
    load printers = no
    printing = bsd
    printcap name = /dev/null
    log file = /dev/stdout

# The image share. WinPE (deploy and capture) connects as "pxe".
[images]
    path = /data/images
    valid users = pxe
    read only = no
    force user = root
    create mask = 0644
