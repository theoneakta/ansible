# Proxy-DHCP only: the router keeps handing out addresses, dnsmasq just adds
# the PXE boot details. port=0 turns dnsmasq's DNS server off entirely.
port=0
log-dhcp
dhcp-range=${PXE_SUBNET},proxy

# Legacy BIOS -> undionly.kpxe ("undionly" + the ".0" dnsmasq appends),
# UEFI -> snponly.efi. Both have the boot-menu URL embedded (see Dockerfile).
pxe-prompt="Network boot",0
pxe-service=x86PC,"Network boot (iPXE)",undionly
pxe-service=BC_EFI,"Network boot (iPXE)",snponly.efi
pxe-service=X86-64_EFI,"Network boot (iPXE)",snponly.efi

enable-tftp
tftp-root=/srv/tftp
