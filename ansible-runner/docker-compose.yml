services:
  ansible:
    build: .
    image: ansible-runner:latest
    environment:
      HOME: /tmp
      ANSIBLE_LOCAL_TEMP: /tmp/.ansible/tmp
      EDITOR: nano
    volumes:
      - ./playbooks:/ansible/playbooks
      - ./inventory:/ansible/inventory
      # Uncomment to use SSH keys for Linux targets:
      # - ~/.ssh:/tmp/.ssh:ro
    # Not long-running: use `docker compose run --rm ansible ...` (see run.sh)
    profiles: ["run"]

  gui:
    build:
      context: .
      dockerfile: gui/Dockerfile
    image: ansible-gui:latest
    environment:
      HOME: /tmp
      ANSIBLE_LOCAL_TEMP: /tmp/.ansible/tmp
      # GitHub OAuth login gate - see README.md ("GitHub sign-in"). Set these
      # in a .env file next to this compose file (gitignored, like
      # .vault_pass); the GUI refuses to serve unauthenticated if unset.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-}
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS:-theoneakta}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-}
    volumes:
      - ./playbooks:/ansible/playbooks
      - ./inventory:/ansible/inventory
      - ./gui/data:/ansible/gui-data
      - ./.vault_pass:/run/secrets/vault_pass:ro
      # Windows image build/capture (playbooks/image_*.yml): Packer uploads
      # setup-winrm-ssl.ps1 into the image, and capture writes the PXE
      # server's files (WinPE, per-MAC boot overrides) - shared with `pxe`.
      - ./scripts:/ansible/scripts:ro
      - ./pxe/data:/ansible/pxe
    ports:
      # Reachable from the whole LAN, not just this Docker host - deliberate,
      # since every request now requires GitHub sign-in (see README.md,
      # "GitHub sign-in"). Revert to "127.0.0.1:8080:8000" for host-only
      # access if that ever changes.
      - "0.0.0.0:8090:8000"
    # Long-running web server, started/stopped via `./run.sh --gui` / `--gui-stop`.
    profiles: ["gui"]

  # PXE server for deploying the Windows 11 image - see README.md
  # ("Windows 11 image + PXE deployment"). Proxy-DHCP only (the router keeps
  # handing out addresses), TFTP, HTTP on PXE_HTTP_PORT, SMB on 445.
  pxe:
    build:
      context: ./pxe
      args:
        PXE_SERVER_IP: ${PXE_SERVER_IP:-}
        PXE_HTTP_PORT: ${PXE_HTTP_PORT:-8092}
    image: ansible-pxe:latest
    # DHCP is broadcast - it only works on the host's own network stack.
    network_mode: host
    cap_add: [NET_ADMIN]
    environment:
      PXE_SERVER_IP: ${PXE_SERVER_IP:-}
      PXE_SUBNET: ${PXE_SUBNET:-}
      PXE_HTTP_PORT: ${PXE_HTTP_PORT:-8092}
      PXE_SMB_PASSWORD: ${PXE_SMB_PASSWORD:-}
      # Boot-menu entries: "<image_id>=<label>[=linux];..." (image_id = a key under
      # `images:` in inventory/image.yml, deployed from <image_id>.wim).
      PXE_IMAGES: ${PXE_IMAGES:-win11=Windows 11 Pro;win2025=Windows Server 2025;rocky10=Rocky Linux 10=linux;ubuntu2604=Ubuntu 26.04 Server=ubuntu;ubuntu2604-desktop=Ubuntu 26.04 Desktop=ubuntu}
    volumes:
      - ./pxe/data:/data
    restart: unless-stopped
    # Started/stopped via `./run.sh --pxe` / `--pxe-stop`.
    profiles: ["pxe"]
