[defaults]
inventory = /ansible/inventory/hosts.yml
host_key_checking = False
retry_files_enabled = False
# community.general.yaml (the old dedicated callback) was removed in
# community.general 12.0.0 - result_format=yaml on the builtin default
# callback replaces it without needing that collection's plugin at all.
stdout_callback = default
interpreter_python = auto_silent

[callback_default]
result_format = yaml
