---
# Windows image build/capture settings (playbooks/image_build.yml,
# playbooks/image_capture.yml). Managed by the GUI's "Windows Image" tab,
# which rewrites this file - comments other than this header aren't kept.
# The Proxmox API token SECRET is not here: it's vault_proxmox_token_secret
# in group_vars/windows/vault.yml (also set from that tab).
#
# Proxmox token ansible@pam!ansible: user "ansible" in the pam realm (a Linux
# user of that name must exist on the node), Administrator role on "/", and
# its token "ansible" with Privilege Separation unchecked so it inherits that.
proxmox_api_url: https://192.168.3.237:8006/api2/json
proxmox_token_id: ansible@pam!ansible
proxmox_validate_certs: false
proxmox_node: pve6
proxmox_storage_pool: local-lvm
proxmox_iso_storage: local
proxmox_bridge: vmbr0
image_capture_vmid: 9012
image_capture_full_clone: false
image_cores: 8
image_memory: 8192
image_timezone: Eastern Standard Time
image_linux_timezone: America/Toronto
image_locale: en-US
pxe_server_ip: 192.168.3.8
pxe_http_port: 8092
images:
  win11:
    os: windows
    label: Windows 11 Pro
    iso: local:iso/Windows11.iso
    edition: Windows 11 Pro
    # Microsoft's public generic install key - selects the edition, never activates.
    product_key: VK7JG-NPHTM-C97JM-9MPGT-3V66T
    template_vmid: 9011
    template_name: win11-pro-base
    disk_size: 64G
  win2025:
    os: windows
    label: Windows Server 2025
    iso: local:iso/WindowsServer2025.iso
    edition: Windows Server 2025 Standard Evaluation (Desktop Experience)
    # Evaluation media takes no key (180-day evaluation, convertible later).
    product_key: ''
    template_vmid: 9025
    template_name: win2025-base
    disk_size: 64G
  rocky10:
    # Linux: Proxmox template via kickstart; physical machines PXE-install
    # from the same kickstart (image_publish_linux.yml) instead of a capture.
    os: linux
    label: Rocky Linux 10
    iso: local:iso/Rocky-10.2-x86_64-minimal.iso
    template_vmid: 9100
    template_name: rocky10-base
    disk_size: 32G
    # Rocky 10 needs an x86-64-v3 (AVX2) CPU: pve5 (i5-6500) has it, pve6
    # (Xeon E5-2650 v2) doesn't. pve5 is smaller - 4 cores, ~5 GB free RAM.
    node: pve5
    bridge: vmbr1
    cores: 4
    memory: 4096
