# Site values template. On first start the GUI (or run.sh) copies this to
# inventory/group_vars/all/site.yml, which stays on this runner only - never
# commit it (the repo is public). Playbooks, the GUI and scripts/ read these
# instead of hardcoding addresses. Empty = the feature that needs it refuses
# to run with a clear message. (This template sits outside group_vars/ so
# Ansible never loads it.)

site_apps_host: ""            # Docker host running Trivy server + DefectDojo, e.g. 192.0.2.10
site_defectdojo_url: ""       # e.g. http://192.0.2.10:8095
site_capture_host: ""         # proxmox_sniff.yml: VM that gets the mirror NIC
site_sniff_exclude: []        # never mirrored (e.g. the NAS's iSCSI), e.g. [192.0.2.40]
site_printer: ""              # install_software.yml network printer, e.g. 192.0.2.30
site_netflow_collector: ""    # softflowd target host:port, e.g. 192.0.2.10:2055
site_docker_root: ""          # compose projects on the Docker hosts, e.g. /home/<user>/docker
site_docker_users: []         # linux_software.yml --docker: users for the docker + sudo groups
site_github_user: ""          # trivy_scan.yml: GitHub account whose repos are scanned

# scripts/firefly_*.py (optional)
site_firefly_url: ""          # e.g. http://192.0.2.10:8080
site_firefly_public: ""       # e.g. https://fin.example.com
site_paperless_url: ""
site_paperless_public: ""
site_firefly_accounts: {}     # last 4 digits -> [Firefly account, business|personal]
