---
# CIS Benchmark hardening, via ansible-lockdown's own roles:
#   https://github.com/ansible-lockdown/Windows-11-CIS
#   https://github.com/ansible-lockdown/Windows-2019-CIS
#   https://github.com/ansible-lockdown/Windows-2022-CIS
#   https://github.com/ansible-lockdown/Windows-2025-CIS
#
# WARNING: unlike install_software.yml, this changes real security settings
# (password/lockout policy, auditing, services, network protocols, etc) on
# the target. Level 2 is stricter and more likely to break something (older
# apps, some remote-access tooling). Read the role's own docs before running
# it against a machine you rely on, and test on a non-critical PC first.
#
# Which role runs is picked via cis_role (a role name, e.g. "Windows-11-CIS")
# - the GUI's CIS section sets this for you; on the CLI use run.sh's
# --cis-os flag rather than setting cis_role directly.
#
# Level/section selection differs by role - see the GUI's CIS section (it
# fetches the real options from /api/cis/options) or each role's own docs:
#   Windows-11-CIS: --tags level1-corporate-enterprise-environment (+ level1-bitlocker)
#                    or level2-high-security-sensitive-data-environment (+ level2-bitlocker)
#   2019/2022/2025:  --tags level1-domaincontroller / level1-domainmember /
#                    level1-memberserver / level2-domaincontroller / level2-memberserver
# All 4 roles use the same section numbers (1, 2, 5, 9, 17, 18, 19) gated by
# a per-role boolean var, e.g. win11cis_section1 / win22cis_section01 (note
# the zero-padding differs by role - Windows-11-CIS and Windows-2025-CIS tasks
# use unpadded folder names but 2025's own *vars* are still zero-padded like
# 2019/2022; see CIS_PROFILES in gui/app.py, the single source of truth for
# exact var names, kept in sync with each role's actual defaults).
#
# Run:  ./run.sh cis_hardening.yml --cis-os windows11 --cis-level 1
#       ./run.sh cis_hardening.yml --cis-os windows11 --cis-level 1 --cis-audit-only
#
# Requirements (control node): ansible-galaxy install -r requirements.yml
# (done automatically at image build time)

- name: Apply CIS Benchmark hardening
  hosts: windows
  gather_facts: true
  vars:
    cis_role: Windows-11-CIS
    # Safe by default. The role itself defaults this to false (see its
    # defaults/main/main.yml) - with it false, control 1.2.2 (Account
    # lockout threshold) locks out the very account WinRM/psrp uses to
    # manage the host after 5 failed authentications, something the role's
    # own maintainers document as a previously-reported incident ("a
    # converge with win_skip_for_test: true still locked the operator out
    # of a WinRM-managed host after five failed authentications - reported
    # from a live run where the host was lost mid-play and never
    # recovered"). Confirmed live on 192.168.3.17: a real run applied 1.2.2,
    # WinRM auth started rejecting the account shortly after, and recovery
    # needed local/console access to re-run setup-winrm-ssl.ps1 - exactly
    # the failure mode this variable exists to prevent. true also skips
    # every other control that can strand a WinRM/psrp-managed run:
    # 2.2.16/2.2.20 (breaks local admin connection), 5.39/18.10.88.x/
    # 18.10.89.1 (disable WinRM itself or its auth methods), plus a few
    # unrelated ones (5.21/18.10.56.3.2.1 disable RDP, 9.3.4 breaks reboot).
    # Trade-off: those specific controls then never get applied, so a run
    # won't be 100% benchmark-complete unless overridden with
    # -e win_skip_for_test=false for a specific run - only sensible with a
    # real console/IPMI fallback in case that run strands the connection.
    win_skip_for_test: true
    # A second, separate self-lockout mechanism win_skip_for_test does NOT
    # cover. Control 18.4.1 ("Apply UAC restrictions to local accounts on
    # network logons") sets LocalAccountTokenFilterPolicy=0 - the exact
    # opposite of what setup-winrm-ssl.ps1 sets it to (=1). That value is
    # what lets a local admin account OTHER than the built-in "Administrator"
    # (RID 500) - i.e. the account this toolkit actually authenticates as -
    # get a full, unfiltered token over a network logon; the built-in
    # Administrator is exempt from this filtering regardless of the policy
    # value, but a named account like this one is not. The moment 18.4.1
    # applies, every subsequent WinRM/psrp authentication from that account
    # is rejected. Confirmed live: a real run applied 18.4.1, and the very
    # next task failed with "credentials were rejected by the server",
    # stranding the connection the same way 1.2.2 did (recap: ok=198
    # changed=16 unreachable=1 skipped=173 - the run got much further than
    # the 1.2.2 incident, but died the same way). This is a genuine,
    # unavoidable conflict between this control and automating over WinRM as
    # a non-built-in local admin - not a bug to fix, a trade-off to make
    # deliberately. All 4 roles have their own copy of this control under
    # their own rule variable; excluded here by default the same way
    # win_skip_for_test's list is, overridable per-run with
    # -e win11cis_rule_18_4_1=true (or the win19/win22/win25 equivalent) if
    # the automation account is ever changed to the actual built-in
    # Administrator, or you accept re-running setup-winrm-ssl.ps1 afterward.
    win11cis_rule_18_4_1: false
    win19cis_rule_18_4_1: false
    win22cis_rule_18_4_1: false
    win25cis_rule_18_4_1: false
    # 2.3.1.1 ("Block Microsoft accounts") sets NoConnectedUser=3 under
    # HKLM:\Software\Microsoft\Windows\Currentversion\Policies\System -
    # Microsoft's documented value for "Users can't add or log on with
    # Microsoft accounts". This control is written for domain-joined
    # enterprise environments where users sign in with domain credentials;
    # applied to a non-domain personal PC where a Microsoft account is the
    # only way to sign in at all, it locks the person out of their own
    # desktop, not just some hypothetical newly-added account. Confirmed
    # live. Windows-11-CIS only - not excluded on the server roles, where
    # blocking personal Microsoft accounts on a domain-joined member
    # server/DC is the actually-intended, appropriate use of this control.
    win11cis_rule_2_3_1_1: false
    # A related cluster, same root cause as 2.3.1.1: these three are all
    # named "on domain-joined computers" but have NO discovered_domain_joined
    # guard in their tasks (unlike their siblings 18.9.28.5/6/7, which do),
    # so they apply unconditionally even on a non-domain PC.
    # 18.9.28.1 sets BlockUserFromShowingAccountDetailsOnSignin=1 - Microsoft's
    # own documented behavior for this policy is that it doesn't just hide
    # account details on the lock screen, it also disables Microsoft-account
    # -backed connected experiences: OneDrive sync, Mail/Calendar (Outlook),
    # Store sign-in, and anything else needing that account. Confirmed live:
    # this, not 2.3.1.1/NoConnectedUser, was what broke OneDrive/Outlook
    # sign-in specifically (NoConnectedUser only blocks the raw "sign in with
    # a Microsoft account" OS dialog - this one is broader).
    # 18.9.28.3 (DontEnumerateConnectedUsers) and 18.9.28.4 (EnumerateLocalUsers)
    # are the same domain-only-in-name pattern, directly adjacent, and
    # plausibly compounding the same class of account-visibility issue -
    # excluded together rather than waiting to hit each one individually.
    win11cis_rule_18_9_28_1: false
    win11cis_rule_18_9_28_3: false
    win11cis_rule_18_9_28_4: false
    # The actual, comprehensive cause of the persistent "Can't sign in with
    # a Microsoft account - This program is blocked by group policy
    # (0x800704ec)" dialog, which survived clearing all of the above.
    # 18.10.41.1's own name says exactly what it does: "Block all consumer
    # Microsoft account user authentication" - it sets
    # HKLM:\Software\Policies\Microsoft\MicrosoftAccount\DisableUserAuth=1,
    # a dedicated, system-wide kill switch for consumer MSA auth, separate
    # from and more comprehensive than NoConnectedUser (2.3.1.1) or the
    # 18.9.28.x cluster above - it's what was still blocking Outlook even
    # after every other Microsoft-account-related exclusion was in place.
    # Confirmed live: clearing this (and only this, at that point) let
    # Outlook sign in. Windows-11-CIS only, same domain-vs-personal-PC
    # reasoning as 2.3.1.1.
    win11cis_rule_18_10_41_1: false
  pre_tasks:
    # The vendored roles (overwritten from GitHub on every `--build`, so not
    # ours to patch) disable services in control-number order, not dependency
    # order - e.g. Windows-11-CIS stops SSDPSRV (5.30) before upnphost
    # (5.31), which depends on it, and Windows refuses ("has dependent
    # services"). Ansible then aborts ALL remaining tasks for that host (no
    # ignore_errors in the role), so one ordering conflict can silently skip
    # hundreds of otherwise-fine controls. Fix: discover every service any
    # win_service(_info) task in the selected role touches, and stop
    # (not disable - that's the role's own job if it's itself a tracked
    # control) whichever of THEIR dependents are currently running, before
    # the role gets a chance to hit the same conflict. Skipped entirely in
    # audit_only mode, which must make zero real changes.
    #
    # tags: always on the block (not just the include_role step below) -
    # without it, a --tags-filtered run (which is every real invocation;
    # see CIS_PROFILES in gui/app.py) silently drops these untagged tasks
    # entirely, the same dynamic-include tag gotcha documented below, just
    # for a plain block instead of include_role. Confirmed live: without
    # this, the log jumped straight from "Gathering Facts" to the role
    # include with no trace of these tasks at all, not even "skipping".
    - block:
        - name: Discover every service {{ cis_role }}'s own tasks reference
          # delegate_to localhost = runs on the controller, once per target
          # host in the play (no run_once - that would leave the registered
          # result undefined on every host but the first when targeting more
          # than one). Cheap (a local file scan, no WinRM round-trip), so
          # per-host repeats cost nothing worth avoiding.
          ansible.builtin.command:
            cmd: "python3 {{ playbook_dir }}/files/discover_cis_services.py {{ cis_role }}"
          delegate_to: localhost
          become: false
          changed_when: false
          register: cis_service_discovery

        - name: Find currently-running dependents of each discovered service
          ansible.windows.win_shell: |
            $svc = Get-Service -Name '{{ item }}' -ErrorAction SilentlyContinue
            if ($svc) { $svc.DependentServices | Where-Object Status -eq 'Running' | Select-Object -ExpandProperty Name }
          loop: "{{ (cis_service_discovery.stdout | default('[]', true)) | from_json }}"
          loop_control:
            label: "{{ item }}"
          changed_when: false
          failed_when: false
          register: cis_dependent_check

        - name: Stop running dependents that would block the role's own service changes
          ansible.windows.win_service:
            name: "{{ item }}"
            state: stopped
          # Never WinRM - stopping it would sever this very connection
          # mid-run. Everything else is safe to stop (not disable): if a
          # dependent is itself a tracked CIS control, the role's own task
          # still sets its real start_mode when its turn comes; if it isn't,
          # we're only touching its current running state, not its config.
          loop: >-
            {{ (cis_dependent_check.results | default([], true) | map(attribute='stdout_lines')
                | list | sum(start=[]) | unique | reject('equalto', 'WinRM') | list) }}
          loop_control:
            label: "{{ item }}"
      when: not (audit_only | default(false) | bool)
      tags: always

    # run_audit.ps1 (invoked by the role's own "Pre Audit | Run pre_remediation
    # audit" task via `& 'run_audit.ps1' @auditArgs`) is a saved script FILE,
    # which IS subject to PowerShell's execution policy - unlike most of this
    # toolkit's other downloaded-script usage (e.g. Win11Debloat's install_software.yml
    # task, which runs an in-memory scriptblock via [scriptblock]::Create and is
    # immune to it). The role's own execution-policy check
    # (pre_remediation_audit.yml) only looks at MachinePolicy/UserPolicy
    # (GPO-enforced) - it misses a plain LocalMachine-scope Restricted policy,
    # the common case on a non-domain-joined PC never explicitly configured
    # for scripting, which DOES block this. Confirmed live: LocalMachine was
    # Restricted, the role's own check still reported "OK", and the audit
    # step failed with PSSecurityException: UnauthorizedAccess ("running
    # scripts is disabled on this system"). Fix: RemoteSigned (not the far
    # more permissive Bypass/Unrestricted) is enough - it only requires
    # signing for scripts marked as downloaded from the internet (a
    # Zone.Identifier stream), and Ansible's own download/unarchive
    # mechanism doesn't set that marker the way a browser would (confirmed:
    # no Zone.Identifier stream on the extracted audit files). Only touches
    # LocalMachine if it's actually blocking (Restricted or AllSigned) -
    # never loosens an intentionally stricter policy beyond what's needed to
    # let this specific script run.
    - block:
        - name: Check LocalMachine execution policy allows the audit script to run
          ansible.windows.win_shell: (Get-ExecutionPolicy -Scope LocalMachine).ToString()
          changed_when: false
          register: cis_local_machine_execution_policy

        - name: Allow local scripts to run (RemoteSigned) if LocalMachine policy currently blocks them
          ansible.windows.win_shell: Set-ExecutionPolicy -Scope LocalMachine -ExecutionPolicy RemoteSigned -Force
          when: (cis_local_machine_execution_policy.stdout | trim) in ['Restricted', 'AllSigned']
      when: (run_audit | default(false) | bool) or (audit_only | default(false) | bool)
      tags: always

    - name: "Include the {{ cis_role }} role"
      # include_role is a DYNAMIC include - it does not automatically
      # inherit/propagate the CLI's --tags filtering to the tasks discovered
      # inside it the way a static `roles:` list does. Without tags: always
      # here, the include step itself never matched any --tags filter and
      # NOTHING from inside the role ran at all (confirmed live: a forced
      # cis_role=Windows-2022-CIS --tags level1-memberserver run against the
      # real target produced only "Gathering Facts", zero role tasks, not
      # even always-tagged ones). tags: always makes the include itself run
      # unconditionally, deferring the real filtering to each task inside
      # the role, which already carries its own correct tags.
      ansible.builtin.include_role:
        name: "{{ cis_role }}"
      tags: always
