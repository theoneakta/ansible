---
# Sentry Lens (netview) - our own traffic views (device names, per-host
# activity, websites and their categories, live data) over Akvorado's
# ClickHouse, next to the Akvorado stack:
#   akvorado ClickHouse (akvorado_default network) <- netview :8082 (read-only)
# The app's source is playbooks/files/netview/ (FastAPI + one static page);
# the image is built on the collector from it.
#
# Device names: no PTR records on the LAN, so this reads the firewall's DHCP
# leases/reservations (read-only, OPNsense API with its per-host root login,
# on the controller - the login never reaches the container) and writes them
# with netview_names to names.json, which the app re-reads when it changes.
# Re-run with --tags names to refresh them only.
#
# Visited websites and the live page: the app polls the firewall's DNS query
# log (Unbound) and its traffic counters with its own API user "netview",
# whose only privileges are the read-only DNS overview and Reporting: Traffic.
# This playbook creates that user (and keeps its privileges to those two), and
# a key when the collector has none (/opt/netview/.env, root 0600 - delete it
# to get a new key; the old one is revoked). Lookups go to ClickHouse database
# "netview", kept netview_dns_retention_days. netview_dns: false turns both off.
#
# Prerequisite: akvorado_stack.yml on the same host.
# Run:  ./run.sh netview_stack.yml                  (192.168.3.150)
#       ./run.sh netview_stack.yml --tags names     (names only)
#
# Sign-in (files/netview/auth.py, files/netview/README.md): the app's own
# login page - local accounts, Google, Microsoft Entra ID (Azure AD), Apple,
# GitHub, AWS Cognito, any OpenID Connect server, LDAP / Active Directory -
# with admin approval of new accounts (Admin page). Methods come from
# netview_auth_providers (secrets from the vault) and from the app's own
# Admin > Sign-in methods page. First run: the login page asks for the setup
# token in /opt/netview/session.env (root only) to create the first admin;
# netview_admin_emails are admins as soon as they sign in. A Cloudflare
# Access token can count as signed in too (netview_auth_methods: [builtin,
# cloudflare] with netview_cf_team / netview_cf_aud - cloudflare_access.yml).
# netview_auth_methods: [off] = no login, LAN only.
# CIS Level 1 safe: no volumes (names.json is a read-only bind mount of a
# root-owned file), the container runs as an unprivileged UID.

- name: netview
  hosts: "{{ akvorado_host | default('192.168.3.150') }}"
  become: true
  gather_facts: false
  vars:
    netview_dir: /opt/netview
    netview_port: 8082
    netview_firewall: 192.168.3.1
    netview_dns: true
    netview_dns_retention_days: 30
    # Live page: the firewall interfaces shown, by device (as in
    # akvorado_stack.yml's ifindexes). external = towards the internet, so
    # download is what the firewall receives there. kind (wan / vpn / lan)
    # settles a conversation seen on two: the firewall records the upload
    # half of policy-routed VPN traffic as leaving through the WAN, so one
    # that touched a vpn interface counts as that, then wan, then lan.
    # netflow = captured by the firewall's NetFlow (opnsense_netflow.yml): a
    # flow between two of those is reported twice, and counted once.
    # tunnel_port = a VPN whose devices also tunnel past the firewall: their
    # UDP conversations on that port (Tailscale's direct WireGuard, to a VPS
    # or between LAN devices) count under this interface too.
    netview_live_interfaces:
      ix0: {label: Internet, external: true, kind: wan}
      wg0: {label: VPN (PIA), external: true, kind: vpn}
      ix1: {label: LAN, external: false, kind: lan, netflow: true}
      tailscale0: {label: Tailscale, external: true, kind: vpn, netflow: true, tunnel_port: 41641}
    netview_live_top_iface: lan  # OPNsense interface key whose hosts get live rates
    # Sign-in (see the top). Team = the Zero Trust team name (<team>.cloudflareaccess.com),
    # AUD = the Access application's "Application Audience (AUD) Tag".
    netview_public_url: https://netview.aktasolutions.com
    # builtin = the app's login page; cloudflare = trust a Cloudflare Access
    # token too; off = no login (LAN only).
    netview_auth_methods: [builtin, cloudflare]
    netview_cf_team: aktasolutions.cloudflareaccess.com   # cloudflare_access.yml (2026-10-24)
    netview_cf_aud: 8375c22f885da275b33199b69162b781b7eaef18c61320c90c94383955584ed6
    # Approved admins as soon as they sign in: here the Cloudflare account's
    # email (the one the Access policy lets through) - [] for a fresh install.
    netview_admin_emails: "{{ [hostvars['cloudflare.com'].vault_win_user] if hostvars['cloudflare.com'].vault_win_user is defined else [] }}"
    # Sign-in methods from the deployment (more can be added in the app,
    # Admin > Sign-in methods). Secrets from the vault, e.g.:
    #   - {id: google, type: google, client_id: "...apps.googleusercontent.com",
    #      client_secret: "{{ vault_lens_google_secret }}"}
    #   - {id: entra, type: microsoft, tenant: "<tenant id>", client_id: "...",
    #      client_secret: "{{ vault_lens_entra_secret }}", auto_approve: true}
    #   - {id: corp, type: ldap, name: Corp AD, url: "ldaps://dc1.corp.example.com",
    #      bind_dn: "...", bind_password: "{{ vault_lens_ldap_bind }}",
    #      base_dn: "DC=corp,DC=example,DC=com", group_dn: "CN=Lens Users,..."}
    netview_auth_providers: []
    netview_session_days: 7
    # Exporter names as in akvorado_stack.yml: the firewall answers for the
    # internet, the Proxmox nodes' softflowd for LAN-to-LAN.
    netview_wan_exporter: opnsense
    netview_lan_exporters: [pve5, pve6]
    # Names for addresses the DHCP server doesn't know (static IPs) - these
    # win over the leases.
    netview_names:
      192.168.3.1: opnsense
      192.168.3.4: torrent
      192.168.3.5: lububntu
      192.168.3.7: docker-apps
      192.168.3.8: docker-apps2
      192.168.3.150: akvorado
      192.168.3.188: truenas
      192.168.3.236: pve5
      192.168.3.237: pve6

  pre_tasks:
    # Same login handling as akvorado_stack.yml.
    - name: Use the group default login for hosts without their own
      ansible.builtin.include_vars: "{{ playbook_dir }}/../inventory/group_vars/windows/vault.yml"
      when: vault_win_user is not defined
      tags: [always]

    - name: Check for the classic sudo (sudo.ws)
      ansible.builtin.raw: command -v sudo.ws
      vars:
        ansible_become: false
      register: sudo_ws
      changed_when: false
      failed_when: false
      tags: [always]

    - name: Use the classic sudo for privilege escalation
      ansible.builtin.set_fact:
        ansible_become_exe: sudo.ws
      when: sudo_ws.rc == 0
      tags: [always]

    - name: Gather facts
      ansible.builtin.setup:
        gather_subset: [min, selinux]

    - name: Check the Akvorado network is there
      ansible.builtin.command: docker network inspect akvorado_default --format '{% raw %}{{.Name}}{% endraw %}'
      changed_when: false
      register: akv_net
      failed_when: false

    - name: Stop if it isn't
      ansible.builtin.assert:
        that: akv_net.rc == 0
        fail_msg: "No akvorado_default Docker network - run akvorado_stack.yml on this host first."
        quiet: true

  tasks:
    # ------------------------------------------------------------- names
    - name: Read the firewall's DHCP leases (OPNsense API)
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/files/opnsense_leases_api.py"]
      environment:
        OPN_URL: "https://{{ netview_firewall }}"
        OPN_USER: "{{ hostvars[netview_firewall].vault_win_user | default('') }}"
        OPN_PASS: "{{ hostvars[netview_firewall].vault_win_password | default('') }}"
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      delegate_to: localhost
      register: leases
      changed_when: false
      failed_when: false
      no_log: true
      tags: [names]

    - name: Leases found
      ansible.builtin.debug:
        msg: >-
          {{ ('DHCP names: ' ~ ((leases.stdout | from_json).sources | default({}) | to_json))
             if leases.rc == 0 and (leases.stdout | default('')).startswith('{"names"')
             else 'No DHCP leases read from ' ~ netview_firewall ~ ' - static names only' }}
      tags: [names]

    - name: Project folder
      ansible.builtin.file:
        path: "{{ netview_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [names]

    - name: Write names.json
      ansible.builtin.copy:
        dest: "{{ netview_dir }}/names.json"
        owner: root
        group: root
        mode: "0644"
        # "static" names win over "names" (DHCP) - merged by the app.
        content: >-
          {{ {'names': dhcp, 'static': netview_names} | to_nice_json }}
      vars:
        dhcp: >-
          {{ (leases.stdout | from_json).names
             if leases.rc == 0 and (leases.stdout | default('')).startswith('{"names"') else {} }}
      tags: [names]

    # ------------------------------------------------------------- DNS
    - name: DNS collector key
      when: netview_dns | bool
      block:
        - name: Read the collector's key file
          ansible.builtin.stat:
            path: "{{ netview_dir }}/.env"
          register: env_file

        - name: netview API user on the firewall (and a key if there's none)
          ansible.builtin.command:
            argv: [python3, "{{ playbook_dir }}/files/opnsense_netview_user.py"]
          environment:
            OPN_URL: "https://{{ netview_firewall }}"
            OPN_USER: "{{ hostvars[netview_firewall].vault_win_user }}"
            OPN_PASS: "{{ hostvars[netview_firewall].vault_win_password }}"
            NETVIEW_NEED_KEY: "{{ '0' if env_file.stat.exists else '1' }}"
          vars:
            ansible_connection: local
            ansible_become: false
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          delegate_to: localhost
          register: netview_user
          changed_when: ((netview_user.stdout or "{}") | from_json).changed | default(false)
          failed_when: netview_user.rc != 0 or not netview_user.stdout.startswith('{')
          no_log: true

        - name: Firewall side
          ansible.builtin.debug:
            msg: "{{ (netview_user.stdout | from_json).log }}"

        - name: Write the key file
          ansible.builtin.copy:
            dest: "{{ netview_dir }}/.env"
            owner: root
            group: root
            mode: "0600"
            content: |
              # Managed by ansible-runner (netview_stack.yml) - OPNsense API key of user netview.
              OPN_KEY={{ (netview_user.stdout | from_json).key }}
              OPN_SECRET={{ (netview_user.stdout | from_json).secret }}
          when: not env_file.stat.exists
          register: key_file
          no_log: true

    # Compose needs the file even when the collector is off.
    - name: Empty key file (DNS collector off)
      ansible.builtin.copy:
        dest: "{{ netview_dir }}/.env"
        content: ""
        force: false
        owner: root
        group: root
        mode: "0600"
      when: not netview_dns | bool

    # ------------------------------------------------------------- sign-in
    # Made once and kept: the session secret (signs sessions and keys the
    # encryption of secrets stored from the Admin page - a new one logs
    # everyone out and those secrets must be entered again) and the
    # first-run setup token. Root only; delete the file to make new ones.
    - name: Session secret and setup token (made once)
      ansible.builtin.copy:
        dest: "{{ netview_dir }}/session.env"
        content: |
          # Managed by ansible-runner (netview_stack.yml) - made once, kept.
          SESSION_SECRET={{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['ascii_letters', 'digits']) }}
          SETUP_TOKEN={{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}
        force: false
        owner: root
        group: root
        mode: "0600"
      register: session_file
      no_log: true

    - name: Sign-in methods from the deployment (secrets - root only)
      ansible.builtin.copy:
        dest: "{{ netview_dir }}/auth.env"
        content: |
          # Managed by ansible-runner (netview_stack.yml) - changes are overwritten.
          AUTH_PROVIDERS={{ netview_auth_providers | to_json }}
        owner: root
        group: root
        mode: "0600"
      register: auth_file
      no_log: true

    # ------------------------------------------------------------- app
    # Docker CE on Rocky runs with SELinux support off (see akvorado_stack.yml);
    # the rule keeps the bind mount readable if that's turned on.
    - name: Label the project folder for containers (SELinux)
      when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
      block:
        - name: Store the label rule
          ansible.builtin.shell: >-
            semanage fcontext -l -C | grep -qF '{{ netview_dir }}(/.*)?' && echo present ||
            semanage fcontext -a -t container_file_t '{{ netview_dir }}(/.*)?'
          register: sefcontext
          changed_when: sefcontext.stdout != 'present'

        - name: Apply it
          ansible.builtin.command: restorecon -R {{ netview_dir }}
          changed_when: false

    - name: App source
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/netview/"
        dest: "{{ netview_dir }}/app/"
        owner: root
        group: root
        mode: u=rwX,go=rX
      register: app_src

    - name: Compose file
      ansible.builtin.copy:
        dest: "{{ netview_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible-runner (netview_stack.yml) - changes are overwritten.
          services:
            netview:
              build: ./app
              image: netview:local
              restart: unless-stopped
              init: true
              read_only: true
              ports:
                - {{ netview_port }}:8000/tcp
              env_file: [.env, session.env, auth.env]
              environment:
                CLICKHOUSE_URL: http://clickhouse:8123
                WAN_EXPORTER: {{ netview_wan_exporter }}
                LAN_EXPORTERS: {{ netview_lan_exporters | join(',') }}
                OPN_URL: "{{ ('https://' ~ netview_firewall) if netview_dns | bool else '' }}"
                # Our own lookups reach the firewall from this host's address.
                COLLECTOR_IP: {{ ansible_host | default(inventory_hostname) }}
                DNS_RETENTION_DAYS: "{{ netview_dns_retention_days }}"
                LIVE_INTERFACES: '{{ netview_live_interfaces | to_json }}'
                LIVE_TOP_IFACE: {{ netview_live_top_iface }}
                PUBLIC_URL: "{{ netview_public_url }}"
                AUTH_METHODS: "{{ netview_auth_methods | join(',') }}"
                CF_ACCESS_TEAM: "{{ netview_cf_team }}"
                CF_ACCESS_AUD: "{{ netview_cf_aud }}"
                ADMIN_EMAILS: "{{ netview_admin_emails | join(',') }}"
                SESSION_DAYS: "{{ netview_session_days }}"
              volumes:
                - ./names.json:/data/names.json:ro
              networks: [akvorado]
              logging:
                driver: json-file
                options: {max-size: 10m, max-file: "3"}
          networks:
            akvorado:
              external: true
              name: akvorado_default
      register: compose_file

    - name: Build and start
      ansible.builtin.command: docker compose up -d --build --wait
      args:
        chdir: "{{ netview_dir }}"
      when: app_src is changed or compose_file is changed or key_file is changed or session_file is changed or auth_file is changed
      changed_when: true

    - name: Make sure it's running
      ansible.builtin.command: docker compose up -d --wait
      args:
        chdir: "{{ netview_dir }}"
      register: up
      changed_when: "'Started' in up.stderr or 'Created' in up.stderr"

    # ------------------------------------------------------------- firewall
    - name: Check firewalld
      ansible.builtin.command: systemctl is-active firewalld
      register: firewalld_state
      changed_when: false
      failed_when: false

    - name: Open the web port
      ansible.posix.firewalld:
        port: "{{ netview_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      when: firewalld_state.stdout == 'active'

    # ------------------------------------------------------------ checks
    - name: Wait for the app (and its ClickHouse access)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ netview_port }}/api/health"
      register: health
      until: health is succeeded
      retries: 20
      delay: 3

    - name: Sign-in state
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ netview_port }}/auth/state"
      register: auth_state

    - name: Report
      ansible.builtin.debug:
        msg:
          - "Sentry Lens: http://{{ ansible_host | default(inventory_hostname) }}:{{ netview_port }}
             {{- (' and ' ~ netview_public_url) if netview_public_url else '' }}"
          - "Sign-in: {{ netview_auth_methods | join(' + ') }} - methods: {{
              ((auth_state.json.providers | map(attribute='name') | list) + auth_state.json.directory) | join(', ')
              or 'email + password only' }}"
          - "{{ 'FIRST RUN: open the login page and create the admin with the setup token - sudo grep SETUP_TOKEN '
                ~ netview_dir ~ '/session.env on ' ~ (ansible_host | default(inventory_hostname))
                if auth_state.json.setup else 'Admin exists - new accounts wait for approval on the Admin page' }}"
          - "ClickHouse {{ health.json.clickhouse }}, {{ health.json.names }} device names"
          - "DNS collector: {{ 'on' if health.json.dns.enabled else 'off' }}"
