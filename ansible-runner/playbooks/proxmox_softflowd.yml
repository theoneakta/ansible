---
# softflowd on the Proxmox nodes: NetFlow for everything crossing each node's
# LAN bridge - every VM on the node (VM-to-VM included) and its LAN traffic -
# to Akvorado (akvorado_stack.yml), without installing anything in the VMs.
# The firewall (opnsense_netflow.yml) covers what is routed; this covers the
# LAN-to-LAN traffic that never reaches it.
#
#   VMs --tap/fwpr--> vmbrN (promiscuous) <-- softflowd --NetFlow v9--> 192.168.3.150:2055
#
# The bridge is the one holding the node's default route (vmbr0 on pve6,
# vmbr1 on pve5). softflowd puts it in promiscuous mode, so the bridge hands
# it a copy of the frames it forwards between its ports, not only the
# node's own.
#
# Nodes are "SSH only" hosts with a per-host root login (Hosts and
# Credentials tabs), like proxmox_sniff.yml - root, no sudo.
#
# Run:  ./run.sh proxmox_softflowd.yml
#       ./run.sh proxmox_softflowd.yml -e softflowd_state=absent    (stop it)

- name: softflowd on the Proxmox nodes
  hosts: "{{ softflowd_nodes | default('192.168.3.236,192.168.3.237') }}"
  gather_facts: false
  vars:
    softflowd_state: present
    softflowd_collector: "192.168.3.150:2055"
    # Left out of the capture: the TrueNAS - its iSCSI/NFS storage traffic
    # would swamp the flows (same exclusion as proxmox_sniff.yml).
    softflowd_exclude_hosts: [192.168.3.188]
    # Same export settings as the Linux hosts (linux_software.yml).
    softflowd_options: >-
      -n {{ softflowd_collector }} -v 9 -t maxlife=60
      {{ ('not ( ' ~ (softflowd_exclude_hosts | map('regex_replace', '^', 'host ') | join(' or ')) ~ ' )')
         if softflowd_exclude_hosts else '' }}

  tasks:
    - name: Check the parameters
      ansible.builtin.assert:
        that:
          - softflowd_state in ['present', 'absent']
          - softflowd_collector is match('^\d{1,3}(\.\d{1,3}){3}:\d{1,5}$')
          - softflowd_exclude_hosts | select('match', '^\d{1,3}(\.\d{1,3}){3}$') | list | length == softflowd_exclude_hosts | length
        fail_msg: "Collector is IPv4 address:port, excluded hosts IPv4 addresses."

    - name: Check this is a Proxmox node, as root
      ansible.builtin.command: pveversion
      changed_when: false

    - name: Gather facts (default route)
      ansible.builtin.setup:
        gather_subset: [min, network]

    - name: Install softflowd
      ansible.builtin.apt:
        name: softflowd
        update_cache: true
        cache_valid_time: 3600
      when: softflowd_state == 'present'

    # Debian's generator starts one softflowd@<name> per /etc/softflowd/*.conf
    # under softflowd.service.
    - name: Configure the instance
      ansible.builtin.copy:
        dest: /etc/softflowd/default.conf
        mode: "0644"
        content: |
          # Managed by ansible-runner (proxmox_softflowd.yml) - changes are overwritten.
          interface='{{ ansible_facts['default_ipv4']['interface'] }}'
          options='{{ softflowd_options | trim }}'
      register: softflowd_conf
      when: softflowd_state == 'present'

    - name: Start softflowd now and at boot
      ansible.builtin.systemd_service:
        name: softflowd
        state: "{{ 'restarted' if softflowd_conf is changed else 'started' }}"
        enabled: true
        daemon_reload: true
      when: softflowd_state == 'present'

    - name: Stop softflowd
      ansible.builtin.systemd_service:
        name: softflowd
        state: stopped
        enabled: false
      failed_when: false
      when: softflowd_state == 'absent'

    - name: Check it runs
      ansible.builtin.command: pgrep -a softflowd
      register: softflowd_proc
      changed_when: false
      failed_when: (softflowd_proc.rc == 0) != (softflowd_state == 'present')

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ softflowd_proc.stdout if softflowd_state == 'present' else 'softflowd stopped and disabled.' }}
