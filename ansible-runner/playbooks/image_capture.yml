---
# Turns the sysprepped template from image_build.yml (same image_id - a key
# under `images:` in inventory/image.yml) into pxe/data/images/<image_id>.wim,
# the image the PXE server deploys.
#
# How: clone the template on Proxmox, point the clone's MAC at a capture-mode
# iPXE script (pxe/data/hosts/<mac>.ipxe), network-boot it. WinPE (from the
# Windows ISO, via wimboot) runs capture.cmd: DISM-captures the clone's
# Windows volume straight onto the \\<server>\images share, writes
# capture-result.txt and powers off. The clone is always deleted afterwards.
# The template itself is never booted, so it stays generalized for the next
# capture.
#
# First run also extracts WinPE (boot.wim, BCD, boot.sdi) from the ISO copy
# in pxe/data/iso/ - deploy needs the same files.

- name: Capture a Windows image to WIM
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../inventory/image.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/windows/vault.yml"
  vars:
    image_id: win11
    img: "{{ images[image_id] }}"
    pxe_data: /ansible/pxe
    # The node the image's template was built on (see image_build.yml).
    build_node: "{{ img.node | default(proxmox_node) }}"
    node_api: "{{ proxmox_api_url }}/nodes/{{ build_node }}"
    proxmox_headers:
      Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ vault_proxmox_token_secret | default('') }}"

  tasks:
    - name: Check the image and the Proxmox token
      ansible.builtin.assert:
        that:
          - image_id in images
          - img.os | default('windows') == 'windows'
          - (vault_proxmox_token_secret | default('')) | length > 0
        fail_msg: >-
          Unknown image_id, a Linux image (those use image_publish_linux.yml),
          or no Proxmox API token secret (set it on the Windows Image tab).
        quiet: true

    # ---------------------------------------------------------------- WinPE
    - name: Check whether WinPE has been extracted already
      ansible.builtin.stat:
        path: "{{ pxe_data }}/winpe/sources/boot.wim"
      register: winpe_wim

    - name: Extract WinPE from the Windows ISO
      when: not winpe_wim.stat.exists
      block:
        # The ISO of the Windows image being captured - not just any ISO in
        # that folder, which may also hold Linux ISOs (no WinPE in those).
        - name: Check the image's ISO copy is in pxe/data/iso/
          ansible.builtin.stat:
            path: "{{ pxe_data }}/iso/{{ img.iso.split('/') | last }}"
          register: winpe_iso

        - name: Fail if there's no ISO to extract from
          ansible.builtin.fail:
            msg: >-
              No WinPE yet and no ISO to take it from: copy {{ img.iso.split('/') | last }}
              (the same ISO that's on Proxmox) into pxe/data/iso/ on the Docker host.
          when: not winpe_iso.stat.exists

        - name: Extract boot.wim, BCD and boot.sdi (case-insensitive; names normalized to lower case)
          ansible.builtin.shell:
            cmd: |
              set -e
              out="{{ pxe_data }}/winpe"
              tmp="$(mktemp -d)"
              7z x -y -ssc- -o"$tmp" "{{ winpe_iso.stat.path }}" boot/bcd boot/boot.sdi sources/boot.wim >/dev/null
              mkdir -p "$out/boot" "$out/sources"
              mv "$(find "$tmp" -ipath '*/boot/bcd')"         "$out/boot/bcd"
              mv "$(find "$tmp" -ipath '*/boot/boot.sdi')"    "$out/boot/boot.sdi"
              mv "$(find "$tmp" -ipath '*/sources/boot.wim')" "$out/sources/boot.wim"
              rm -rf "$tmp"
          args:
            creates: "{{ pxe_data }}/winpe/sources/boot.wim"

    # ------------------------------------------------------------- template
    # The pxe container builds winpe/build/capture.wim (plain WinPE with
    # capture.cmd baked in) in the background once boot.wim is extracted -
    # see pxe/entrypoint.sh. Wait for it rather than boot a clone into nothing.
    - name: Wait for the PXE server's capture WinPE to be built
      ansible.builtin.stat:
        path: "{{ pxe_data }}/winpe/build/capture.wim"
      register: capture_wim
      until: capture_wim.stat.exists
      retries: 40
      delay: 30

    - name: Check the template exists
      ansible.builtin.uri:
        url: "{{ node_api }}/qemu/{{ img.template_vmid }}/config"
        headers: "{{ proxmox_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        status_code: [200, 500]
      register: template_cfg
      no_log: true

    - name: Fail if there's no template to capture
      ansible.builtin.fail:
        msg: "No template at VM {{ img.template_vmid }} on {{ build_node }} - run Build first."
      when: template_cfg.status != 200 or (template_cfg.json.data.template | default(0) | int) != 1

    # ------------------------------------------------- leftover capture VM
    - name: Look for a leftover capture VM
      ansible.builtin.uri:
        url: "{{ node_api }}/qemu/{{ image_capture_vmid }}/status/current"
        headers: "{{ proxmox_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        status_code: [200, 500]
      register: leftover
      no_log: true

    - name: Remove the leftover capture VM
      ansible.builtin.include_tasks: tasks/proxmox_destroy_vm.yml
      vars:
        vmid: "{{ image_capture_vmid }}"
        vm_running: "{{ leftover.json.data.status | default('') == 'running' }}"
      when: leftover.status == 200

    # ---------------------------------------------------------------- clone
    - name: Clone the template
      ansible.builtin.uri:
        url: "{{ node_api }}/qemu/{{ img.template_vmid }}/clone"
        method: POST
        headers: "{{ proxmox_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        body_format: form-urlencoded
        body:
          newid: "{{ image_capture_vmid }}"
          name: "{{ img.template_name }}-capture"
          full: "{{ 1 if image_capture_full_clone | bool else 0 }}"
      register: clone_task
      no_log: true

    - name: Wait for the clone to finish
      ansible.builtin.include_tasks: tasks/proxmox_wait_task.yml
      vars:
        upid: "{{ clone_task.json.data }}"

    - name: Capture
      block:
        - name: Network-boot the clone
          ansible.builtin.uri:
            url: "{{ node_api }}/qemu/{{ image_capture_vmid }}/config"
            method: POST
            headers: "{{ proxmox_headers }}"
            validate_certs: "{{ proxmox_validate_certs }}"
            body_format: form-urlencoded
            body:
              boot: order=net0
          no_log: true

        - name: Read the clone's MAC address
          ansible.builtin.uri:
            url: "{{ node_api }}/qemu/{{ image_capture_vmid }}/config"
            headers: "{{ proxmox_headers }}"
            validate_certs: "{{ proxmox_validate_certs }}"
          register: clone_cfg
          no_log: true

        - name: Remember the MAC in iPXE's ${mac:hexhyp} form
          ansible.builtin.set_fact:
            capture_mac: "{{ clone_cfg.json.data.net0 | regex_search('([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}') | lower | replace(':', '-') }}"

        - name: Point that MAC at capture mode on the PXE server
          ansible.builtin.copy:
            dest: "{{ pxe_data }}/hosts/{{ capture_mac }}.ipxe"
            mode: "0644"
            content: |
              #!ipxe
              # Written by image_capture.yml for the capture clone; removed when it finishes.
              set base http://{{ pxe_server_ip }}:{{ pxe_http_port }}
              # -n: the BCD loads \boot.wim - see pxe/templates/boot.ipxe.
              kernel ${base}/wimboot
              initrd -n bootmgfw.efi ${base}/winpe/build/bootmgfw.efi
              initrd -n BCD          ${base}/winpe/boot/bcd
              initrd -n boot.sdi     ${base}/winpe/boot/boot.sdi
              initrd -n boot.wim     ${base}/winpe/build/capture.wim
              boot

        - name: Clear the previous capture result
          ansible.builtin.file:
            path: "{{ pxe_data }}/images/capture-result.txt"
            state: absent

        - name: Start the clone
          ansible.builtin.uri:
            url: "{{ node_api }}/qemu/{{ image_capture_vmid }}/status/start"
            method: POST
            headers: "{{ proxmox_headers }}"
            validate_certs: "{{ proxmox_validate_certs }}"
          register: start_task
          no_log: true

        # The start call returns before the VM is up; without waiting, the
        # first poll below still saw "stopped", took that as "WinPE done",
        # and the clone was deleted mid-boot - confirmed live.
        - name: Wait for the clone to be running
          ansible.builtin.include_tasks: tasks/proxmox_wait_task.yml
          vars:
            upid: "{{ start_task.json.data }}"

        # On a clone's very first power-on its PXE DHCP broadcasts never
        # reached the PXE server ("PXE-E16: No valid offer received", nothing
        # in dnsmasq's log for that MAC) - twice in a row, confirmed live -
        # while after a reset the same clone network-booted fine. Cause not
        # pinned down (not STP: off, forward delay 0); a reset is harmless
        # here, so just do it.
        - name: Give the first boot attempt time, then reset the clone once
          ansible.builtin.pause:
            seconds: 30

        - name: Reset the clone (its second boot reaches the PXE server)
          ansible.builtin.uri:
            url: "{{ node_api }}/qemu/{{ image_capture_vmid }}/status/reset"
            method: POST
            headers: "{{ proxmox_headers }}"
            validate_certs: "{{ proxmox_validate_certs }}"
          no_log: true

        - name: Wait for WinPE to capture and power off (up to 2 hours)
          ansible.builtin.uri:
            url: "{{ node_api }}/qemu/{{ image_capture_vmid }}/status/current"
            headers: "{{ proxmox_headers }}"
            validate_certs: "{{ proxmox_validate_certs }}"
          register: clone_state
          until: clone_state.json.data.status == 'stopped'
          retries: 360
          delay: 20
          no_log: true

        - name: Read the capture result
          ansible.builtin.slurp:
            src: "{{ pxe_data }}/images/capture-result.txt"
          register: capture_result
          failed_when: false

        - name: Fail if WinPE didn't report success
          ansible.builtin.fail:
            msg: >-
              Capture failed (capture-result.txt:
              {{ (capture_result.content | default('') | b64decode | trim) or 'missing - WinPE never reached the share' }}).
              Open the clone's console in Proxmox and re-run with the clone kept to see why.
          when: (capture_result.content | default('') | b64decode | trim) != 'OK'

        # WinPE always writes capture.wim (capture.cmd is the same for every
        # image); name it after the image only once it's known good.
        - name: Store the capture as {{ image_id }}.wim
          ansible.builtin.command:
            cmd: mv -f {{ pxe_data }}/images/capture.wim {{ pxe_data }}/images/{{ image_id }}.wim

        - name: Check the image file
          ansible.builtin.stat:
            path: "{{ pxe_data }}/images/{{ image_id }}.wim"
          register: wim

        - name: Report
          ansible.builtin.debug:
            msg: >-
              Captured {{ image_id }}.wim ({{ (wim.stat.size / 1073741824) | round(1) }} GB).
              PCs can now PXE-boot and pick "Deploy {{ img.label }}".
      always:
        - name: Remove the capture-mode iPXE override
          ansible.builtin.file:
            path: "{{ pxe_data }}/hosts/{{ capture_mac }}.ipxe"
            state: absent
          when: capture_mac is defined

        - name: Check the clone's state
          ansible.builtin.uri:
            url: "{{ node_api }}/qemu/{{ image_capture_vmid }}/status/current"
            headers: "{{ proxmox_headers }}"
            validate_certs: "{{ proxmox_validate_certs }}"
            status_code: [200, 500]
          register: final_state
          no_log: true

        - name: Delete the clone
          ansible.builtin.include_tasks: tasks/proxmox_destroy_vm.yml
          vars:
            vmid: "{{ image_capture_vmid }}"
            vm_running: "{{ final_state.json.data.status | default('') == 'running' }}"
          when: final_state.status == 200
