---
# Country blocking on the OPNsense firewall, both ways:
#
#   LAN device --> GeoBlock country       rejected (fails fast instead of hanging)
#   GeoBlock country --> WAN / PIA tunnel  blocked
#
# A GeoIP alias "GeoBlock" of geoblock_countries (ISO codes, IPv4 + IPv6),
# with the registries' lists of the same countries and geoblock_asns nested
# alongside it in "GeoBlock_All", and logged rules on that ahead of
# everything else on those interfaces - including the
# PIA route rule, which this moves to sequence 10/11 if it's lower (see
# playbooks/files/opnsense_geoblock_api.py). The blocks show up in Firewall >
# Log Files > Live View under "GeoBlock:".
#
# Needs the GeoLite2 database on the firewall first (Firewall > Aliases >
# GeoIP settings, the MaxMind CSV URL with a license key) - stops otherwise.
#
# Through the OPNsense API (the root web login), like SentryLens deploy: firewall.yml.
# Re-running it updates in place.
#
# Run:  ./run.sh opnsense_geoblock.yml
#       ./run.sh opnsense_geoblock.yml -e '{"geoblock_exempt": ["192.168.3.4"]}'
#       ./run.sh opnsense_geoblock.yml -e geoblock_state=absent      (remove it all)

- name: Country blocking on OPNsense
  hosts: "{{ geoblock_opnsense | default('firewall') }}"
  gather_facts: false
  vars:
    geoblock_state: present
    # Russia, China, North Korea, Iran, Belarus (2026-10-24).
    geoblock_countries: "{{ site_geoblock_countries }}"  # site.yml
    geoblock_outbound: true
    # MaxMind (the GeoIP alias) places some of these countries' networks
    # elsewhere - those in occupied Ukraine under UA. Also block the
    # registries' allocations for the countries (ipdeny.com, daily)...
    geoblock_rir: true
    # ...and networks by AS number that neither list has: Russian-registered
    # ISPs in occupied Donbas / Crimea on Ukrainian-allocated addresses, seen
    # getting through on 2026-10-25 (Sentry Lens): Don Apex, Timer, IP
    # Service, Apex Group.
    geoblock_asns: "{{ site_geoblock_asns | default([]) }}"  # site.yml
    # LAN hosts the outbound rule leaves alone (e.g. the torrent box).
    geoblock_exempt: []
    # Interface keys (config.xml) blocked inbound: the WAN and the PIA tunnel.
    geoblock_inbound_interfaces: "{{ site_firewall_wan_interfaces }}"  # site.yml

  tasks:
    - name: Check the parameters
      ansible.builtin.assert:
        that:
          - geoblock_state in ['present', 'absent']
          - geoblock_state == 'absent' or geoblock_countries | length > 0
          - geoblock_countries | select('match', '^[A-Z]{2}$') | list | length == geoblock_countries | length
          - geoblock_exempt | select('match', '^\d{1,3}(\.\d{1,3}){3}$') | list | length == geoblock_exempt | length
          - geoblock_asns | map('string') | select('match', '^\d{1,10}$') | list | length == geoblock_asns | length
          - vault_win_user is defined
        fail_msg: >-
          Bad parameters (countries are two-letter ISO codes, exempt hosts IPv4 addresses), or no
          root login for {{ inventory_hostname }} (a per-host root login on the Credentials tab).

    - name: Country blocking (OPNsense API)
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/files/opnsense_geoblock_api.py"]
      environment:
        OPN_URL: "https://{{ inventory_hostname }}"
        OPN_USER: "{{ vault_win_user }}"
        OPN_PASS: "{{ vault_win_password }}"
        GEOBLOCK_PARAMS: "{{ {'state': geoblock_state, 'countries': geoblock_countries,
                              'outbound': geoblock_outbound | bool, 'exempt': geoblock_exempt,
                              'inbound_interfaces': geoblock_inbound_interfaces,
                              'rir': geoblock_rir | bool, 'asns': geoblock_asns} | to_json }}"
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      delegate_to: localhost
      register: geoblock_api
      changed_when: ((geoblock_api.stdout or "{}") | from_json).changed | default(false)
      failed_when: false
      no_log: true

    - name: Result
      ansible.builtin.debug:
        msg: "{{ (geoblock_api.stdout or '{}') | from_json if geoblock_api.stdout else geoblock_api.stderr_lines[-5:] }}"
      failed_when: geoblock_api.rc != 0
