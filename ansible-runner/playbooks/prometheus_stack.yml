---
# Prometheus on the collector, next to Akvorado and Sentry Lens: scrapes the
# node_exporters (node_exporter.yml) and keeps the metrics prometheus_retention;
# Sentry Lens's Infrastructure section reads them over the Akvorado Docker
# network (http://prometheus:9090) - nothing is published on the LAN (the UI
# and API on 127.0.0.1:9090 only, for a look over SSH).
#
#   node_exporter :9100 (Linux servers, Proxmox nodes) <-- prometheus <-- netview
#
# Targets come from the inventory (prometheus_node_hosts), named with
# prometheus_names; Prometheus re-reads the target file by itself, so adding a
# host is a re-run of this playbook. CIS-friendly: read-only container, an
# unprivileged UID, the data in one root-owned folder handed to that UID.
#
# Prerequisite: akvorado_stack.yml on the same host (its Docker network).
# Run:  ./run.sh prometheus_stack.yml                  (192.168.3.150)

- name: Prometheus
  hosts: "{{ prometheus_host | default('monitoring') }}"
  become: true
  gather_facts: false
  vars:
    prometheus_dir: /opt/prometheus
    prometheus_image: prom/prometheus:v3.5.1   # the 3.5 long-term-support line
    prometheus_retention: 30d
    prometheus_scrape_interval: 30s
    # Hosts running node_exporter (port 9100): the Linux hosts and the
    # hypervisors (inventory groups, see inventory/group_vars/all/site.yml).
    prometheus_node_hosts: "{{ (groups['linux'] | default([]) + site_hypervisors + groups['remote_linux'] | default([])) | unique }}"
    prometheus_node_port: 9100
    # Docker hosts running cAdvisor (cadvisor.yml, port 9338) - the containers.
    prometheus_cadvisor_hosts: "{{ site_docker_hosts }}"
    prometheus_cadvisor_port: 9338
    # flowd's metrics (flowd_stack.yml), by container name on akvorado_default.
    prometheus_flowd_targets: ["flowd-flowd-1:8080"]
    # Display names (node_exporter also reports each host's own name).
    prometheus_names: "{{ site_names | default({}) }}"
    # A role per host, for grouping in Sentry Lens.
    prometheus_roles: "{{ dict(site_hypervisors | product(['hypervisor'])) }}"

  pre_tasks:
    # Same login handling as akvorado_stack.yml.
    - name: Use the group default login for hosts without their own
      ansible.builtin.include_vars: "{{ playbook_dir }}/../inventory/group_vars/windows/vault.yml"
      when: vault_win_user is not defined

    - name: Check for the classic sudo (sudo.ws)
      ansible.builtin.raw: command -v sudo.ws
      check_mode: false  # read-only: also in a dry run
      vars:
        ansible_become: false
      register: sudo_ws
      changed_when: false
      failed_when: false

    - name: Use the classic sudo for privilege escalation
      ansible.builtin.set_fact:
        ansible_become_exe: sudo.ws
      when: sudo_ws.rc == 0

    - name: Gather facts
      ansible.builtin.setup:
        gather_subset: [min, selinux]

    - name: Check the Akvorado network is there
      ansible.builtin.command: docker network inspect akvorado_default --format '{% raw %}{{.Name}}{% endraw %}'
      check_mode: false
      changed_when: false
      register: akv_net
      failed_when: false

    - name: Stop if it isn't
      ansible.builtin.assert:
        that: akv_net.rc == 0
        fail_msg: "No akvorado_default Docker network - run akvorado_stack.yml on this host first."
        quiet: true

  tasks:
    - name: Folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ prometheus_dir }}", owner: root, mode: "0755"}
        - {path: "{{ prometheus_dir }}/config", owner: root, mode: "0755"}
        - {path: "{{ prometheus_dir }}/data", owner: "65534", mode: "0750"}  # the image's "nobody"

    - name: Label the folder for containers (SELinux)
      when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
      block:
        - name: Store the label rule
          ansible.builtin.shell: >-
            semanage fcontext -l -C | grep -qF '{{ prometheus_dir }}(/.*)?' && echo present ||
            semanage fcontext -a -t container_file_t '{{ prometheus_dir }}(/.*)?'
          register: sefcontext
          changed_when: sefcontext.stdout != 'present'

        - name: Apply it
          ansible.builtin.command: restorecon -R {{ prometheus_dir }}
          changed_when: false

    - name: Scrape configuration
      ansible.builtin.copy:
        dest: "{{ prometheus_dir }}/config/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible-runner (prometheus_stack.yml) - changes are overwritten.
          global:
            scrape_interval: {{ prometheus_scrape_interval }}
            evaluation_interval: {{ prometheus_scrape_interval }}
          scrape_configs:
            - job_name: prometheus
              static_configs: [{targets: ["localhost:9090"]}]
            - job_name: node
              file_sd_configs: [{files: ["/etc/prometheus/node_targets.json"]}]
            - job_name: cadvisor
              file_sd_configs: [{files: ["/etc/prometheus/cadvisor_targets.json"]}]
          {% if prometheus_flowd_targets | length %}
            # flowd (flowd_stack.yml), on the same Docker network: datagrams, decode
            # errors, rows written and waiting, forwarding.
            - job_name: flowd
              static_configs: [{targets: {{ prometheus_flowd_targets | to_json }}}]
          {% endif %}
      register: prom_config

    - name: node_exporter targets (re-read by Prometheus by itself)
      ansible.builtin.copy:
        dest: "{{ prometheus_dir }}/config/node_targets.json"
        owner: root
        group: root
        mode: "0644"
        content: |
          [
          {% for h in prometheus_node_hosts %}
            {"targets": ["{{ hostvars[h].ansible_host | default(h) }}:{{ prometheus_node_port }}"],
             "labels": {"host": {{ prometheus_names.get(h, h) | to_json }}, "role": {{ prometheus_roles.get(h, 'server') | to_json }}}}{{ '' if loop.last else ',' }}
          {% endfor %}
          ]

    - name: cAdvisor targets
      ansible.builtin.copy:
        dest: "{{ prometheus_dir }}/config/cadvisor_targets.json"
        owner: root
        group: root
        mode: "0644"
        content: |
          [
          {% for h in prometheus_cadvisor_hosts %}
            {"targets": ["{{ hostvars[h].ansible_host | default(h) }}:{{ prometheus_cadvisor_port }}"], "labels": {"host": {{ prometheus_names.get(h, h) | to_json }}}}{{ '' if loop.last else ',' }}
          {% endfor %}
          ]

    - name: Compose file
      ansible.builtin.copy:
        dest: "{{ prometheus_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible-runner (prometheus_stack.yml) - changes are overwritten.
          services:
            prometheus:
              image: {{ prometheus_image }}
              restart: unless-stopped
              read_only: true
              user: "65534:65534"
              command:
                - --config.file=/etc/prometheus/prometheus.yml
                - --storage.tsdb.path=/prometheus
                - --storage.tsdb.retention.time={{ prometheus_retention }}
                - --web.enable-lifecycle
              ports:
                - 127.0.0.1:9090:9090/tcp
              volumes:
                - ./config:/etc/prometheus:ro
                - ./data:/prometheus
              networks: [akvorado]
              logging:
                driver: json-file
                options: {max-size: 10m, max-file: "3"}
          networks:
            akvorado:
              external: true
              name: akvorado_default
      register: prom_compose

    - name: Start (or update)
      ansible.builtin.command: docker compose up -d --wait
      args:
        chdir: "{{ prometheus_dir }}"
      register: prom_up
      changed_when: "'Started' in prom_up.stderr or 'Created' in prom_up.stderr or 'Recreated' in prom_up.stderr"

    - name: Reload the configuration
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/reload
        method: POST
      when: prom_config is changed and prom_up is not changed

    - name: Wait for the targets' first scrape
      ansible.builtin.uri:
        url: "http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22node%22%7D"
        return_content: true
      register: prom_up_q
      until: prom_up_q.json.data.result | length > 0
      retries: 20
      delay: 5

    - name: Report
      ansible.builtin.debug:
        msg:
          - "Prometheus {{ prometheus_image }} - {{ prometheus_retention }} kept, scraping every {{ prometheus_scrape_interval }}"
          - "node_exporter up: {{ prom_up_q.json.data.result | selectattr('value.1', 'equalto', '1') | map(attribute='metric.host', default='') | select | unique | sort | join(', ') }}"
          - "down: {{ prom_up_q.json.data.result | selectattr('value.1', 'equalto', '0') | map(attribute='metric.host', default='') | sort | join(', ') or 'none' }}"
