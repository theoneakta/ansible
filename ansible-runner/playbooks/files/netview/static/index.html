<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentry Lens</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<style>
  /* Surfaces: the ansible-runner GUI's. Series: the dataviz reference palette,
     dark steps, fixed order (validated on #131a24: adjacent CVD dE >= 8.4,
     normal-vision >= 19.3, all >= 3:1); "other" is neutral. */
  :root {
    color-scheme: dark;
    --bg: #0b0f16;
    --surface: #131a24;
    --surface2: #1a2330;
    --border: #262f3d;
    --text: #e6edf3;
    --muted: #8b96a5;
    --accent2: #ffb454;
    --link: #79b8ff;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --other: #5c6675;
    --fail: #f85149;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; font-size: 14px;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .7rem 1.4rem;
    background: linear-gradient(120deg, #1a0d0d, #1c1108 70%);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 1.15rem; letter-spacing: .02em; display: flex; align-items: center; gap: .55rem; }
  header h1 img { width: 30px; height: 30px; filter: drop-shadow(0 2px 8px #ff5c4d55); }
  header h1 a { color: inherit; display: flex; align-items: center; gap: .55rem; }
  header h1 a:hover { text-decoration: none; }
  .who { display: flex; align-items: center; gap: .6rem; font-size: .8rem; color: var(--muted); }
  .who a { color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: .2rem .65rem; }
  .who a:hover { color: var(--text); text-decoration: none; }
  header h1 span { color: var(--accent2); }
  nav { display: flex; gap: .25rem; flex-wrap: wrap; }
  nav a { color: var(--muted); padding: .35rem .8rem; border-radius: 999px; border: 1px solid transparent; }
  nav a.active { color: var(--text); border-color: var(--border); background: var(--surface); }
  nav a:hover { text-decoration: none; color: var(--text); }
  nav a .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--s3); margin-right: .35rem; vertical-align: 1px; }
  .spacer { flex: 1; }
  .timebar { display: flex; align-items: center; gap: .5rem; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
  .seg button {
    background: var(--surface); color: var(--muted); border: 0; padding: .3rem .7rem; cursor: pointer; font: inherit; font-size: .85rem;
  }
  .seg button.active { background: var(--surface2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent2); }
  .seg button:disabled { opacity: .4; cursor: default; }

  main { padding: 1.4rem; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
  h2 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: .8rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; min-width: 0; }
  .head { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .9rem; }
  .row { display: grid; gap: 1.25rem; }
  .row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row.split { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .row.half { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* Title + KPI strip: no card, just air. */
  .hero { display: flex; align-items: flex-end; gap: 2rem; flex-wrap: wrap; }
  .hero .title { flex: 1 1 260px; }
  .hero .sub { color: var(--muted); font-size: .85rem; margin-top: .25rem; }
  .kpis { display: flex; gap: 2rem; flex-wrap: wrap; }
  .kpi .v { font-size: 1.45rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: .75rem; color: var(--muted); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .4rem; vertical-align: 0; flex: none; }

  .chips { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: .4rem; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 999px; padding: .2rem .35rem .2rem .7rem; font-size: .85rem;
  }
  .chip b { font-weight: 500; color: var(--muted); }
  .chip button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 .25rem; }
  .chip button:hover { color: var(--text); }
  .crumb { color: var(--muted); font-size: .85rem; }

  .tabs { display: flex; gap: .2rem; border-bottom: 1px solid var(--border); margin: -.2rem 0 .8rem; overflow-x: auto; }
  .tabs button {
    background: none; border: 0; color: var(--muted); font: inherit; padding: .5rem .8rem; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent2); }
  .tabs button:hover { color: var(--text); }

  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .42rem .5rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: .75rem; }
  tbody tr:last-child td { border-bottom: 0; }
  th.sort { cursor: pointer; } th.sort:hover { color: var(--text); }
  td.n, th.n { text-align: right; }
  tr[data-href] { cursor: pointer; }
  tbody tr:hover td { background: var(--surface2); }
  .bar { height: 3px; border-radius: 2px; background: var(--s1); margin-top: 3px; opacity: .7; }
  .tag { font-size: .7rem; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 .3rem; margin-left: .3rem; }
  .tag.risk { border-color: var(--fail); color: var(--text); }
  .name { font-weight: 500; }
  .ip { color: var(--muted); font-size: .8rem; margin-left: .4rem; }
  .more { background: none; border: 0; color: var(--link); cursor: pointer; font: inherit; font-size: .85rem; padding: .5rem 0 0; }
  input.filter {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
    padding: .4rem .7rem; font: inherit; width: 320px; max-width: 100%;
  }
  input.filter:focus { outline: 2px solid var(--accent2); outline-offset: -1px; }
  .filterbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1rem; }
  .drop { display: flex; flex-direction: column; gap: .2rem; font-size: .72rem; color: var(--muted); }
  .drop select {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
    padding: .38rem .5rem; font: inherit; font-size: .85rem; min-width: 130px; max-width: 220px;
  }
  .drop select.on { border-color: var(--accent2); }
  .drop select:focus { outline: 2px solid var(--accent2); outline-offset: -1px; }
  .filterbar input.filter { width: 220px; }
  .clear { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: .38rem .7rem; font: inherit; font-size: .85rem; cursor: pointer; }
  .clear:hover { color: var(--text); }
  .multi { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .multi button {
    background: var(--surface2); color: var(--muted); border: 0; border-right: 1px solid var(--border);
    padding: .38rem .65rem; font: inherit; font-size: .85rem; cursor: pointer;
  }
  .multi button:last-child { border-right: 0; }
  .multi button.on { background: #ffb4541f; color: var(--text); box-shadow: inset 0 -2px 0 var(--accent2); }
  .multi button .n { color: var(--muted); font-size: .75rem; margin-left: .3rem; }
  .iface.dim { opacity: .45; }
  .err { color: var(--fail); }
  .loading { opacity: .55; transition: opacity .2s; }
  .chart { width: 100%; position: relative; min-height: 60px; }
  .hint { font-size: .75rem; color: var(--muted); margin: .6rem 0 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; margin-top: .7rem; font-size: .82rem; }
  .legend a, .legend span.item { color: var(--text); display: inline-flex; align-items: center; }
  .legend a:hover { text-decoration: underline; }
  .legend .v { color: var(--muted); margin-left: .35rem; font-variant-numeric: tabular-nums; }

  /* Donut: the ring, a center readout, a legend list beside it. */
  .donut { display: flex; gap: 1rem; align-items: center; }
  .donut svg { width: 132px; height: 132px; flex: none; }
  .donut path { cursor: pointer; transition: opacity .15s; }
  .donut svg:hover path { opacity: .55; }
  .donut svg path:hover { opacity: 1; }
  .donut .center-v { font-size: 15px; font-weight: 600; fill: var(--text); }
  .donut .center-l { font-size: 10px; fill: var(--muted); }
  .dleg { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .3rem; font-size: .82rem; }
  .dleg a, .dleg span.item { color: var(--text); display: flex; align-items: center; min-width: 0; }
  .dleg .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .dleg .pct { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: .5rem; }
  .empty { color: var(--muted); font-size: .85rem; padding: 2rem 0; text-align: center; }

  .tip {
    position: absolute; pointer-events: none; z-index: 5; background: #0b0f16f2; border: 1px solid var(--border);
    border-radius: 8px; padding: .45rem .6rem; font-size: .78rem; white-space: nowrap; display: none;
    font-variant-numeric: tabular-nums; box-shadow: 0 4px 16px #0008;
  }
  .tip .t { color: var(--muted); margin-bottom: .25rem; }
  .tip .r { display: flex; justify-content: space-between; gap: 1rem; }
  .uplot { font-family: inherit; }
  .u-select { background: #ffb45422; border-left: 1px solid var(--accent2); border-right: 1px solid var(--accent2); }

  .ifaces { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .iface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .7rem .9rem; cursor: pointer; }
  .iface.active { border-color: var(--accent2); }
  .iface .lbl { font-size: .78rem; color: var(--muted); display: flex; justify-content: space-between; }
  .iface .rates { display: flex; gap: 1rem; font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: .2rem 0; }
  .iface svg { width: 100%; height: 30px; display: block; }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--s3); margin-right: .4rem; animation: pulse 2s infinite; vertical-align: 2px; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  @media (max-width: 1000px) { .row.three { grid-template-columns: 1fr 1fr; } .row.split { grid-template-columns: 1fr; } }
  @media (max-width: 680px) {
    .row.three, .row.half { grid-template-columns: 1fr; }
    main { padding: 1rem; } header { padding-left: 1rem; padding-right: 1rem; }
    .kpis { gap: 1.2rem; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="#/" title="Sentry Lens"><img src="/static/logo.svg" alt="">Sentry <span>Lens</span></a></h1>
  <nav>
    <a href="#/" data-page="explore">Overview</a>
    <a href="#/live" data-page="live"><span class="dot"></span>Live</a>
    <a href="#/hosts" data-page="hosts">Devices</a>
    <a href="#/sites" data-page="sites">Websites</a>
    <a href="#/new" data-page="new">New today</a>
  </nav>
  <div class="spacer"></div>
  <div class="timebar" id="timebar">
    <span id="zoom"></span>
    <div class="seg" id="scopes" title="Which traffic: through the internet, between LAN devices, or both">
      <button data-s="internet">Internet</button><button data-s="lan">LAN</button><button data-s="all">All</button>
    </div>
    <div class="seg" id="ranges">
      <button data-r="1h">1h</button><button data-r="6h">6h</button>
      <button data-r="24h">24h</button><button data-r="7d">7d</button>
    </div>
  </div>
  <div class="who" id="who"></div>
</header>
<main id="main"></main>

<script>
const $main = document.getElementById("main");
// Who's signed in (Cloudflare Access), with a way out.
fetch("/api/me").then(r => r.ok ? r.json() : null).then(me => {
  if (!me || !me.auth || !me.email) return;
  document.getElementById("who").innerHTML = `<span>${me.email.replace(/[&<>"']/g, "")}</span>${me.logout ? `<a href="${me.logout}">Sign out</a>` : ""}`;
}).catch(() => {});
const PALETTE = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let charts = [], timers = [];

function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

// ---------------------------------------------------------------- formatting
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function unit(n, units, k = 1000) {
  let i = 0; n = Number(n || 0);
  while (Math.abs(n) >= k && i < units.length - 1) { n /= k; i++; }
  return (i ? n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) : Math.round(n)) + " " + units[i];
}
const bytes = n => unit(n, ["B", "KB", "MB", "GB", "TB"]);
const bps = n => unit(n, ["b/s", "kb/s", "Mb/s", "Gb/s"]);
const num = n => Number(n || 0).toLocaleString();
const pct = (a, b) => b ? (100 * a / b < 1 ? "<1%" : Math.round(100 * a / b) + "%") : "";
function ago(t) {
  if (!t) return "";
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 129600) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
const when = t => t ? new Date(t * 1000).toLocaleString() : "";
const hm = t => new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const day = t => new Date(t * 1000).toLocaleDateString([], {month: "short", day: "numeric"});
const flag = cc => cc && cc.trim().length === 2
  ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1A5 + c.charCodeAt(0))) + " " + cc : "";
const sw = color => `<i class="sw" style="background:${color}"></i>`;
const lastCell = t => `<span title="${when(t)}">${ago(t)}</span>`;

// ---------------------------------------------------------------- state & links
// Hash: #/<page>?range=6h | from=..&to=.. & filters (host, site, asn, country, svc, remote) & by
const FILTER_KEYS = ["host", "site", "group", "category", "asn", "country", "svc", "remote"];
const FILTER_NAMES = {host: "Device", site: "Website", group: "Category", category: "Subcategory", asn: "Network", country: "Country", svc: "Service", remote: "Remote"};
function parseHash() {
  const [path, qs] = (location.hash.replace(/^#/, "") || "/").split("?");
  return {path, q: new URLSearchParams(qs || "")};
}
function timeParams(q = parseHash().q) {
  const p = new URLSearchParams();
  if (q.get("from") && q.get("to")) { p.set("from", q.get("from")); p.set("to", q.get("to")); }
  else p.set("range", q.get("range") || localGet("range") || "6h");
  const scope = currentScope(q);
  if (scope !== "internet") p.set("scope", scope);
  return p;
}
// Internet / LAN / All: in the hash, else the last one picked.
function currentScope(q = parseHash().q) {
  const s = q.get("scope") || localGet("scope") || "internet";
  return ["internet", "lan", "all"].includes(s) ? s : "internet";
}
// A link that keeps the current time window; extra = {key: value|null}.
function link(path, extra = {}, keepFilters = false) {
  const cur = parseHash().q, p = timeParams(cur);
  if (keepFilters) FILTER_KEYS.forEach(k => cur.get(k) && p.set(k, cur.get(k)));
  if (keepFilters && cur.get("by")) p.set("by", cur.get("by"));
  for (const [k, v] of Object.entries(extra)) v == null ? p.delete(k) : p.set(k, v);
  return "#" + path + "?" + p.toString();
}
const drill = (k, v) => link("/explore", {[k]: v, by: null}, true);
const api = async (path, params) => {
  const r = await fetch(path + (params ? "?" + params.toString() : ""));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};

function hostCell(ip, name, href) {
  return `<a href="${href || drill("host", ip)}">${name ? `<span class="name">${esc(name)}</span><span class="ip">${esc(ip)}</span>` : esc(ip)}</a>`;
}
const siteCell = s => s ? `<a href="${drill("site", s)}">${esc(s)}</a>` : `<span class="muted">(no DNS name)</span>`;
// Website categories (categories.py): risky groups get a red-edged tag; each part drills in.
const RISKY = ["Security threat", "Illicit", "Mature", "Gambling"];
const groupTag = g => g ? `<a href="${drill("group", g)}" class="tag${RISKY.includes(g) ? " risk" : ""}">${esc(g)}</a>` : "";
const catCell = (key, label, group) => !key ? `<span class="muted">(no DNS name)</span>`
  : key === "uncategorized" ? `<span class="muted">Uncategorized</span>`
  : `<a href="${drill("category", key)}">${esc(label)}</a>${groupTag(group)}`;
const svcText = r => `${esc(r.proto)}/${r.port}${r.service ? ` <span class="tag">${esc(r.service)}</span>` : ""}`;
const NO_DNS = `<p class="muted">The DNS collector isn't set up - run netview_stack.yml to give it its OPNsense API key.</p>`;

// ---------------------------------------------------------------- tables
// cols: [{k, label, n (numeric), fmt(row), sort}]; opts: href(row) drill-down rows, bar(row), limit, sortable.
function table(rows, cols, opts = {}) {
  const id = "t" + Math.random().toString(36).slice(2);
  const max = opts.bar ? Math.max(1, ...rows.map(opts.bar)) : 0;
  const shown = opts.limit && !opts.all ? rows.slice(0, opts.limit) : rows;
  const body = shown.length ? shown.map(r => {
    const href = opts.href ? opts.href(r) : null;
    return `<tr${href ? ` data-href="${esc(href)}"` : ""}>` + cols.map((c, i) =>
      `<td class="${c.n ? "n" : ""}">${c.fmt ? c.fmt(r) : esc(r[c.k])}${i === 0 && max ? `<div class="bar" style="width:${(100 * opts.bar(r) / max).toFixed(1)}%"></div>` : ""}</td>`
    ).join("") + "</tr>";
  }).join("") : `<tr><td colspan="${cols.length}" class="muted">Nothing in this window.</td></tr>`;
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    el.querySelectorAll("tr[data-href]").forEach(tr => tr.onclick = e => {
      if (e.target.closest("a")) return;  // a link inside the row wins
      location.hash = tr.dataset.href;
    });
    el.querySelector(".more")?.addEventListener("click", () => { opts.all = true; el.outerHTML = table(rows, cols, opts); });
    if (!opts.sortable) return;
    el.querySelectorAll("th.sort").forEach(th => th.onclick = () => {
      const c = cols[+th.dataset.i], key = typeof c.sort === "function" ? c.sort : r => r[c.sort || c.k];
      const dir = opts.sorted === th.dataset.i ? -opts.dir : -1; opts.sorted = th.dataset.i; opts.dir = dir;
      rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * dir);
      el.outerHTML = table(rows, cols, opts);
    });
  });
  const more = opts.limit && !opts.all && rows.length > opts.limit ? `<button class="more">Show all ${rows.length}</button>` : "";
  return `<div class="tbl" id="${id}"><table><thead><tr>${cols.map((c, i) =>
    `<th class="${c.n ? "n " : ""}${opts.sortable ? "sort" : ""}" data-i="${i}">${c.label}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>${more}</div>`;
}
const DOWN = {k: "down", label: "Down", n: 1, fmt: r => bytes(r.down)};
const UP = {k: "up", label: "Up", n: 1, fmt: r => bytes(r.up)};
const total = r => (r.down || 0) + (r.up || 0);

// Tabs: [{id, label, html()}]; the choice is remembered per group.
function tabs(group, list) {
  const id = "tabs" + Math.random().toString(36).slice(2);
  let cur = localGet("tab:" + group);
  if (!list.some(t => t.id === cur)) cur = list[0]?.id;
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    const show = tid => {
      cur = tid; localSet("tab:" + group, tid);
      el.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.t === tid));
      el.querySelector(".tabbody").innerHTML = list.find(t => t.id === tid).html();
      el.dispatchEvent(new CustomEvent("tab", {detail: tid, bubbles: true}));
    };
    el.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.t));
    if (cur) show(cur);
  });
  return `<div id="${id}" class="tabset"><div class="tabs">${list.map(t => `<button data-t="${t.id}">${t.label}</button>`).join("")}</div><div class="tabbody"></div></div>`;
}

// ---------------------------------------------------------------- color
// Color follows the entity: a key keeps its slot while the page lives, in every chart of its group.
const colorMaps = {};
function colorsFor(group, keys) {
  const m = colorMaps[group] ||= new Map();
  const live = new Set(keys.filter(k => m.has(k)).map(k => m.get(k)));
  for (const k of keys) {
    if (k === "other" || m.has(k)) continue;
    const free = PALETTE.find(c => !live.has(c)) || PALETTE[live.size % PALETTE.length];
    m.set(k, free); live.add(free);
  }
  return keys.map(k => css(k === "other" ? "--other" : m.get(k)));
}

// ---------------------------------------------------------------- time charts (uPlot)
function tooltip(rowsAt) {
  let tip;
  return {hooks: {
    init: u => { tip = document.createElement("div"); tip.className = "tip"; u.over.appendChild(tip); },
    setCursor: u => {
      const i = u.cursor.idx;
      if (i == null || u.cursor.left < 0) { tip.style.display = "none"; return; }
      tip.innerHTML = rowsAt(u, i); tip.style.display = "block";
      const w = tip.offsetWidth, x = u.cursor.left, ow = u.over.clientWidth;
      tip.style.left = (x + 14 + w > ow ? x - w - 14 : x + 14) + "px";
      tip.style.top = Math.max(0, Math.min(u.cursor.top - 20, u.over.clientHeight - tip.offsetHeight)) + "px";
    },
  }};
}
const tipTime = (t, step) => `<div class="t">${step >= 86400 ? day(t) : `${day(t)} ${hm(t)}`}</div>`;
const tipRow = (color, label, value) => `<div class="r"><span>${sw(color)}${esc(label)}</span><span>${value}</span></div>`;

function axes() {
  const a = {stroke: css("--muted"), grid: {stroke: css("--border"), width: 1}, ticks: {show: false}, font: "11px system-ui"};
  return [a, {...a, size: 72, values: (u, vals) => vals.map(v => bps(v))}];
}
// Drag across a history chart = zoom the whole page to that window.
function zoomHook(u) {
  const s = u.select;
  if (s.width < 8) return;
  const from = Math.floor(u.posToVal(s.left, "x")), to = Math.ceil(u.posToVal(s.left + s.width, "x"));
  u.setSelect({left: 0, width: 0, top: 0, height: 0}, false);
  location.hash = link(parseHash().path, {from, to, range: null}, true);
}
function forget(u) { if (u) { u.destroy(); charts = charts.filter(x => x !== u); } }

// Download/upload areas (bits/s).
function dirChart(el, s, opts = {}) {
  const c1 = css("--s1"), c2 = css("--s2");
  const u = new uPlot({
    width: el.clientWidth, height: opts.height || 260, legend: {show: false},
    cursor: {drag: {x: !opts.live, y: false}, points: {size: 7, stroke: css("--surface"), width: 2}},
    scales: {x: {time: true}, y: {range: (u, min, max) => [0, Math.max(max * 1.1, 1000)]}},
    series: [{}, {stroke: c1, fill: c1 + "38", width: 2, points: {show: false}},
                 {stroke: c2, fill: c2 + "38", width: 2, points: {show: false}}],
    axes: axes(),
    hooks: {setSelect: [zoomHook]},
    plugins: [tooltip((u, i) => tipTime(u.data[0][i], opts.step || 60) +
      tipRow(c1, "Download", bps(u.data[1][i])) + tipRow(c2, "Upload", bps(u.data[2][i])))],
  }, [s.t, s.down, s.up], el);
  charts.push(u);
  return u;
}
const dirLegend = () => `<div class="legend"><span class="item">${sw(css("--s1"))}Download</span><span class="item">${sw(css("--s2"))}Upload</span></div>`;

// Stacked areas: [{key, label, values}] summed bottom-up, surface-colored seams between fills.
function stackChart(el, t, list, opts = {}) {
  const colors = colorsFor(opts.group || "stack", list.map(s => s.key));
  const raw = list.map(s => s.values), acc = t.map(() => 0);
  const stacked = raw.map(v => v.map((x, i) => (acc[i] += x)));
  const bands = stacked.map((_, i) => i > 0 ? {series: [i + 1, i], fill: colors[i] + "c0"} : null).filter(Boolean);
  const u = new uPlot({
    width: el.clientWidth, height: opts.height || 260, legend: {show: false},
    cursor: {drag: {x: !opts.live, y: false}, points: {show: false}},
    scales: {x: {time: true}, y: {range: (u, min, max) => [0, Math.max(max * 1.08, 1000)]}},
    series: [{}, ...list.map((s, i) => ({stroke: css("--surface"), width: 1.5, fill: i === 0 ? colors[0] + "c0" : undefined, points: {show: false}}))],
    bands, axes: axes(),
    hooks: {setSelect: [zoomHook]},
    plugins: [tooltip((u, i) => tipTime(u.data[0][i], opts.step || 60) + list.map((s, j) => [j, s]).reverse()
      .filter(([j]) => raw[j][i] > 0).slice(0, 9).map(([j, s]) => tipRow(colors[j], s.label, bps(raw[j][i]))).join("")
      || `<span class="muted">no traffic</span>`)],
  }, [t, ...stacked], el);
  charts.push(u);
  return {u, colors};
}
function stackLegend(list, colors, href, value = s => bytes(s.bytes)) {
  return `<div class="legend">${list.map((s, i) => {
    const h = href && s.key !== "other" ? href(s) : null, inner = `${sw(colors[i])}${esc(s.label)}<span class="v">${value(s)}</span>`;
    return h ? `<a href="${esc(h)}" title="Drill into ${esc(s.label)}">${inner}</a>` : `<span class="item">${inner}</span>`;
  }).join("")}</div>`;
}
window.addEventListener("resize", () => charts.forEach(u => u.root.parentElement && u.setSize({width: u.root.parentElement.clientWidth, height: u.height})));

// ---------------------------------------------------------------- donut
// Part-to-whole at a glance: top 5 + "everything else" (<= 6 segments), 2px seams,
// the center shows the hovered segment. items: [{key, label, value, href}].
function donut(group, items, opts = {}) {
  const sum = items.reduce((a, s) => a + s.value, 0);
  if (!sum) return `<div class="empty">Nothing in this window.</div>`;
  const colors = colorsFor(group, items.map(s => s.key));
  const fmt = opts.fmt || bytes, R = 60, r = 40, C = 66;
  let a0 = -Math.PI / 2;
  const arc = (a1, a2) => {
    const big = a2 - a1 > Math.PI ? 1 : 0, p = (rad, a) => `${(C + rad * Math.cos(a)).toFixed(2)},${(C + rad * Math.sin(a)).toFixed(2)}`;
    return `M${p(R, a1)}A${R},${R} 0 ${big} 1 ${p(R, a2)}L${p(r, a2)}A${r},${r} 0 ${big} 0 ${p(r, a1)}Z`;
  };
  const id = "d" + Math.random().toString(36).slice(2);
  const paths = items.map((s, i) => {
    const a = s.value / sum * 2 * Math.PI, a1 = a0, a2 = a0 + Math.min(a, 2 * Math.PI - 1e-4);
    a0 += a;
    return `<path d="${arc(a1, a2)}" fill="${colors[i]}" stroke="${css("--surface")}" stroke-width="2" data-i="${i}"><title>${esc(s.label)}: ${fmt(s.value)} (${pct(s.value, sum)})</title></path>`;
  }).join("");
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    const v = el.querySelector(".center-v"), l = el.querySelector(".center-l");
    el.querySelectorAll("path").forEach(p => {
      const s = items[+p.dataset.i];
      p.onmouseenter = () => { v.textContent = pct(s.value, sum); l.textContent = s.label.length > 18 ? s.label.slice(0, 17) + "…" : s.label; };
      p.onmouseleave = () => { v.textContent = fmt(sum); l.textContent = opts.center || "total"; };
      if (s.href) p.onclick = () => location.hash = s.href;
    });
  });
  return `<div class="donut" id="${id}"><svg viewBox="0 0 132 132" role="img" aria-label="${esc(opts.title || "share")}">${paths}
      <text x="66" y="66" text-anchor="middle" class="center-v">${fmt(sum)}</text>
      <text x="66" y="80" text-anchor="middle" class="center-l">${esc(opts.center || "total")}</text></svg>
    <div class="dleg">${items.map((s, i) => {
      const inner = `${sw(colors[i])}<span class="lbl">${esc(s.label)}</span><span class="pct">${pct(s.value, sum)}</span>`;
      return s.href ? `<a href="${esc(s.href)}" title="${esc(s.label)}: ${fmt(s.value)}">${inner}</a>` : `<span class="item" title="${fmt(s.value)}">${inner}</span>`;
    }).join("")}</div></div>`;
}
// Top 5 of a list + the rest of the total.
function top5(rows, totalValue, key, label, href, value = total) {
  const items = rows.slice(0, 5).filter(r => value(r) > 0).map(r => ({key: key(r), label: label(r), value: value(r), href: href(r)}));
  const rest = totalValue - items.reduce((a, s) => a + s.value, 0);
  if (rest > totalValue * 0.001) items.push({key: "other", label: "Everything else", value: rest});
  return items;
}

// ---------------------------------------------------------------- explore (overview + every drill-down)
const SPLITS = {total: "Total", host: "Device", group: "Category", category: "Subcategory", site: "Website", asn: "Network", country: "Country", svc: "Service", remote: "Remote"};
const INTERNET_ONLY = ["site", "group", "category", "asn", "country"];  // meaningless between LAN devices
// How each dimension shows in a donut / tab: its top list, key, label, drill link.
const DIMS = {
  host: {top: "hosts", title: "Devices", key: r => r.host, label: r => r.host_name || r.host, href: r => drill("host", r.host)},
  site: {top: "sites", title: "Websites", key: r => r.site, label: r => r.site || "(no DNS name)", href: r => r.site ? drill("site", r.site) : null},
  country: {top: "countries", title: "Countries", key: r => r.country, label: r => r.country ? flag(r.country) : "unknown", href: r => r.country ? drill("country", r.country) : null},
  svc: {top: "services", title: "Services", key: r => `${r.proto_num}/${r.port}`, label: r => `${r.proto}/${r.port}${r.service ? " " + r.service : ""}`, href: r => drill("svc", `${r.proto_num}/${r.port}`)},
  asn: {top: "asns", title: "Networks", key: r => `AS${r.asn} ${r.asn_name}`, label: r => r.asn_name || (r.asn ? "AS" + r.asn : "unknown"), href: r => r.asn ? drill("asn", r.asn) : null},
  remote: {top: "remotes", title: "Peers", key: r => r.rip, label: r => r.rip_name || r.rip, href: r => drill("remote", r.rip)},
  group: {top: "groups", title: "Categories", key: r => r.group, label: r => r.group,
          href: r => ["Uncategorized", "(no DNS name)"].includes(r.group) ? null : drill("group", r.group)},
  category: {top: "categories", title: "Subcategories", key: r => r.cat || "(none)", label: r => r.cat_label,
             href: r => r.cat && r.cat !== "uncategorized" ? drill("category", r.cat) : null},
};

async function explore() {
  const {q} = parseHash();
  const params = timeParams(q), applied = {};
  FILTER_KEYS.forEach(k => q.get(k) && (params.set(k, q.get(k)), applied[k] = q.get(k)));
  const only = k => applied[k] && Object.keys(applied).length === 1;
  const scope = currentScope(q), lanOnly = scope === "lan";
  const splits = Object.keys(SPLITS).filter(k => !applied[k] && !(lanOnly && INTERNET_ONLY.includes(k)));
  let by = q.get("by");
  if (!splits.includes(by)) by = "total";
  const bp = new URLSearchParams(params); bp.set("by", by);
  const extra = only("host") ? api(`/api/host/${encodeURIComponent(applied.host)}`, timeParams(q))
    : only("site") ? api(`/api/site/${encodeURIComponent(applied.site)}`, timeParams(q)) : null;
  const [d, b, x] = await Promise.all([api("/api/explore", params), by === "total" ? null : api("/api/breakdown", bp), extra]);
  const t = d.totals, tops = d.tops, filtered = Object.keys(applied).length > 0, all = total(t);
  const named = t.internet ? 100 * (1 - t.unnamed / t.internet) : 0;

  const chipLabel = (k, v) => ({
    host: () => d.names.host ? `${d.names.host} (${v})` : v,
    asn: () => { const r = tops.asns.find(r => String(r.asn) === v); return r && r.asn_name ? `${r.asn_name} (AS${v})` : `AS${v}`; },
    country: () => flag(v),
    svc: () => { const r = tops.services[0]; return r ? `${r.proto}/${r.port}${r.service ? " " + r.service : ""}` : v; },
    category: () => { const r = tops.categories.find(r => r.cat === v); return r ? `${r.cat_label} (${r.cat_group})` : v; },
  }[k] || (() => v))();
  const title = !filtered ? {internet: "All internet traffic", lan: "All LAN traffic", all: "All traffic"}[scope]
    : only("host") ? (d.names.host ? `${esc(d.names.host)} <span class="ip">${esc(applied.host)}</span>` : esc(applied.host))
    : only("site") ? esc(applied.site) : Object.entries(applied).map(([k, v]) => esc(chipLabel(k, v))).join(" &middot; ");
  const w = d.window;
  const sub = (q.get("from") ? `${when(w.start)} – ${hm(w.end)}` : `last ${timeParams(q).get("range")}`) +
    {internet: " · internet", lan: " · between LAN devices", all: " · internet and LAN"}[scope];

  // Three donuts: the first three dimensions not already filtered.
  const donutDims = (lanOnly ? ["host", "remote", "svc"] : ["host", "group", "site", "country", "category", "svc", "asn"])
    .filter(k => !applied[k] && (k !== "site" || d.dns)).slice(0, 3);
  // One tabbed table: what only this page has, then every unfiltered dimension.
  const tabList = [];
  if (x && only("host")) {
    if (x.dns) tabList.push({id: "visited", label: "Websites visited", html: () => table(x.sites, [
      {k: "site", label: "Website", fmt: r => siteCell(r.site)},
      {k: "visits", label: "Visits", n: 1, fmt: r => num(r.visits)}, DOWN, UP,
      {k: "last", label: "Last", n: 1, fmt: r => lastCell(r.last)}], {sortable: true, bar: r => r.visits, limit: 10, href: r => drill("site", r.site)})});
    tabList.push({id: "lan", label: "LAN peers", html: () => table(x.lan_peers, [
      {k: "ip", label: "Peer", fmt: r => hostCell(r.ip, r.ip_name, link("/explore", {host: r.ip, by: null}))},
      {k: "sent", label: "Sent", n: 1, fmt: r => bytes(r.sent)},
      {k: "received", label: "Received", n: 1, fmt: r => bytes(r.received)},
      {k: "ports", label: "Their ports", fmt: r => `<span class="muted">${esc(r.ports)}</span>`}],
      {bar: r => r.sent + r.received, limit: 10, href: r => link("/explore", {host: r.ip, by: null})}) +
      `<p class="hint">From the Proxmox nodes' softflowd - only traffic that crosses a VM bridge.${x.mac ? ` MAC ${esc(x.mac)}.` : ""}</p>`});
  }
  if (x && only("site")) {
    tabList.push({id: "visitors", label: "Devices visiting", html: () => table(x.devices, [
      {k: "ip", label: "Device", fmt: r => hostCell(r.ip, r.ip_name)},
      {k: "visits", label: "Visits", n: 1, fmt: r => num(r.visits)},
      {k: "lookups", label: "Lookups", n: 1, fmt: r => num(r.lookups)},
      {k: "last", label: "Last", n: 1, fmt: r => lastCell(r.last)}], {sortable: true, bar: r => r.visits, limit: 10, href: r => drill("host", r.ip)})});
    tabList.push({id: "names", label: "Names looked up", html: () => table(x.domains, [
      {k: "domain", label: "Domain"}, {k: "cat_label", label: "Category", fmt: r => catCell(r.cat, r.cat_label, r.cat_group)},
      {k: "lookups", label: "Lookups", n: 1, fmt: r => num(r.lookups)},
      {k: "devices", label: "Devices", n: 1}, {k: "last", label: "Last", n: 1, fmt: r => lastCell(r.last)}], {bar: r => r.lookups, limit: 10})});
  }
  const dimTab = (k, cols, label) => !applied[k] && !(lanOnly && INTERNET_ONLY.includes(k)) && tabList.push({id: k, label: label || DIMS[k].title,
    html: () => table(tops[DIMS[k].top], cols, {limit: 10, bar: total, href: DIMS[k].href})});
  dimTab("host", [{k: "host", label: "Device", fmt: r => hostCell(r.host, r.host_name)}, DOWN, UP, {k: "remotes", label: "Remotes", n: 1, fmt: r => num(r.remotes)}]);
  if (d.dns) dimTab("site", [{k: "site", label: "Website", fmt: r => siteCell(r.site)}, DOWN, UP, {k: "hosts", label: "Devices", n: 1}]);
  dimTab("asn", [{k: "asn_name", label: "Network", fmt: r => r.asn ? `${esc(r.asn_name || "AS" + r.asn)} <span class="tag">AS${r.asn}</span>` : `<span class="muted">unknown</span>`}, DOWN, UP, {k: "hosts", label: "Devices", n: 1}]);
  dimTab("country", [{k: "country", label: "Country", fmt: r => flag(r.country) || `<span class="muted">unknown</span>`}, DOWN, UP, {k: "hosts", label: "Devices", n: 1}]);
  if (d.dns) {
    dimTab("group", [{k: "group", label: "Category", fmt: r => DIMS.group.href(r) ? `<a href="${DIMS.group.href(r)}">${esc(r.group)}</a>${RISKY.includes(r.group) ? ` <span class="tag risk">risky</span>` : ""}` : `<span class="muted">${esc(r.group)}</span>`},
      DOWN, UP, {k: "categories", label: "Subcategories", n: 1}]);
    dimTab("category", [{k: "cat_label", label: "Subcategory", fmt: r => catCell(r.cat, r.cat_label, r.cat_group)}, DOWN, UP,
      {k: "hosts", label: "Devices", n: 1}, {k: "sites", label: "Websites", n: 1}]);
  }
  dimTab("svc", [{k: "port", label: "Service", fmt: svcText}, DOWN, UP, {k: "hosts", label: "Devices", n: 1}]);
  dimTab("remote", [{k: "rip", label: lanOnly ? "Peer" : "Remote", fmt: r => r.rip_name ? hostCell(r.rip, r.rip_name, drill("remote", r.rip)) : esc(r.rip)},
    ...(lanOnly ? [] : [{k: "asn_name", label: "Network", fmt: r => r.asn ? `${esc(r.asn_name || "")} <span class="tag">AS${r.asn}</span>` : ""},
                        {k: "country", label: "", fmt: r => flag(r.country)}]), DOWN, UP], lanOnly ? "Peers" : scope === "all" ? "Remotes & peers" : "Remote addresses");

  $main.innerHTML = `
    ${filtered ? `<div class="chips"><span class="crumb"><a href="${link("/")}">All traffic</a> &rsaquo;</span>
      ${Object.entries(applied).map(([k, v]) => `<span class="chip"><b>${FILTER_NAMES[k]}</b>${esc(chipLabel(k, v))}
        <button title="Remove this filter" data-rm="${k}">&times;</button></span>`).join("")}</div>` : ""}
    <div class="hero">
      <div class="title"><h2>${title}</h2><div class="sub">${esc(sub)}</div></div>
      <div class="kpis">
        ${lanOnly && !applied.host ? `<div class="kpi"><div class="v">${bytes(t.lan)}</div><div class="l">${sw(css("--s1"))}between devices</div></div>` : `
        <div class="kpi"><div class="v">${bytes(t.down)}</div><div class="l">${sw(css("--s1"))}${scope === "internet" ? "downloaded" : "received"}</div></div>
        <div class="kpi"><div class="v">${bytes(t.up)}</div><div class="l">${sw(css("--s2"))}${scope === "internet" ? "uploaded" : "sent"}</div></div>`}
        ${scope === "all" ? `<div class="kpi"><div class="v">${bytes(applied.host ? t.lan + t.lan_rx : t.lan)}</div><div class="l">of it LAN to LAN</div></div>` : ""}
        <div class="kpi"><div class="v">${num(applied.host ? t.remotes : t.hosts)}</div><div class="l">${applied.host ? (lanOnly ? "peers" : "remote addresses") : "devices"}</div></div>
        ${d.dns && !lanOnly ? `<div class="kpi"><div class="v">${named.toFixed(0)}%</div><div class="l">of internet traffic has a website name</div></div>` : ""}
      </div>

      <div class="head"><h3>Traffic</h3><div class="spacer"></div>
        <div class="seg" id="split">${splits.map(k => `<button data-by="${k}" class="${k === by ? "active" : ""}"

    </div>
    ${donutDims.length ? `<div class="row three">${donutDims.map(k => {

    <div class="card">${tabs(filtered ? "explore-f" : "explore", tabList)}</div>
    <p class="hint">Drag across the chart to zoom in. Click a slice, legend entry or row to drill down.${scope === "internet" ? "" :
      " LAN traffic comes from the Proxmox nodes (traffic crossing a VM bridge), de-duplicated; in the split charts a LAN byte counts once, under the device that sent it."}</p>`;

  document.querySelectorAll("[data-rm]").forEach(btn => btn.onclick = () => location.hash = link("/explore", {[btn.dataset.rm]: null, by: null}, true));
  document.querySelectorAll("#split button").forEach(btn => btn.onclick = () => location.hash = link("/explore", {by: btn.dataset.by === "total" ? null : btn.dataset.by}, true));
  if (by === "total") {
    dirChart(document.getElementById("c1"), d.series, {step: w.step});

  } else {
    const sc = stackChart(document.getElementById("c1"), b.t, b.series, {group: by, step: b.window.step});
    document.getElementById("l1").innerHTML = stackLegend(b.series, sc.colors,
      by === "site" ? s => s.key ? drill("site", s.key) : null
      : by === "group" ? s => ["Uncategorized", "(no DNS name)"].includes(s.key) ? null : drill("group", s.key)
      : by === "category" ? s => s.key && s.key !== "uncategorized" ? drill("category", s.key) : null
      : by === "asn" ? s => drill("asn", s.key.split(" ")[0].slice(2))
      : s => drill(by, s.key));
  }
}

  const cols = [
    {k: "ip", label: "Device", fmt: r => hostCell(r.ip, r.name), sort: r => r.name || r.ip},

// ---------------------------------------------------------------- live
// Live filter: every word must match some field; host: ip: port: proto: site: cc: as: target one field.
function liveFilter(text) {
  const terms = text.toLowerCase().split(/\s+/).filter(Boolean).map(t => {
    const m = t.match(/^(host|ip|port|proto|site|cc|as):(.+)$/);
    return m ? {f: m[1], v: m[2]} : {v: t};
  });
  return fields => terms.every(({f, v}) => f
    ? f === "port" ? String(fields.port ?? "") === v : String(fields[f] ?? "").toLowerCase().includes(v)
    : Object.values(fields).some(x => String(x ?? "").toLowerCase().includes(v)));
}
// The live dropdowns: what each filters on in a flow, and how its options read.
const LIVE_DROPS = [
  {k: "host", label: "Device", val: f => f.host, text: f => f.host_name ? `${f.host_name} (${f.host})` : f.host},
  {k: "proto", label: "Protocol", val: f => String(f.proto_num), text: f => f.proto},
  {k: "port", label: "Port / service", val: f => String(f.port), text: f => `${f.port}${f.service ? " " + f.service : ""}`},
  {k: "country", label: "Country", val: f => f.country, text: f => flag(f.country)},
  {k: "site", label: "Website", val: f => f.site, text: f => f.site},
  {k: "asn", label: "Network", val: f => f.asn ? String(f.asn) : "", text: f => f.asn_name || "AS" + f.asn},
  {k: "category", label: "Category", val: f => f.cat && f.cat !== "uncategorized" ? f.cat : "", text: f => `${f.cat_label} (${f.cat_group})`},
];

async function livePage() {
  let sel = localGet("liveIface"), since = 0, big = null, view = localGet("liveView") || "throughput";
  let filterText = localGet("liveFilter") || "", flows = null, top = null;
  let picks = {};
  try { picks = JSON.parse(localGet("liveDrops") || "{}") || {}; } catch {}
  for (const k of ["proto", "port", "asn"]) if (picks[k] && !/^\d+$/.test(picks[k])) delete picks[k];  // saved by an older page
  if (picks.iface && !(Array.isArray(picks.iface) && picks.iface.length)) delete picks.iface;
  const ifacePicked = dev => !picks.iface || picks.iface.includes(dev);
  const names = {};
  const hist = {};                 // device -> {label, t, down, up}
  const talk = {t: [], by: {}};    // ip -> bits/s per top-talkers sample
  const KEEP = 600;
  $main.innerHTML = `
    <div class="hero"><div class="title"><h2><span class="pulse"></span>Live</h2>
      <div class="sub">Straight from the firewall: throughput every 2 s, devices every 5 s, last 10 minutes</div></div>
      <span class="err small" id="lerr"></span></div>
    <div class="ifaces" id="ifaces"></div>
    <div class="row split">
      <div class="card"><div class="head"><h3 id="bigt">Throughput</h3><div class="spacer"></div>
        <div class="seg" id="lview"><button data-v="throughput">Interface</button><button data-v="talkers">By device</button></div></div>
        <div class="chart" id="c1"></div><div id="l1"></div></div>
      <div class="card"><div class="head"><h3>Bandwidth right now</h3></div><div id="ldonut"><div class="empty">Waiting for the first sample…</div></div></div>
    </div>
    <div class="card">
      <div class="head"><h3>Who's talking</h3><div class="spacer"></div><span class="hint" style="margin:0">Lists fill from the last 2 minutes of traffic</span></div>
      <div class="filterbar" id="lbar">
        <div class="drop">Interface<div class="multi" id="lif"><button data-dev="" class="on">All</button></div></div>
        ${LIVE_DROPS.map(d => `<label class="drop">${d.label}<select data-k="${d.k}"><option value="">All</option></select></label>`).join("")}
        <label class="drop">Search<input class="filter" id="lf" placeholder="name, IP, port:443, cc:us…" value="${esc(filterText)}"></label>
        <button class="clear" id="lclear">Clear filters</button>
      </div>
      <div id="ltabs"></div>
    </div>`;

  const spark = h => {
    const n = h.t.length; if (n < 2) return "";
    const max = Math.max(1, ...h.down, ...h.up), W = 200, H = 30;
    const path = arr => arr.map((v, i) => `${(i / (n - 1) * W).toFixed(1)},${(H - 2 - v / max * (H - 4)).toFixed(1)}`).join(" ");
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="${css("--s1")}" stroke-width="2" vector-effect="non-scaling-stroke" points="${path(h.down)}"/>
      <polyline fill="none" stroke="${css("--s2")}" stroke-width="2" vector-effect="non-scaling-stroke" points="${path(h.up)}"/></svg>`;
  };
  const setErr = m => { const el = document.getElementById("lerr"); if (el) el.textContent = m || ""; };

  // The chart: the selected interface's throughput, or the devices stacked.
  function drawChart(fresh) {
    const el = document.getElementById("c1"); if (!el) return;
    document.querySelectorAll("#lview button").forEach(b => b.classList.toggle("active", b.dataset.v === view));
    if (fresh) { forget(big); big = null; el.innerHTML = ""; }
    if (view === "throughput") {
      const h = hist[sel]; if (!h || h.t.length < 2) return;
      document.getElementById("bigt").textContent = `Throughput - ${h.label}`;
      if (big) big.setData([h.t, h.down, h.up]);
      else { big = dirChart(el, h, {live: true, step: 2}); document.getElementById("l1").innerHTML = dirLegend(); }
    } else {
      document.getElementById("bigt").textContent = "Devices";
      if (talk.t.length < 2) return;
      const recent = ip => talk.by[ip].slice(-12).reduce((a, b) => a + b, 0);
      const ips = Object.keys(talk.by).sort((a, b) => recent(b) - recent(a));
      const keep = ips.slice(0, 7).filter(ip => recent(ip) > 0), rest = ips.filter(ip => !keep.includes(ip));
      const list = keep.map(ip => ({key: ip, label: names[ip] || ip, values: talk.by[ip]}));
      if (rest.length) list.push({key: "other", label: "Everything else", values: talk.t.map((_, i) => rest.reduce((a, ip) => a + talk.by[ip][i], 0))});
      forget(big); el.innerHTML = "";
      const sc = stackChart(el, talk.t, list, {group: "live", live: true, step: 5});
      big = sc.u;
      document.getElementById("l1").innerHTML = stackLegend(list, sc.colors, s => drill("host", s.key), s => bps(s.values[s.values.length - 1]));
    }
  }

  async function tick() {
    const d = await api("/api/live", new URLSearchParams({since}));
    setErr(d.error ? "firewall: " + d.error : "");
    for (const f of d.interfaces) {
      const h = hist[f.device] ||= {label: f.label, t: [], down: [], up: []};
      for (const [t, down, up] of f.points) { h.t.push(t); h.down.push(down); h.up.push(up); since = Math.max(since, t); }
      while (h.t.length && h.t[0] < d.now - KEEP) { h.t.shift(); h.down.shift(); h.up.shift(); }
    }
    if (!sel || !hist[sel]) sel = Object.keys(hist)[0];
    const el = document.getElementById("ifaces"); if (!el) return;
    el.innerHTML = Object.entries(hist).map(([dev, h]) => {
      const n = h.t.length - 1;
      return `<div class="iface ${dev === sel && view === "throughput" ? "active" : ""} ${ifacePicked(dev) ? "" : "dim"}" data-dev="${esc(dev)}">
        <div class="lbl"><span>${esc(h.label)}</span><span>${esc(dev)}</span></div>
        <div class="rates"><span>${sw(css("--s1"))}${n >= 0 ? bps(h.down[n]) : "…"}</span><span>${sw(css("--s2"))}${n >= 0 ? bps(h.up[n]) : "…"}</span></div>
        ${spark(h)}</div>`;
    }).join("");
    el.querySelectorAll(".iface").forEach(c => c.onclick = () => {
      sel = c.dataset.dev; view = "throughput"; localSet("liveIface", sel); localSet("liveView", view); drawChart(true); tick();
    });
    if (view === "throughput") drawChart(false);
  }

  async function topTick() {
    const d = await api("/api/live/top");
    if (d.error) setErr("firewall: " + d.error);
    if (!d.t || (talk.t.length && d.t === talk.t[talk.t.length - 1])) return;
    top = d;
    talk.t.push(d.t);
    const now = new Map(d.hosts.map(h => [h.ip, h]));
    for (const ip of new Set([...Object.keys(talk.by), ...now.keys()])) {
      const arr = talk.by[ip] ||= talk.t.slice(0, -1).map(() => 0);
      const h = now.get(ip);
      arr.push(h ? h.down + h.up : 0);
    }
    while (talk.t.length && talk.t[0] < d.t - KEEP) { talk.t.shift(); Object.values(talk.by).forEach(a => a.shift()); }
    Object.assign(names, Object.fromEntries(d.hosts.map(h => [h.ip, h.name])));
    const byRate = [...d.hosts].sort((a, b) => total(b) - total(a));
    const el = document.getElementById("ldonut");
    if (el) el.innerHTML = donut("live", top5(byRate, byRate.reduce((a, h) => a + total(h), 0), h => h.ip, h => h.name || h.ip,
      h => drill("host", h.ip)), {fmt: bps, center: "right now", title: "Bandwidth by device"});
    if (view === "talkers") drawChart(true);
    renderLists();
  }

  // Two fetches: the newest flows unfiltered (the dropdowns' options), and,
  // when something is picked, the same filtered on the server - so a pick
  // searches every recent flow, not just the newest 2,000. Fetched whichever
  // tab is open, since the dropdowns need them.
  let sample = null;
  async function flowTick() {
    const p = new URLSearchParams({seconds: 120});
    const filtered = Object.keys(picks).length > 0;
    Object.entries(picks).forEach(([k, v]) => Array.isArray(v) ? v.forEach(x => p.append(k, x)) : p.set(k, v));
    const [s, f] = await Promise.all([api("/api/live/flows", new URLSearchParams({seconds: 120})),
                                      filtered ? api("/api/live/flows", p) : null]);
    sample = s; flows = f || s;
    fillDrops();
    renderLists();
  }

  // Dropdown options: the values in the recent flows, busiest first, with a
  // count; a picked value stays listed even when it has gone quiet.
  function fillDrops() {
    if (!sample) return;
    // Interface: one toggle per firewall interface (multi-select), "All" clears them.
    const counts = {};
    sample.flows.forEach(f => counts[f.via_dev] = (counts[f.via_dev] || 0) + 1);
    const ifs = [...sample.interfaces, ...(counts.other ? [{device: "other", label: "Firewall / other"}] : [])];
    document.getElementById("lif").innerHTML = `<button data-dev="" class="${picks.iface ? "" : "on"}">All</button>` +
      ifs.map(i => `<button data-dev="${esc(i.device)}" class="${picks.iface?.includes(i.device) ? "on" : ""}" title="${esc(i.device)}">${esc(i.label)}<span class="n">${num(counts[i.device] || 0)}</span></button>`).join("");
    if (document.activeElement?.closest?.("#lbar select")) return;  // don't rebuild an open list
    for (const d of LIVE_DROPS) {
      const el = document.querySelector(`#lbar select[data-k="${d.k}"]`); if (!el) continue;
      const seen = new Map();
      for (const f of sample.flows) {
        const v = d.val(f); if (!v) continue;
        const o = seen.get(v) || {v, text: d.text(f), n: 0}; o.n++; seen.set(v, o);
      }
      const opts = [...seen.values()].sort((a, b) => b.n - a.n || a.text.localeCompare(b.text)).slice(0, 80);
      if (picks[d.k] && !seen.has(picks[d.k])) opts.unshift({v: picks[d.k], text: picks[d.k], n: 0});
      el.innerHTML = `<option value="">All</option>` + opts.map(o =>
        `<option value="${esc(o.v)}"${o.v === picks[d.k] ? " selected" : ""}>${esc(o.text)} (${o.n})</option>`).join("");
      el.classList.toggle("on", !!picks[d.k]);
    }
  }
  const flowMatches = (f, match) => ifacePicked(f.via_dev) && LIVE_DROPS.every(d => !picks[d.k] || d.val(f) === picks[d.k]) &&
    match({host: f.host_name + " " + (f.rip_name || ""), ip: f.host + " " + f.rip, port: f.port, proto: f.proto + " " + f.service,
           site: f.site, cc: f.country, as: f.asn_name + " as" + f.asn});

  // Recent traffic: the filtered traffic over the last few minutes, as a chart.
  const RECENT = [5, 10, 15, 20, 30, 60, 120];
  let recentMin = +(localGet("recentMin") || 15), recentView = localGet("recentView") || "total", recentU = null;
  if (!RECENT.includes(recentMin)) recentMin = 15;
  const minLabel = m => m < 60 ? `${m} min` : `${m / 60} h`;
  const recentHtml = () => `
    <div class="head" style="margin-bottom:.6rem">
      <div class="seg" id="rmin">${RECENT.map(m => `<button data-m="${m}" class="${m === recentMin ? "active" : ""}">${minLabel(m)}</button>`).join("")}</div>
      <div class="spacer"></div>
      <div class="seg" id="rview"><button data-v="total" class="${recentView === "total" ? "active" : ""}">Total</button><button data-v="device" class="${recentView === "device" ? "active" : ""}">By device</button></div>
    </div>
    <div class="chart" id="rc"><div class="empty">Loading…</div></div><div id="rl"></div><p class="hint" id="rh"></p>`;
  async function recentTick() {
    if (localGet("tab:live") !== "recent" || !document.getElementById("rc")) return;
    const p = new URLSearchParams({minutes: recentMin});
    Object.entries(picks).forEach(([k, v]) => Array.isArray(v) ? v.forEach(x => p.append(k, x)) : p.set(k, v));
    const d = await api("/api/live/series", p);
    const el = document.getElementById("rc"); if (!el) return;
    forget(recentU); el.innerHTML = "";
    if (recentView === "device" && d.by.length) {
      const sc = stackChart(el, d.t, d.by, {group: "live", live: true, step: d.step, height: 240});
      recentU = sc.u;
      document.getElementById("rl").innerHTML = stackLegend(d.by, sc.colors, s => drill("host", s.key));
    } else {
      recentU = dirChart(el, {t: d.t, down: d.down, up: d.up}, {live: true, step: d.step, height: 240});
      document.getElementById("rl").innerHTML = dirLegend();
    }
    const filtered = Object.keys(picks).length > 0;
    document.getElementById("rh").textContent = `${bytes(d.total_down)} received · ${bytes(d.total_up)} sent in the last ${minLabel(d.minutes)}` +
      `${filtered ? " under the filters above" : ""} (the search box doesn't apply here) · flows arrive up to a minute late, so the newest minute fills in as they do`;
  }

  // Under one filter: the firewall's devices (now), the recent flows, the recent traffic chart.
  const lt = document.getElementById("ltabs");
  lt.innerHTML = tabs("live", [
    {id: "talkers", label: "Devices now", html: () => `<div id="lt-talkers"><div class="empty">Waiting for the first sample…</div></div>`},
    {id: "flows", label: "Flows (last 2 min)", html: () => `<div id="lt-flows"><div class="empty">Loading flows…</div></div>`},
    {id: "recent", label: "Recent traffic", html: recentHtml},
  ]);
  lt.addEventListener("tab", e => { renderLists(); if (e.detail === "recent") safe(recentTick)(); });
  lt.addEventListener("click", e => {
    const m = e.target.closest("#rmin button"), v = e.target.closest("#rview button");
    if (!m && !v) return;
    if (m) { recentMin = +m.dataset.m; localSet("recentMin", recentMin); }
    if (v) { recentView = v.dataset.v; localSet("recentView", recentView); }
    document.querySelectorAll("#rmin button").forEach(b => b.classList.toggle("active", +b.dataset.m === recentMin));
    document.querySelectorAll("#rview button").forEach(b => b.classList.toggle("active", b.dataset.v === recentView));
    safe(recentTick)();
  });
  function renderLists() {
    const match = liveFilter(filterText);
    const tEl = document.getElementById("lt-talkers");
    if (tEl && top) {
      // The firewall's live list only knows devices and peers: the Device pick
      // narrows it directly, the other picks keep devices with matching flows.
      const flowPicks = !!picks.iface || LIVE_DROPS.some(d => d.k !== "host" && picks[d.k]);
      const withFlows = flowPicks && flows ? new Set(flows.flows.filter(f => flowMatches(f, () => true)).map(f => f.host)) : null;
      const rows = top.hosts.filter(h => (!picks.host || h.ip === picks.host) && (!withFlows || withFlows.has(h.ip)) &&
        match({host: h.name, ip: h.ip + " " + h.peers.map(p => p.ip).join(" "), site: h.peers.map(p => p.name).join(" ")}));
      const max = Math.max(1, ...rows.map(total));
      tEl.innerHTML = `<div class="tbl"><table><thead><tr><th>Device</th><th class="n">Download</th><th class="n">Upload</th><th>Talking to</th></tr></thead><tbody>${
        rows.slice(0, 30).map(h => `<tr data-href="${esc(drill("host", h.ip))}"><td>${hostCell(h.ip, h.name)}<div class="bar" style="width:${(100 * total(h) / max).toFixed(1)}%"></div></td>
          <td class="n">${bps(h.down)}</td><td class="n">${bps(h.up)}</td>
          <td class="small">${h.peers.slice(0, 3).map(p => `${p.name ? esc(p.name) : `<a href="${drill("remote", p.ip)}">${esc(p.ip)}</a>`} <span class="muted">${bps(p.rate)}</span>`).join(", ")}${h.peers.length > 3 ? ` <span class="muted">+${h.peers.length - 3}</span>` : ""}</td></tr>`).join("")
        || `<tr><td colspan="4" class="muted">${picks.host && !top.hosts.some(h => h.ip === picks.host)
             ? "The firewall lists only its busiest devices right now, and this one isn't among them - its traffic is in the Flows and Recent traffic tabs."
             : top.hosts.length ? "Nothing matches the filter." : "Nobody is talking."}</td></tr>`}</tbody></table></div>
        <p class="hint">${rows.length} of ${top.hosts.length} devices &middot; updated ${new Date(top.t * 1000).toLocaleTimeString()}</p>`;
      tEl.querySelectorAll("tr[data-href]").forEach(tr => tr.onclick = e => { if (!e.target.closest("a")) location.hash = tr.dataset.href; });
    }
    const fEl = document.getElementById("lt-flows");
    if (fEl && flows) {
      const rows = flows.flows.filter(f => flowMatches(f, match));
      fEl.innerHTML = table(rows, [
        {k: "host", label: "Device", fmt: r => hostCell(r.host, r.host_name)},
        {k: "rip", label: "Remote", fmt: r => `<a href="${drill("remote", r.rip)}">${r.rip_name ? `<span class="name">${esc(r.rip_name)}</span><span class="ip">${esc(r.rip)}</span>` : esc(r.rip)}</a>${r.site ? ` <span class="tag">${esc(r.site)}</span>` : ""}`},
        {k: "asn_name", label: "Network", fmt: r => `<span class="small">${esc(r.asn_name || "")}</span> ${flag(r.country)}`},
        {k: "port", label: "Service", fmt: svcText},
        {k: "via", label: "Via", fmt: r => `<span class="small">${esc(r.via)}</span>`},
        DOWN, UP,
        {k: "last", label: "Last", n: 1, fmt: r => lastCell(r.last)}], {limit: 50, sortable: true}) +
        `<p class="hint">${num(rows.length)} conversations${Object.keys(picks).length || filterText ? " match" : ""} in the last ${flows.seconds / 60} minutes${
          flows.capped ? ` (the newest ${num(flows.flows.length)} - narrow it with the dropdowns)` : ""} &middot; flows arrive up to a minute late (the firewall reports a long connection once a minute)</p>`;
    }
  }
  document.getElementById("lf").oninput = e => { filterText = e.target.value; localSet("liveFilter", filterText); renderLists(); };
  document.querySelectorAll("#lbar select").forEach(el => el.onchange = () => {
    if (el.value) picks[el.dataset.k] = el.value; else delete picks[el.dataset.k];
    localSet("liveDrops", JSON.stringify(picks));
    el.classList.toggle("on", !!el.value);
    el.blur();
    refilter();
  });
  document.getElementById("lif").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const dev = b.dataset.dev;
    if (!dev) delete picks.iface;
    else {
      const set = new Set(picks.iface || []);
      set.has(dev) ? set.delete(dev) : set.add(dev);
      if (set.size) picks.iface = [...set]; else delete picks.iface;
    }
    localSet("liveDrops", JSON.stringify(picks));
    fillDrops(); tick(); refilter();
  };
  document.getElementById("lclear").onclick = () => {
    picks = {}; filterText = ""; document.getElementById("lf").value = "";
    localSet("liveDrops", "{}"); localSet("liveFilter", "");
    fillDrops(); refilter();
  };
  // A new pick needs the server's answer - say so rather than show the old list filtered.
  function refilter() {
    flows = null;
    const fEl = document.getElementById("lt-flows");
    if (fEl) fEl.innerHTML = `<div class="empty">Filtering…</div>`;
    renderLists();
    safe(flowTick)();
    safe(recentTick)();
  }
  document.querySelectorAll("#lview button").forEach(b => b.onclick = () => { view = b.dataset.v; localSet("liveView", view); drawChart(true); tick(); });

  const safe = fn => async () => { try { await fn(); } catch (e) { setErr(e.message); } };
  await safe(tick)(); safe(topTick)(); safe(flowTick)();
  timers.push(setInterval(safe(tick), 2000), setInterval(safe(topTick), 5000), setInterval(safe(flowTick), 10000),
              setInterval(safe(recentTick), 15000));
}

// ---------------------------------------------------------------- router
async function route() {
  const {path, q} = parseHash();
  const page = path === "/live" ? "live" : path === "/hosts" ? "hosts" : path === "/sites" ? "sites"
    : path === "/new" ? "new" : "explore";
  const navPage = page === "explore" && q.get("host") ? "hosts" : page === "explore" && q.get("site") ? "sites" : page;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.page === navPage));
  const zoomed = q.get("from") && q.get("to");
  const range = q.get("range") || localGet("range") || "6h";
  document.querySelectorAll("#ranges button").forEach(b => b.classList.toggle("active", !zoomed && b.dataset.r === range));
  document.getElementById("zoom").innerHTML = zoomed ? `<span class="chip"><b>Zoom</b>${day(+q.get("from"))} ${hm(+q.get("from"))} - ${hm(+q.get("to"))}
    <button title="Back to the preset" id="unzoom">&times;</button></span>` : "";
  if (zoomed) document.getElementById("unzoom").onclick = () => location.hash = link(path, {from: null, to: null}, true);
  document.getElementById("timebar").style.visibility = page === "live" || page === "new" ? "hidden" : "";
  document.querySelectorAll("#scopes button").forEach(b => b.classList.toggle("active", b.dataset.s === currentScope(q)));
  document.getElementById("scopes").style.display = page === "explore" ? "" : "none";
  timers.forEach(clearInterval); timers = [];
  charts.forEach(u => u.destroy()); charts = [];
  $main.classList.add("loading");
  try {
    if (page === "live") await livePage();
    else if (page === "hosts") await hosts();
    else if (page === "sites") await sites();
    else if (page === "new") await newToday();
    else await explore();
  } catch (e) {
    $main.innerHTML = `<div class="card err">Couldn't load: ${esc(e.message)}</div>`;
  }
  $main.classList.remove("loading");
}
document.getElementById("ranges").onclick = e => {
  if (!e.target.dataset.r) return;
  localSet("range", e.target.dataset.r);
  location.hash = link(parseHash().path, {range: e.target.dataset.r, from: null, to: null}, true);
};
document.getElementById("scopes").onclick = e => {
  const s = e.target.dataset.s; if (!s) return;
  localSet("scope", s);
  // Website, network and country filters mean nothing on the LAN: drop them there.
  const drop = s === "lan" ? Object.fromEntries(INTERNET_ONLY.map(k => [k, null])) : {};
  location.hash = link(parseHash().path, {scope: s === "internet" ? null : s, by: null, ...drop}, true);
};
window.addEventListener("hashchange", route);
route();
</script>
