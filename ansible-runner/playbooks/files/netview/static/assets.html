<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentry Lens - Assets</title>
<link rel="icon" href="/static/logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<style>
  /* The main page's surfaces (index.html); severities: the series palette's
     red / orange / amber / blue, "info" neutral - always with their name. */
  :root {
    color-scheme: dark;
    --bg: #0b0f16; --surface: #131a24; --surface2: #1a2330; --border: #262f3d;
    --text: #e6edf3; --muted: #8b96a5; --accent2: #ffb454; --link: #79b8ff;
    --critical: #f85149; --high: #d95926; --medium: #c98500; --low: #3987e5; --info: #5c6675;
    --ok: #199e70; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; font-size: 14px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: .7rem 1.4rem;
    background: linear-gradient(120deg, #1a0d0d, #1c1108 70%); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 1.15rem; letter-spacing: .02em; }
  header h1 a { color: inherit; display: flex; align-items: center; gap: .55rem; }
  header h1 a:hover { text-decoration: none; }
  header h1 img { width: 30px; height: 30px; filter: drop-shadow(0 2px 8px #ff5c4d55); }
  header h1 span { color: var(--accent2); }
  nav { display: flex; gap: .25rem; flex-wrap: wrap; }
  nav a { color: var(--muted); padding: .35rem .8rem; border-radius: 999px; border: 1px solid transparent; }
  nav a.active { color: var(--text); border-color: var(--border); background: var(--surface); }
  nav a:hover { text-decoration: none; color: var(--text); }
  /* The three sections (Applications / Network / Infrastructure), on every page. */
  nav.sections { display: inline-flex; gap: 0; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex-wrap: nowrap; }
  nav.sections a { color: var(--muted); padding: .35rem .9rem; font-size: .88rem; border: 0; border-radius: 0; }
  nav.sections a.active { color: var(--text); background: var(--surface2); box-shadow: inset 0 -2px 0 var(--accent2); }
  .spacer { flex: 1; }
  .who { display: flex; align-items: center; gap: .6rem; font-size: .8rem; color: var(--muted); }
  .who a { color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: .2rem .65rem; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
  .seg button { background: var(--surface); color: var(--muted); border: 0; padding: .3rem .7rem; cursor: pointer; font: inherit; font-size: .85rem; }
  .seg button.active { background: var(--surface2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent2); }

  main { padding: 1.4rem; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
  h2 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; font-weight: 600; }
  .muted { color: var(--muted); } .small { font-size: .8rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; min-width: 0; }
  .head { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .9rem; }
  .hero { display: flex; align-items: flex-end; gap: 2rem; flex-wrap: wrap; }
  .hero .title { flex: 1 1 260px; }
  .hero .sub { color: var(--muted); font-size: .85rem; margin-top: .25rem; }
  .kpis { display: flex; gap: 2rem; flex-wrap: wrap; }
  .kpi .v { font-size: 1.45rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: .75rem; color: var(--muted); }
  .tabs { display: flex; gap: .2rem; border-bottom: 1px solid var(--border); margin: -.2rem 0 .8rem; overflow-x: auto; }
  .tabs button { background: none; border: 0; color: var(--muted); font: inherit; padding: .5rem .8rem; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent2); }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: .75rem; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; }
  td.nw { white-space: nowrap; }
  tr.click { cursor: pointer; }
  tbody tr:hover td { background: var(--surface2); }
  .name { font-weight: 500; }
  .ip { color: var(--muted); font-size: .8rem; margin-left: .4rem; }
  .sev { display: inline-flex; align-items: center; gap: .35rem; font-size: .75rem; font-weight: 600; border-radius: 999px; padding: .08rem .55rem; border: 1px solid; white-space: nowrap; }
  .sev i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .sev.critical { color: #ff7b72; border-color: var(--critical); background: #f8514922; }
  .sev.high { color: #f0884f; border-color: var(--high); background: #d9592622; }
  .sev.medium { color: #e3a52a; border-color: var(--medium); background: #c9850022; }
  .sev.low { color: #79b8ff; border-color: var(--low); background: #3987e522; }
  .sev.info { color: var(--muted); border-color: var(--info); background: transparent; }
  .chips { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: .4rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: .2rem .35rem .2rem .7rem; font-size: .85rem; }
  .chip b { font-weight: 500; color: var(--muted); }
  .chip button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 .25rem; }
  .filterbar { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin-bottom: .9rem; }
  select, input[type=text], input[type=number] {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: .35rem .6rem; font: inherit; font-size: .85rem;
  }
  input[type=number] { width: 4.8rem; }
  input.list { width: 100%; min-width: 14rem; }
  select:focus, input:focus { outline: 2px solid var(--accent2); outline-offset: -1px; }
  input:disabled, select:disabled { opacity: .7; }
  .btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: .35rem .8rem; font: inherit; font-size: .85rem; cursor: pointer; }
  .btn.primary { border-color: var(--accent2); color: var(--accent2); }
  .btn:disabled { opacity: .4; cursor: default; }
  .linkbtn { background: none; border: 0; color: var(--link); cursor: pointer; font: inherit; font-size: .8rem; padding: 0; }
  .err { color: #ff7b72; font-size: .85rem; }
  .ok { color: var(--ok); font-size: .85rem; }
  .empty { color: var(--muted); padding: 1.2rem 0; text-align: center; }
  .desc { color: var(--muted); font-size: .8rem; margin-top: .2rem; max-width: 46rem; }
  .from { color: var(--muted); font-size: .72rem; margin-top: .15rem; }
  .params { display: grid; grid-template-columns: max-content minmax(10rem, 1fr); gap: .3rem .6rem; align-items: center; font-size: .8rem; }
  .params label { color: var(--muted); }
  .scorebox { display: flex; align-items: center; gap: .5rem; }
  tr.off td:not(:first-child) { opacity: .55; }
  tr.ign td { opacity: .6; }
  tr.ign:hover td { opacity: 1; }
  .tag { font-size: .7rem; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 .3rem; margin-left: .3rem; white-space: nowrap; }
  .acts { display: flex; gap: .7rem; flex-wrap: wrap; }
  .listcard { flex: 1 1 380px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: .8rem .9rem; }
  .entries { display: flex; flex-direction: column; gap: .3rem; margin: .6rem 0; max-height: 16rem; overflow-y: auto; }
  .entry { display: flex; align-items: baseline; gap: .6rem; font-size: .85rem; }
  .entry code { font-family: ui-monospace, Consolas, monospace; }
  .entry .note { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .addrow { display: flex; gap: .4rem; flex-wrap: wrap; }
  .addrow input { flex: 1 1 8rem; }
  tr.dirty td { background: #ffb45410; }
  /* on/off switch */
  .sw { position: relative; display: inline-block; width: 36px; height: 20px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: .15s; cursor: pointer; }
  .sw span::before { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: var(--muted); border-radius: 50%; transition: .15s; }
  .sw input:checked + span { background: var(--ok); }
  .sw input:checked + span::before { transform: translateX(16px); background: #fff; }
  .sw input:focus-visible + span { outline: 2px solid var(--accent2); }
  .sw input:disabled + span { cursor: default; }
  @media (max-width: 700px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .params { grid-template-columns: 1fr; }
    .kpis { gap: 1.2rem; }
  }
  /* Assets. One series color (--s1) for the bars; status is a dot + its word. */
  :root { --s1: #3987e5; --up: #2ea043; --down: #f85149; }
  .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; }
  .vbar { display: grid; grid-template-columns: minmax(7rem, 13rem) 1fr 3.5rem; gap: .6rem; align-items: center; font-size: .8rem; margin: .28rem 0; }
  .vbar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vbar .track { height: 12px; background: var(--surface2); border-radius: 0 4px 4px 0; }
  .vbar .track i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--s1); }
  .vbar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 110px; }
  .cols i { flex: 1; background: var(--s1); border-radius: 3px 3px 0 0; min-height: 1px; }
  .cols i:hover { opacity: .75; }
  .axis { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); margin-top: .3rem; }
  .st { display: inline-flex; align-items: center; gap: .35rem; font-size: .75rem; font-weight: 600; white-space: nowrap; }
  .st i { width: 8px; height: 8px; border-radius: 50%; }
  .st.on i { background: var(--up); } .st.off i { background: var(--paused, #5c6675); } .st.off { color: var(--muted); }
  .st.new { color: var(--accent2); }
  .port { display: inline-block; font-size: .7rem; border: 1px solid var(--border); background: var(--surface2); border-radius: 4px; padding: 0 .3rem; margin: .1rem .15rem 0 0; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: .8rem; }
  tr.exp > td { padding: 0 0 .9rem; background: transparent !important; }
  .expbox { margin: 0 .3rem; background: var(--bg); border: 1px solid var(--accent2); border-top: 3px solid var(--accent2); border-radius: 0 0 10px 10px; padding: .9rem 1rem; white-space: normal; cursor: default; }
  .expgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem 1.6rem; }
  .expbox h4 { margin: 0 0 .45rem; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1rem; font-size: .82rem; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
  .strip { display: flex; gap: 2px; height: 22px; margin-top: .3rem; }
  .strip i { flex: 1; border-radius: 2px; background: var(--surface2); }
  .strip i.y { background: var(--up); }
  .ccard { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: .9rem 1rem; display: flex; flex-direction: column; gap: .5rem; }
  .ccard .top { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
  pre.cmd { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .6rem .7rem; font-size: .75rem; white-space: pre-wrap; word-break: break-all; margin: .3rem 0 0; }
  .keybox { border: 1px solid var(--accent2); border-radius: 10px; padding: .9rem 1rem; background: #ffb45410; }
  textarea { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: .4rem .6rem; font: inherit; font-size: .85rem; width: 100%; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .7rem; align-items: end; }
  .form label { display: flex; flex-direction: column; gap: .25rem; font-size: .78rem; color: var(--muted); }
  [hidden] { display: none !important; }   /* over display rules like the one above */
  .kindpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .5rem; }
  .kindpick button { text-align: left; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: .55rem .7rem; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: .2rem; }
  .kindpick button span { color: var(--muted); font-size: .74rem; line-height: 1.3; }
  .kindpick button.on { border-color: var(--accent2); box-shadow: inset 0 0 0 1px var(--accent2); }
  .form label .sub2 { color: var(--muted); font-size: .72rem; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; }
  .uplot { font-family: inherit; }
</style>
</head>
<body>
<header>
  <h1><a href="/#/" title="Sentry Lens"><img src="/static/logo.svg" alt="">Sentry <span>Lens</span></a></h1>
  <nav class="sections" aria-label="Sections"><a href="/apps">Applications</a><a href="/#/" class="active">Network</a><a href="/infra">Infrastructure</a></nav>
  <nav>
    <a href="/#/">Overview</a>
    <a href="/#/live">Live</a>
    <a href="/#/hosts">Devices</a>
    <a href="/#/sites">Websites</a>
    <a href="/#/new">New today</a>
    <a href="/alerts">Alerts</a>
    <a href="/assets" class="active">Assets</a>
    <a href="/#/admin" id="navAdmin" hidden>Admin</a>
  </nav>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
</header>
<main>
  <div class="hero">
    <div class="title">
      <h2>Assets</h2>
      <div class="sub" id="sub">What the collectors find on the network.</div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="card">
    <div class="tabs" id="tabs"><button data-t="devices">Devices</button><button data-t="snmp">Network devices</button><button data-t="collectors">Collectors</button><button data-t="creds" id="tabCreds" hidden>Credentials</button></div>
    <div id="body"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script src="/static/vaultsignup.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const when = t => t ? new Date(t * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "-";
const ago = t => { if (!t) return "never"; const s = Date.now() / 1000 - t; return s < 90 ? "just now" : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
const localGet = k => { try { return localStorage.getItem("assets." + k); } catch (e) { return null; } };
const localSet = (k, v) => { try { localStorage.setItem("assets." + k, v); } catch (e) {} };
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.detail || `${r.status} ${r.statusText}`);
  return b;
}
const post = (path, body) => api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
// The usual service on a port (what the number most likely is - not a check).
const SVC = {21: "ftp", 22: "ssh", 23: "telnet", 25: "smtp", 53: "dns", 80: "http", 88: "kerberos", 110: "pop3", 111: "rpc", 135: "msrpc",
  139: "netbios", 143: "imap", 161: "snmp", 389: "ldap", 443: "https", 445: "smb", 465: "smtps", 515: "printer", 548: "afp", 554: "rtsp",
  587: "submission", 631: "ipp", 636: "ldaps", 993: "imaps", 995: "pop3s", 1433: "mssql", 1723: "pptp", 1883: "mqtt", 2049: "nfs",
  3000: "web", 3306: "mysql", 3389: "rdp", 5000: "upnp/web", 5060: "sip", 5432: "postgres", 5900: "vnc", 6379: "redis", 8000: "web",
  8006: "proxmox", 8008: "web", 8080: "web", 8081: "web", 8443: "https-alt", 8888: "web", 9000: "web", 9100: "jetdirect", 9090: "web", 49152: "upnp"};
const port = p => `<span class="port" title="${SVC[p] ? `usually ${SVC[p]}` : ""}">${p}${SVC[p] ? ` ${SVC[p]}` : ""}</span>`;
const status = a => a.known_only ? `<span class="st off" title="Never seen answering or sending - listed in the ${esc(a.collector)}"><i style="background:transparent;border:1px solid var(--muted)"></i>known</span>` : a.new && a.online ? `<span class="st new"><i style="background:var(--accent2)"></i>new</span>` : a.online ? `<span class="st on"><i></i>online</span>` : `<span class="st off"><i></i>offline</span>`;

const S = {tab: localGet("tab") || "devices", q: "", stf: "", vendor: "", data: null, cols: null, me: {}, open: ""};
fetch("/api/me").then(r => r.ok ? r.json() : null).then(me => {
  if (!me) return;
  S.me = me;
  if (me.auth && me.email) document.getElementById("who").innerHTML = `<span>${esc(me.name || me.email)}</span>${me.logout ? `<a href="${esc(me.logout)}">Sign out</a>` : ""}`;
  document.getElementById("navAdmin").hidden = me.role !== "admin";
  document.getElementById("tabCreds").hidden = !isAdmin();
  if (S.data) render();
}).catch(() => {});
const isAdmin = () => S.me.auth === false || S.me.role === "admin";

async function load() {
  try {
    [S.data, S.cols] = await Promise.all([api("/api/assets"), api("/api/collectors")]);
    render();
    watchSweeps();
  } catch (e) { document.getElementById("body").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function render() {
  const a = S.data.assets, cs = S.cols.collectors;
  document.getElementById("kpis").innerHTML = [[a.length, "devices"], [a.filter(x => x.online).length, "online"], [a.filter(x => x.new).length, "new in 24 h"],
    [`${cs.filter(c => c.online).length}/${cs.length}`, "collectors online"]].map(([v, l]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.t === S.tab));
  ({devices, snmp: snmpTab, collectors: collectorsTab, creds: credsTab})[S.tab]();
}

// ---------------- devices
function filtered() {
  const q = S.q.toLowerCase();
  return S.data.assets.filter(a => (!S.stf || (S.stf === "online" ? a.online : S.stf === "offline" ? !a.online && !a.known_only : S.stf === "known" ? a.known_only : a.new))
    && (!S.vendor || (a.vendor || "(unknown)") === S.vendor)
    && (!q || `${a.name} ${a.hostname} ${a.netbios} ${a.ip} ${a.ips.join(" ")} ${a.mac} ${a.vendor} ${a.tags.join(" ")} ${a.ports.join(" ")}`.toLowerCase().includes(q)));
}
function bars(list, max) {
  max = max || Math.max(1, ...list.map(x => x[1]));
  return list.map(([l, v, key]) => `<div class="vbar" ${key ? `data-vendor="${esc(key)}" style="cursor:pointer"` : ""} title="${esc(l)}"><span class="lbl">${esc(l)}</span><span class="track"><i style="width:${Math.max(1, 100 * v / max).toFixed(1)}%"></i></span><span class="v">${v}</span></div>`).join("");
}
function devices() {
  const all = S.data.assets;
  if (!all.length) {
    document.getElementById("body").innerHTML = `<div class="empty">No device yet. ${S.cols.collectors.length ? "The collectors haven't sent a sweep yet - the first comes a few minutes after they start." : `Add a collector on the <a href="#" id="toCol">Collectors</a> tab and start it on a machine of the network.`}</div>`;
    const t = document.getElementById("toCol"); if (t) t.onclick = e => { e.preventDefault(); setTab("collectors"); };
    return;
  }
  const vendors = {}, ports = {};
  all.forEach(a => { const v = a.vendor || "(unknown)"; vendors[v] = (vendors[v] || 0) + 1; a.ports.forEach(p => ports[p] = (ports[p] || 0) + 1); });
  // Devices first seen per day, the last 30 days.
  const day = 86400, today = Math.floor(Date.now() / 1000 / day), perDay = Array(30).fill(0);
  all.forEach(a => { const i = 29 - (today - Math.floor(a.first_seen / day)); if (i >= 0 && i < 30) perDay[i]++; });
  const maxDay = Math.max(1, ...perDay);
  const rows = filtered();

}
function table(rows) {
  if (!rows.length) return `<div class="empty">No device matches.</div>`;
  return `<table><thead><tr><th>Status</th><th>Name</th><th>Address</th><th>MAC</th><th>Vendor</th><th>Open ports</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
    ${rows.map(a => `<tr class="click" data-key="${esc(a.key)}"><td>${status(a)}</td>
      <td><b>${esc(a.name || "-")}</b>${a.tags.map(t => ` <span class="tag">#${esc(t)}</span>`).join("")}${a.hostname && a.hostname.split(".")[0] !== a.name ? `<div class="small muted">${esc(a.hostname)}</div>` : ""}</td>
      <td class="mono">${esc(a.ip)}${a.ips.length > 1 ? ` <span class="muted small" title="${esc(a.ips.join(", "))}">+${a.ips.length - 1}</span>` : ""}</td>
      <td class="mono">${esc(a.mac || "-")}</td><td class="small">${esc(a.vendor || "")}</td>
      <td style="white-space:normal;max-width:22rem">${a.ports.slice(0, 8).map(port).join("")}${a.ports.length > 8 ? ` <span class="muted small">+${a.ports.length - 8}</span>` : ""}</td>
      <td class="nw" title="${when(a.first_seen)}">${ago(a.first_seen)}</td><td class="nw" title="${when(a.last_seen)}">${ago(a.last_seen)}</td></tr>`).join("")}
  </tbody></table>`;
}
function wire() {
  document.querySelectorAll("tr[data-key]").forEach(tr => tr.onclick = e => {
    if (e.target.closest("a, button")) return;
    const open = tr.nextElementSibling && tr.nextElementSibling.classList.contains("exp");
    document.querySelectorAll("tr.exp").forEach(x => x.remove());
    document.querySelectorAll("tr.sel").forEach(x => x.classList.remove("sel"));
    if (open) return;
    tr.classList.add("sel");
    const exp = document.createElement("tr"); exp.className = "exp";
    exp.innerHTML = `<td colspan="${tr.cells.length}"><div class="expbox">Loading...</div></td>`;
    tr.after(exp);
    detail(tr.dataset.key, exp.querySelector(".expbox"));
  });
}

      <section><h4>Open ports</h4>${d.ports.length ? d.ports.map(port).join("") : `<span class="muted small">none of the top 100 answered</span>`}
        <h4 style="margin-top:.9rem">Seen, last 30 days</h4>
        <div class="strip">${Array.from({length: 30}, (_, i) => `<i class="${seen.has(today - 29 + i) ? "y" : ""}" title="${new Date((today - 29 + i) * day * 1000).toLocaleDateString()}${seen.has(today - 29 + i) ? ": seen" : ": not seen"}"></i>`).join("")}</div>
        <h4 style="margin-top:.9rem">Tags</h4><div id="tags">${d.tags.length ? d.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join(" ") : `<span class="muted small">none</span>`}</div>
        ${isAdmin() ? `<form id="tagf" style="display:flex;gap:.4rem;margin-top:.4rem"><input type="text" id="tagin" class="filter" style="width:12rem" placeholder="tags, comma-separated" value="${esc(d.tags.join(", "))}"><button class="btn">Save</button></form><div id="tagmsg" class="small"></div>` : ""}</section>
      <section><h4>Latest sightings</h4><div class="tbl" style="max-height:15rem;overflow-y:auto"><table><thead><tr><th>When</th><th>Address</th><th>By</th><th class="n">Reply</th></tr></thead><tbody>
        ${d.history.slice(0, 40).map(h => `<tr><td class="nw">${when(h.t)}</td><td class="mono">${esc(h.ip)}</td><td class="small">${esc(h.collector)} (${esc(h.method)})</td><td class="n">${h.rtt_ms ? `${h.rtt_ms} ms` : "-"}</td></tr>`).join("")}
      </tbody></table></div></section>
    </div>`;
  api(`/api/snmp/where/${encodeURIComponent(key)}`).then(w => {
    const el = box.querySelector("#whereBox"); if (!el) return;
    el.innerHTML = (w.connected ? `Connected to <b>${esc(w.connected.device)}</b>, port <b>${esc(w.connected.port)}</b>${w.connected.alias ? ` (${esc(w.connected.alias)})` : ""}` : "")
      + (w.snmp ? `${w.connected ? "<br>" : ""}<a href="#" id="toSnmp">Its SNMP view →</a>` : "");
    const t = box.querySelector("#toSnmp"); if (t) t.onclick = e => { e.preventDefault(); S.openSnmp = key; setTab("snmp"); };
  }).catch(() => {});
  const f = box.querySelector("#tagf");

    e.preventDefault();

      box.querySelector("#tags").innerHTML = r.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join(" ") || `<span class="muted small">none</span>`;
      const a = S.data.assets.find(x => x.key === key); if (a) a.tags = r.tags; }

// ---------------- collectors
const NEEDS_23 = "Needs collector 2.3.0 or newer - run its install line again to update it";
const EVERY = [5, 15, 30, 60, 120, 240, 720, 1440];
const mins = m => m >= 60 ? `${m / 60} h` : `${m} min`;
// Its subnets: each one's schedule, last sweep, and (admins) Sweep now.
function subnetTable(c) {
  const admin = isAdmin() && c.can_schedule, st = c.subnet_state || {}, now = c.sweep_now || {};
  const asked = s => now.id && (!now.subnets.length || now.subnets.includes(s));
  const pick = (s, m) => `<select class="every" data-s="${esc(s)}" aria-label="How often ${esc(s)} is swept">
      <option value="" ${m === c.interval_min ? "selected" : ""}>default (${mins(c.interval_min)})</option>
      ${EVERY.filter(e => e !== c.interval_min).map(e => `<option value="${e}" ${m === e ? "selected" : ""}>every ${mins(e)}</option>`).join("")}
      ${EVERY.includes(m) || m === 0 || m === c.interval_min ? "" : `<option value="${m}" selected>every ${mins(m)}</option>`}
      <option value="0" ${m === 0 ? "selected" : ""}>on demand only</option></select>`;
  const last = c.subnets.length < 2;
  return `<div class="tbl"><table class="small"><thead><tr><th>Subnet</th><th>Swept</th><th>Last sweep</th>${isAdmin() ? "<th></th>" : ""}</tr></thead><tbody>
    ${c.subnets.map(s => { const m = c.schedule[s] ?? c.interval_min, l = st[s];
      return `<tr><td class="mono nw">${esc(s)}</td>
        <td>${admin ? pick(s, m) : m ? `every ${mins(m)}` : "on demand only"}</td>
        <td class="nw">${asked(s) ? `<span style="color:var(--accent2)" title="Asked for ${ago(now.t)}">waiting for the collector</span>` : l ? `<span title="${when(l.last)}">${ago(l.last)}</span>, ${l.hosts}` : "-"}</td>
        ${isAdmin() ? `<td class="n nw">${admin ? `<button type="button" class="btn sweep1" data-s="${esc(s)}" ${asked(s) ? "disabled" : ""}>Sweep now</button> ` : ""}<button type="button" class="btn rmsub" data-s="${esc(s)}" ${last ? `disabled title="A collector needs at least one subnet - add another first"` : `title="Stop sweeping ${esc(s)} (what was found there stays)"`}>Remove</button></td>` : ""}</tr>`; }).join("")}
    </tbody></table></div>
    ${isAdmin() ? `<form class="addsub" style="display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin:.4rem 0">
      <input type="text" name="subnet" class="filter" style="width:12rem" placeholder="10.0.20.0/24" aria-label="Subnet to add" required>
      <button class="btn">Add subnet</button><span class="small muted">a /16 at most - swept from its next contact</span></form>` : ""}
    ${isAdmin() && !c.can_schedule && c.version ? `<div class="small muted">Its own schedule for each subnet, and Sweep now: ${NEEDS_23.toLowerCase()}.</div>` : ""}`;
}

async function reloadCollectors(id, note) {
  S.cols = await api("/api/collectors");
  collectorsTab();
  const m = document.querySelector(`.ccard[data-c="${CSS.escape(id)}"] .msg`);
  if (m) m.innerHTML = note;
  watchSweeps();
}

// While a sweep asked for is waiting: check every 15 s, and reload everything once it's done.
let sweepTimer = null;
function watchSweeps() {
  const pending = () => S.cols.collectors.filter(c => c.sweep_now && c.sweep_now.id).map(c => c.id).join();
  if (sweepTimer || !pending()) return;
  const before = pending();
  sweepTimer = setTimeout(async () => {
    sweepTimer = null;
    try { S.cols = await api("/api/collectors"); } catch (e) { return; }
    if (pending() !== before) await load();  // one finished: its devices and last sweep are in
    else watchSweeps();
  }, 15000);
}

// Updating an installed collector in place with the key it already has (in
// its config) - for one too old to update itself (before 2.5.0).
function reinstallBox() {
  const linux = `sudo bash -c 'C=/etc/sentry-collector/collector.conf; U=$(sed -n "s/^SENTRY_URL=//p" $C); K=$(sed -n "s/^SENTRY_KEY=//p" $C); curl -fsSL "$U/collector/install.sh" | bash -s -- --url "$U" --key "$K"'`;
  const win = `$c = Get-Content "$env:ProgramData\\SentryLens\\collector.conf"; $u = ($c -match '^SENTRY_URL=') -replace '^SENTRY_URL=',''; $k = ($c -match '^SENTRY_KEY=') -replace '^SENTRY_KEY=',''; & ([scriptblock]::Create((irm "$u/collector/install.ps1"))) -Url $u -Key $k`;
  return `<details style="margin-top:.3rem"><summary style="cursor:pointer">The line</summary>
    <div class="small muted" style="margin:.3rem 0 .15rem">Linux (as root - it reads the key from the collector's config, nothing to copy):</div><pre class="mono small" style="white-space:pre-wrap;word-break:break-all;margin:0">${esc(linux)}</pre>
    <div class="small muted" style="margin:.4rem 0 .15rem">Windows (PowerShell as administrator):</div><pre class="mono small" style="white-space:pre-wrap;word-break:break-all;margin:0">${esc(win)}</pre>
    <div class="small muted" style="margin-top:.3rem">Docker: <span class="mono">docker restart sentry-collector</span> (it fetches the collector at each start).</div></details>`;
}

    ${isAdmin() ? `<details class="card" style="margin-bottom:1.1rem" ${cs.length ? "" : "open"}><summary style="cursor:pointer"><b>Add a collector</b> <span class="muted small">- a small container on a machine of the network; it only talks out to Sentry Lens</span></summary>

        <label>Sweep every (minutes)<input type="number" name="interval" class="filter" value="30" min="5" max="1440"></label>
        <div><button class="btn primary">Add</button></div>

    ${cs.length ? `<div class="grid3">${cs.map(c => `<div class="ccard" data-c="${esc(c.id)}">

          <span class="spacer" style="flex:1"></span>${c.version ? `<span class="tag">v${esc(c.version)}</span>` : ""}${c.outdated && c.version ? `<span class="tag" style="color:var(--accent2)" title="Sentry Lens hands out ${esc(S.cols.version)}">update available</span>` : ""}</div>
        ${subnetTable(c)}
        <dl class="kv"><dt>Default</dt><dd>every ${c.interval_min} min</dd>

          <dt>Last sweep</dt><dd>${c.last_scan ? `${ago(c.last_scan)}, ${c.last_hosts} devices` : "not yet"}</dd>
          ${c.rotating ? `<dt>Key</dt><dd class="small" style="color:var(--accent2)">${c.can_rotate ? `rotating - it picks up its new key at its next contact${c.online ? " (within a minute)" : ""}` : "rotation waiting - this version can't keep a new key: run its install line again to update it"}</dd>`
            : c.creds_ok ? "" : `<dt>Credentials</dt><dd class="err">can't receive any yet - ${c.can_rotate ? "rotate" : "replace"} its key</dd>`}
          ${c.update_to ? `<dt>Update</dt><dd class="small" style="color:var(--accent2)">to v${esc(c.update_to)} - at its next contact${c.online ? " (within a minute; a Windows one within 5 more)" : ""}, then it restarts</dd>`
            : c.outdated && c.version && !c.can_update ? `<dt>Update</dt><dd class="small">v${esc(S.cols.version)} is out - this version can't update itself: run the line below on its machine once, from then on <b>Update</b> does it. ${reinstallBox()}</dd>`
            : c.updater ? `<dt>Updates</dt><dd class="small muted">${esc(c.updater)}</dd>` : ""}</dl>

          <input type="number" name="interval" class="filter" style="width:5rem" value="${c.interval_min}" min="5" max="1440" title="Every so many minutes, unless a subnet has its own schedule"> min</label><button class="btn">Save</button>
          <button type="button" class="btn primary sweepall" ${c.can_schedule ? "" : "disabled"} title="${c.can_schedule ? "Sweep all its subnets at its next contact (within a minute)" : NEEDS_23}">Sweep all now</button>

          <button type="button" class="btn rotate" ${c.can_rotate ? "" : "disabled"} title="${c.can_rotate ? "A new key, delivered to the collector at its next contact - nothing to reinstall" : "Needs collector 2.1.0 or newer (it keeps the new key) - run its install line again to update it"}">Rotate key</button>
          <button type="button" class="btn regen" title="For a lost or leaked key: the old one stops working now, and the collector needs the new one installed">Replace key</button>

  const ua = document.getElementById("updateAll");

      catch (err) { msg.innerHTML = `<span class="err">${esc(err.message)}</span>`; } };

      const s = af.elements.namedItem("subnet").value.trim();

      if (!confirm(`Stop sweeping ${b.dataset.s}? The devices found there stay in the inventory.`)) return;

    const sweepNow = async subnets => {

        await reloadCollectors(id, `<span class="ok">Schedule saved - the collector picks it up within a minute.</span>`); }
      catch (err) { msg.innerHTML = `<span class="err">${esc(err.message)}</span>`; }

    if (up) up.onclick = async () => {

          ? `<span class="ok">Update asked for - the collector updates at its next contact and shows its new version (refresh).</span>`
          : `<span class="ok">Update cancelled.</span>`); }
      catch (err) { msg.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    };
    ef.querySelector(".rotate").onclick = async () => {
      try { await post(`/api/collectors/${id}`, {rotate_key: true});
        S.cols = await api("/api/collectors"); collectorsTab();
        const m = document.querySelector(`.ccard[data-c="${CSS.escape(id)}"] .msg`);
        if (m) m.innerHTML = `<span class="ok">New key on its way - the collector switches to it at its next contact, the old one then stops working.</span>`; }
      catch (err) { msg.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    };
    ef.querySelector(".regen").onclick = async () => {
      if (!confirm("Replace this collector's key? The old one stops working at once (use this for a lost or leaked key - otherwise Rotate key): the collector needs the new one installed.")) return;
      try { const r = await post(`/api/collectors/${id}`, {regenerate_key: true});
        installBox(msg, r.key, "Key replaced - the old one no longer works: run the line again on its machine (it updates in place)."); }
      catch (err) { msg.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    };
    ef.querySelector(".del").onclick = async () => {
      if (!confirm("Delete this collector? Its key stops working; what it found stays.")) return;
      try { await post(`/api/collectors/${id}`, {delete: true}); S.cols = await api("/api/collectors"); collectorsTab(); } catch (err) { msg.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    };
  });
}

// ---------------- network devices (SNMP)
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const bps = b => { if (b == null) return "-"; const u = ["b/s", "kb/s", "Mb/s", "Gb/s", "Tb/s"]; let i = 0; while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; } return (i ? b.toFixed(1) : b.toFixed(0)) + " " + u[i]; };
const dur = s => { if (!s) return "-"; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600); return d ? `${d} d ${h} h` : `${h} h ${Math.floor(s % 3600 / 60)} min`; };
const speed = m => !m ? "-" : m >= 1000 ? `${m / 1000} Gb/s` : `${m} Mb/s`;
// A small line of an interface's in + out over the window (no axis: the numbers are next to it).
function sparkline(s) {
  if (!s || s.length < 2) return `<span class="muted small">-</span>`;
  const v = s.map(x => x[1] + x[2]), w = 90, h = 20, hi = Math.max(...v) || 1;
  const pts = v.map((x, i) => `${(i * w / (v.length - 1)).toFixed(1)},${(h - 2 - x * (h - 4) / hi).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" aria-hidden="true" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${css("--s1")}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
S.charts = [];

// ---------------- what profiles read (snmp.py PROFILES)
const inkBars = (sup, mini) => sup.filter(s => !s.waste).map(s => {
  const pct = s.pct, low = pct !== null && pct <= 15, c = s.color || css("--s1");
  return mini
    ? `<span title="${esc(s.name)}: ${pct === null ? s.state : pct + " %"}" style="display:inline-block;width:.55rem;height:1.6rem;margin-right:2px;vertical-align:middle;border:1px solid var(--border);border-radius:2px;position:relative;overflow:hidden">
         <i style="position:absolute;left:0;right:0;bottom:0;height:${pct ?? 0}%;background:${c}"></i></span>`
    : `<div style="display:grid;grid-template-columns:9rem 1fr 4rem;gap:.6rem;align-items:center;margin:.3rem 0">
         <span>${esc(s.name)}</span><span style="height:.7rem;background:var(--surface2);border-radius:4px;overflow:hidden">
         <i style="display:block;height:100%;width:${pct ?? 0}%;background:${c}"></i></span>
         <span class="n ${low ? "err" : ""}">${pct === null ? esc(s.state) : pct + " %"}</span></div>`;
}).join("") + (mini ? "" : sup.filter(s => s.waste).map(s => `<div class="small muted">${esc(s.name)}: ${s.pct === null ? esc(s.state) : s.pct + " % full"}</div>`).join(""));

const SENSOR_UNITS = {3: "V AC", 4: "V DC", 5: "A", 6: "W", 7: "Hz", 8: "°C", 9: "%RH", 10: "rpm", 11: "cmm", 12: ""};
const rows = o => Object.entries(o || {}).sort((a, b) => a[0].localeCompare(b[0], undefined, {numeric: true})).map(([i, r]) => ({i, ...r}));
const num = v => v === undefined || v === "" ? null : +v;
const bytesOf = n => n >= 1e12 ? (n / 1e12).toFixed(1) + " TB" : n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(0) + " MB" : n + " B";
const kv = pairs => `<dl class="kv">${pairs.filter(([, v]) => v !== null && v !== undefined && v !== "").map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;

function profileSections(d) {
  const t = d.tables || {}, out = [];
  if (d.supplies.length) {
    const pages = rows(t.pages)[0], st = rows(t.printer)[0];
    out.push(`<section><h4>Supplies</h4>${inkBars(d.supplies, false)}
      ${kv([["Pages printed", pages ? (+pages.count).toLocaleString() : null],
            ["State", st ? ({1: "other", 2: "unknown", 3: "idle", 4: "printing", 5: "warming up"}[st.status] || st.status) : null]])}</section>`);
  }
  const disks = rows(t.storage).filter(s => +s.size > 0 && /25\.2\.1\.(2|3|4)$/.test(s.type || ""));
  if (disks.length) out.push(`<section><h4>Storage and memory</h4>${disks.slice(0, 12).map(s => {
    const total = s.size * s.unit, used = s.used * s.unit, pct = Math.round(100 * used / total);
    return `<div style="display:grid;grid-template-columns:minmax(6rem,12rem) 1fr 8rem;gap:.6rem;align-items:center;margin:.3rem 0"><span class="small" title="${esc(s.descr)}">${esc(s.descr.slice(0, 40))}</span>
      <span style="height:.7rem;background:var(--surface2);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:${pct > 90 ? "var(--fail)" : css("--s1")}"></i></span>
      <span class="n small">${bytesOf(used)} / ${bytesOf(total)}</span></div>`; }).join("")}
    ${rows(t.cpu).length ? `<div class="small" style="margin-top:.4rem">CPU: ${Math.round(rows(t.cpu).reduce((a, c) => a + +c.load, 0) / rows(t.cpu).length)} % over ${rows(t.cpu).length} core(s)</div>` : ""}</section>`);
  const sensors = rows(t.sensors).filter(s => SENSOR_UNITS[s.type] !== undefined);
  if (sensors.length) out.push(`<section><h4>Sensors</h4><div class="tbl"><table><tbody>${sensors.slice(0, 40).map(s => {
    const v = +s.value * Math.pow(10, -(+s.precision || 0)) * Math.pow(10, ((+s.scale || 9) - 9) * 3);
    return `<tr><td>${esc(s.name || "sensor " + s.i)}</td><td class="n">${+v.toFixed(2)} ${SENSOR_UNITS[s.type]}</td><td class="small ${+s.status === 1 ? "" : "err"}">${+s.status === 1 ? "ok" : "not ok"}</td></tr>`; }).join("")}</tbody></table></div></section>`);
  const ups = rows(t.ups)[0], apc = rows(t.apc_ups)[0];
  if (ups || apc) {
    const u = ups || {}, a = apc || {}, out1 = rows(t.ups_output)[0] || {};
    out.push(`<section><h4>UPS</h4>${kv([
      ["Model", esc(a.model || u.model || "")], ["Battery", (a.charge ?? u.charge) !== undefined ? `${a.charge ?? u.charge} %` : null],
      ["Runtime left", a.runtime_ticks ? dur(a.runtime_ticks / 100) : u.minutes_left !== undefined ? `${u.minutes_left} min` : null],
      ["Load", (a.load ?? out1.load) !== undefined ? `${a.load ?? out1.load} %` : null],
      ["On battery", a.output_status ? (+a.output_status === 3 ? "<b class='err'>yes</b>" : "no") : u.output_source ? (+u.output_source === 5 ? "<b class='err'>yes</b>" : "no") : null],
      ["Battery", +a.replace === 2 || +u.battery_status === 3 ? "<b class='err'>replace / low</b>" : null],
      ["Temperature", (a.battery_temp ?? u.battery_temp) !== undefined ? `${a.battery_temp ?? u.battery_temp} °C` : null]])}</section>`);
  }
  const poe = rows(t.poe);
  if (poe.length) {
    const ports = rows(t.poe_ports), on = ports.filter(p => +p.detect === 3).length;
    out.push(`<section><h4>PoE</h4>${kv(poe.map(p => [`Budget ${poe.length > 1 ? p.i : ""}`, `${p.used_w ?? "?"} W used of ${p.power_w} W`]).concat([["Powering", `${on} of ${ports.length} ports`]]))}</section>`);
  }
  const vl = rows(t.vlans);
  if (vl.length) out.push(`<section><h4>VLANs</h4><div class="small">${vl.slice(0, 60).map(v => `<span class="tag">${esc(v.i)} ${esc(v.name)}</span>`).join(" ")}</div></section>`);
  const syn = rows(t.synology)[0];
  if (syn) {
    const ok = v => +v === 1 ? "ok" : "<b class='err'>failed</b>";
    out.push(`<section><h4>Synology</h4>${kv([["Model", esc(syn.model)], ["DSM", esc(syn.version)], ["System", ok(syn.status)], ["Temperature", syn.temp ? syn.temp + " °C" : null],
      ["Fans", syn.fan_system ? `${ok(syn.fan_system)} / ${ok(syn.fan_cpu)}` : null], ["Update", {1: "available", 2: "up to date"}[syn.upgrade] || null]])}
      ${rows(t.synology_raid).map(r => `<div class="small">${esc(r.name)}: ${+r.status === 1 ? "normal" : "<b class='err'>status " + esc(r.status) + "</b>"}${+r.total ? `, ${bytesOf(+r.free)} free of ${bytesOf(+r.total)}` : ""}</div>`).join("")}
      ${rows(t.synology_disks).map(x => `<div class="small">${esc(x.name)} ${esc(x.model)}: ${+x.status === 1 ? "ok" : "<b class='err'>status " + esc(x.status) + "</b>"}, ${esc(x.temp)} °C</div>`).join("")}</section>`);
  }
  return out.length ? `<div class="expgrid" style="margin-top:1rem">${out.join("")}</div>` : "";
}

async function snmpTab() {
  const body = document.getElementById("body");
  let d;
  try { d = await api("/api/snmp/devices"); } catch (e) { body.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  S.snmp = d.devices;
  if (!d.devices.length) {
    body.innerHTML = `<div class="empty">No device read over SNMP yet. ${isAdmin() ? `Add an SNMP community or v3 user on the <a href="#" id="toCreds">Credentials</a> tab` : "An admin adds SNMP credentials"} - the collectors try them at their next sweep.</div>`;
    const t = document.getElementById("toCreds"); if (t) t.onclick = e => { e.preventDefault(); setTab("creds"); };
    return;
  }
  body.innerHTML = `<p class="muted small" style="margin-top:0">Devices that answer the SNMP credentials: read at each sweep, their interface counters every 5 minutes. Click one for its interfaces, what's on each port and its neighbors.</p>
    <div class="tbl"><table><thead><tr><th>Status</th><th>Device</th><th>Address</th><th>Vendor / model</th><th>Firmware</th><th>Supplies</th><th class="n">Ports up</th><th>Up for</th><th>Read</th></tr></thead><tbody>
    ${d.devices.map(x => `<tr class="click" data-snmp="${esc(x.key)}"><td>${x.online ? `<span class="st on"><i></i>online</span>` : `<span class="st off"><i></i>stale</span>`}</td>
      <td><b>${esc(x.name || x.ip)}</b>${x.location ? `<div class="small muted">${esc(x.location)}</div>` : ""}</td><td class="mono">${esc(x.ip)}</td>
      <td>${esc(x.vendor)}<div class="small muted">${esc(x.model || x.sys_descr.slice(0, 70))}</div></td><td class="small">${esc(x.firmware || "-")}</td>
      <td class="nw">${x.supplies.length ? inkBars(x.supplies, true) : ""}</td><td class="n">${x.if_up} / ${x.if_count}</td><td class="nw">${dur(x.uptime_s)}</td><td class="nw">${ago(x.last_poll)}</td></tr>`).join("")}
    </tbody></table></div>`;
  body.querySelectorAll("tr[data-snmp]").forEach(tr => tr.onclick = e => {
    const open = tr.nextElementSibling && tr.nextElementSibling.classList.contains("exp");
    body.querySelectorAll("tr.exp").forEach(x => x.remove()); body.querySelectorAll("tr.sel").forEach(x => x.classList.remove("sel"));
    S.charts.forEach(u => u.destroy()); S.charts = [];
    if (open) return;
    tr.classList.add("sel");
    const exp = document.createElement("tr"); exp.className = "exp";
    exp.innerHTML = `<td colspan="${tr.cells.length}"><div class="expbox">Loading...</div></td>`;
    tr.after(exp);
    snmpDetail(tr.dataset.snmp, exp.querySelector(".expbox"));
  });
  if (S.openSnmp) { const tr = body.querySelector(`tr[data-snmp="${CSS.escape(S.openSnmp)}"]`); S.openSnmp = ""; if (tr) tr.click(); }
}

async function snmpDetail(key, box, hours = 24) {
  let d;
  try { d = await api(`/api/snmp/device/${encodeURIComponent(key)}?hours=${hours}`); } catch (e) { box.innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  const ifs = d.interfaces.filter(i => i.type !== 24);  // not loopback
  const busy = [...ifs].sort((a, b) => ((b.rx || 0) + (b.tx || 0)) - ((a.rx || 0) + (a.tx || 0)));
  S.port = S.port && ifs.some(i => i.if_index === S.port) ? S.port : (busy[0] || {}).if_index;
  box.innerHTML = `
    <div class="expgrid">
      <section><h4>Device</h4><dl class="kv">
        <dt>Name</dt><dd>${esc(d.sys_name || "-")}</dd><dt>Vendor</dt><dd>${esc(d.vendor || "-")}</dd><dt>Model</dt><dd>${esc(d.model || "-")}</dd>
        <dt>Hardware</dt><dd>${esc(d.hardware || "-")}</dd><dt>Serial</dt><dd class="mono">${esc(d.serial || "-")}</dd><dt>Firmware</dt><dd>${esc(d.firmware || "-")}</dd>
        <dt>Up for</dt><dd>${dur(d.uptime_s)}</dd><dt>Location</dt><dd>${esc(d.location || "-")}</dd><dt>Contact</dt><dd>${esc(d.contact || "-")}</dd>
        <dt>Description</dt><dd class="small">${esc(d.sys_descr)}</dd></dl></section>
      <section><h4>Neighbors (LLDP / CDP)</h4>${d.neighbors.length ? `<div class="tbl"><table><thead><tr><th>Our port</th><th>Neighbor</th><th>Its port</th><th>Address</th></tr></thead><tbody>
        ${d.neighbors.map(n => `<tr><td>${esc(n.local_port || n.local_if)}</td><td><b>${esc(n.remote_name)}</b><div class="small muted">${esc(n.proto)}${n.remote_descr ? ` · ${esc(n.remote_descr.slice(0, 60))}` : ""}</div></td>
          <td>${esc(n.remote_port_descr || n.remote_port)}</td><td class="mono">${esc(n.remote_mgmt || n.remote_chassis)}</td></tr>`).join("")}</tbody></table></div>`
        : `<div class="muted small">None reported (LLDP and CDP off, or nothing that speaks them is connected).</div>`}
        <h4 style="margin-top:.9rem">Its ARP table</h4><div class="small">${d.arp_entries} entries</div></section>
    </div>
    ${profileSections(d)}
    <div style="margin-top:1rem"><div class="head" style="margin-bottom:.4rem"><h4 style="margin:0">Traffic: <span id="portName"></span></h4><span class="spacer" style="flex:1"></span>
      <div class="seg" id="hrs">${[[6, "6h"], [24, "24h"], [168, "7d"], [720, "30d"]].map(([v, l]) => `<button data-h="${v}" class="${v === hours ? "active" : ""}">${l}</button>`).join("")}</div></div>
      <div id="ifchart"></div>
      <div class="legend" style="display:flex;gap:1rem;font-size:.78rem;margin-top:.3rem"><span><i class="sw" style="background:${css("--s1")}"></i> In</span><span><i class="sw" style="background:#d95926"></i> Out</span></div></div>
    <h4 style="margin-top:1rem">Interfaces <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">- click one for its graph; ${ifs.filter(i => i.oper === 1).length} of ${ifs.length} up</span></h4>
    <div class="tbl"><table><thead><tr><th>Status</th><th>Interface</th><th>Speed</th><th class="n">In</th><th class="n">Out</th><th>Last ${hours < 48 ? hours + " h" : hours / 24 + " d"}</th><th class="n">Errors / h</th><th>On this port</th></tr></thead><tbody>
    ${ifs.map(i => `<tr class="click ifrow ${i.if_index === S.port ? "sel" : ""}" data-if="${i.if_index}">
      <td>${i.admin === 2 ? `<span class="st off"><i></i>disabled</span>` : i.oper === 1 ? `<span class="st on"><i></i>up</span>` : `<span class="st off"><i></i>down</span>`}</td>
      <td><b>${esc(i.name || i.descr)}</b>${i.alias ? ` <span class="muted small">${esc(i.alias)}</span>` : ""}${i.name && i.descr && i.descr !== i.name ? `<div class="small muted">${esc(i.descr.slice(0, 60))}</div>` : ""}</td>
      <td class="nw">${speed(i.speed_mbps)}</td><td class="n">${bps(i.rx)}</td><td class="n">${bps(i.tx)}</td><td>${sparkline(i.series)}</td>
      <td class="n ${i.errors > 0 ? "err" : ""}">${i.errors ? Math.round(i.errors * 3600) : 0}</td>
      <td class="small" style="white-space:normal;max-width:20rem">${i.neighbors.length ? i.neighbors.map(n => `<b>${esc(n.remote_name)}</b> (${esc(n.remote_port_descr || n.remote_port)})`).join(", ") + "<br>" : ""}
        ${i.macs.length > 4 ? `${i.macs.length} devices (an uplink?)` : i.macs.map(m => m.name ? `${esc(m.name)}` : `<span class="mono">${esc(m.mac)}</span>`).join(", ")}</td></tr>`).join("")}
    </tbody></table></div>`;
  const draw = () => {
    S.charts.forEach(u => u.destroy()); S.charts = [];
    const i = ifs.find(x => x.if_index === S.port), el = box.querySelector("#ifchart");
    box.querySelector("#portName").textContent = i ? `${i.name || i.descr}${i.alias ? ` (${i.alias})` : ""}` : "";
    box.querySelectorAll(".ifrow").forEach(r => r.classList.toggle("sel", +r.dataset.if === S.port));
    if (!i || i.series.length < 2) { el.innerHTML = `<div class="empty">No traffic readings yet - they come every 5 minutes.</div>`; return; }
    el.innerHTML = "";
    const t = i.series.map(x => x[0]), c1 = css("--s1"), c2 = "#d95926", tip = document.createElement("div");
    tip.className = "tip"; tip.style.cssText = "position:absolute;pointer-events:none;z-index:5;background:#0b0f16f2;border:1px solid var(--border);border-radius:8px;padding:.4rem .55rem;font-size:.78rem;display:none;white-space:nowrap";
    const ax = {stroke: css("--muted"), grid: {stroke: css("--border"), width: 1}, ticks: {show: false}, font: "11px system-ui"};
    S.charts.push(new uPlot({width: el.clientWidth, height: 200, legend: {show: false}, cursor: {drag: {x: false, y: false}},
      scales: {x: {time: true}, y: {range: (u, mn, mx) => [0, Math.max(mx * 1.15, 1000)]}},
      series: [{}, {stroke: c1, fill: c1 + "30", width: 2, points: {show: false}}, {stroke: c2, width: 2, points: {show: false}}],
      axes: [ax, {...ax, size: 70, values: (u, v) => v.map(bps)}],
      hooks: {init: [u => u.over.appendChild(tip)], setCursor: [u => {
        const k = u.cursor.idx; if (k == null || u.cursor.left < 0) { tip.style.display = "none"; return; }
        tip.innerHTML = `<div class="muted">${when(t[k])}</div>In ${bps(i.series[k][1])}<br>Out ${bps(i.series[k][2])}`;
        tip.style.display = "block"; const w = tip.offsetWidth, x = u.cursor.left;
        tip.style.left = (x + 14 + w > u.over.clientWidth ? x - w - 14 : x + 14) + "px"; tip.style.top = Math.max(0, u.cursor.top - 20) + "px"; }]}},
      [t, i.series.map(x => x[1]), i.series.map(x => x[2])], el));
  };
  draw();
  box.querySelectorAll(".ifrow").forEach(r => r.onclick = e => { e.stopPropagation(); S.port = +r.dataset.if; draw(); });
  box.querySelectorAll("#hrs button").forEach(b => b.onclick = e => { e.stopPropagation(); snmpDetail(key, box, +b.dataset.h); });
  box.addEventListener("click", e => e.stopPropagation());
}

// ---------------- credentials (admins)
// ---------------- credentials: SNMP, SSH, WinRM, Proxmox API - kept in Sentry Lens's vault when it has one
// Each kind: what it's for, its own fields, and its own columns in the list.
const CRED = {
  snmp_v2c: {label: "SNMP v2c", group: "snmp", what: "A read-only community - switches, routers, printers, NAS, UPS."},
  snmp_v3: {label: "SNMP v3", group: "snmp", what: "A v3 user with read access - the same devices, signed and encrypted."},
  ssh: {label: "SSH", group: "ssh", what: "A Linux, Proxmox or network-gear login - the collector reads OS, hardware, software and updates."},
  winrm: {label: "WinRM", group: "winrm", what: "A Windows login (no administrator rights needed) - the collector reads it over WinRM."},
  proxmox: {label: "Proxmox API", group: "proxmox", what: "An API token with the PVEAuditor role - VMs, containers, storage, nodes."},

const CRED_GROUPS = [["snmp", "Network devices - SNMP"], ["ssh", "Linux, Proxmox, network gear - SSH"], ["winrm", "Windows - WinRM"], ["proxmox", "Proxmox - API"]];
const CRED_SECRETS = ["community", "auth_pass", "priv_pass", "password", "private_key", "secret"];
// The form's fields, by kind: [name, label, input, hint].
function credFields(kind) {
  const pw = (n, ph = "") => `<input type="password" name="${n}" class="filter" autocomplete="new-password" placeholder="${ph}">`;
  const tx = (n, ph = "") => `<input type="text" name="${n}" class="filter" autocomplete="off" spellcheck="false" placeholder="${ph}">`;
  const port = d => `<input type="number" name="port" class="filter" min="1" max="65535" placeholder="${d}">`;
  return {
    snmp_v2c: [["community", "Community", pw("community", "public is a poor choice - a read-only one of your own"), "Read-only is all it needs."]],
    snmp_v3: [["user", "User", tx("user", "snmpreader")],
      ["level", "Security level", `<select name="level"><option value="authPriv">authPriv - signed and encrypted</option><option value="authNoPriv">authNoPriv - signed</option><option value="noAuthNoPriv">noAuthNoPriv</option></select>`],
      ["auth_proto", "Authentication", `<select name="auth_proto"><option>SHA</option><option>SHA-256</option><option>SHA-512</option><option>SHA-224</option><option>SHA-384</option><option>MD5</option></select>`],
      ["auth_pass", "Authentication password", pw("auth_pass", "8 characters or more")],
      ["priv_proto", "Privacy (encryption)", `<select name="priv_proto"><option>AES</option><option>AES-256</option><option>AES-192</option><option>DES</option></select>`],
      ["priv_pass", "Privacy password", pw("priv_pass", "8 characters or more")]],
    ssh: [["user", "User", tx("user", "sentry"), "An account with no sudo is enough."],
      ["password", "Password", pw("password", "or a private key below")],
      ["private_key", "Private key", `<textarea name="private_key" class="filter" rows="4" spellcheck="false" style="font-family:ui-monospace,monospace;font-size:.75rem" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>`, "Instead of a password, or with it."],
      ["port", "Port", port(22)]],
    winrm: [["user", "User", tx("user", "sentry, PC\\sentry or sentry@domain"), "Remote Management Users is enough - no administrator."],
      ["password", "Password", pw("password")],
      ["https", "Transport", `<select name="https"><option value="true">HTTPS (5986)</option><option value="false">HTTP (5985)</option></select>`],
      ["port", "Port", port("5986 / 5985")]],
    proxmox: [["user", "Token ID", tx("user", "sentry@pve!lens"), "Datacenter > Permissions > API Tokens - with the PVEAuditor role."],
      ["secret", "Token secret", pw("secret", "the UUID shown when the token was made")],
      ["port", "Port", port(8006)]],
  }[kind];
}
// ---------------- your vault account: made here, encrypted in this browser
// Vaultwarden's sign-ups stay closed (no mail server: no invitation link);
// the vault's admins make their account here. Bitwarden's client side, with
// vaultsignup.js: the master password never leaves the browser - Sentry Lens only
// passes the encrypted account on.
async function vaultMe() {
  const el = document.getElementById("vaultme");
  if (!el) return;
  let m;
  try { m = await api("/api/vault/me"); } catch (e) { el.innerHTML = ""; return; }
  const box = inner => `<div class="card" style="margin-bottom:1rem">${inner}</div>`;
  if (m.status === "none") { el.innerHTML = box(`<span class="small muted">Your email (${esc(m.email)}) isn't one of the vault's admins (sl_admin_emails) - an admin of Sentry Lens can add it.</span>`); return; }
  if (m.status === "confirmed") { el.innerHTML = box(`<span class="st on"><i></i>your vault account</span> <span class="small">Ready: sign in at <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a> as <b>${esc(m.email)}</b> - the organization's logins are in it.</span>`); return; }
  if (m.status === "accepted") { el.innerHTML = box(`<span class="st off"><i></i>your vault account</span> <span class="small">Made - Sentry Lens lets you into the organization within 5 minutes.</span>`); return; }
  el.innerHTML = box(`<b>Your vault account</b>
    <p class="small" style="margin:.4rem 0 .6rem">Not made yet. Choose your <b>master password</b> for the vault (${esc(m.email)}): this browser encrypts your
      account with it - Sentry Lens never sees it, and nobody can recover it if you lose it. Then sign in at the vault, or in any Bitwarden app, with it.</p>
    ${VaultSignup.secure() ? "" : `<p class="small muted" style="margin:0 0 .6rem">This page is plain HTTP: the encryption still happens in your browser (a little slower),
      but on an HTTPS page nobody on the network could tamper with the page itself - its public address is the better place.</p>`}
    <form class="form" id="vsform"><label>Master password<input type="password" name="p1" class="filter" autocomplete="new-password" minlength="12" required></label>
      <label>Again<input type="password" name="p2" class="filter" autocomplete="new-password" required></label>
      <div><button class="btn primary">Create my vault account</button></div></form><div class="small" id="vsmsg"></div>`);
  const f = document.getElementById("vsform"), msg = document.getElementById("vsmsg");
  f.onsubmit = async e => {
    e.preventDefault();
    if (f.p1.value.length < 12) { msg.innerHTML = `<span class="err">12 characters or more - a few words make a good one.</span>`; return; }
    if (f.p1.value !== f.p2.value) { msg.innerHTML = `<span class="err">The two don't match.</span>`; return; }
    msg.innerHTML = `<span class="muted">Encrypting in this browser${VaultSignup.secure() ? "" : " (up to half a minute)"}...</span>`;
    try {
      const acct = await VaultSignup.account(m.email, f.p1.value);
      f.reset();
      const r = await post("/api/vault/signup", acct);
      msg.innerHTML = `<span class="ok">Your vault account is made${r.status === "confirmed" ? " and in the organization" : ""}: sign in at <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a> as ${esc(m.email)}.</span>`;
    } catch (err) { msg.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
  };
}

async function credsTab() {
  const body = document.getElementById("body");
  let d;
  try { d = await api("/api/credentials"); } catch (e) { body.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const noKey = S.cols.collectors.filter(c => !c.creds_ok), v = d.vault || {};
  const byGroup = g => d.credentials.filter(c => (CRED[c.kind] || {}).group === g);
  const scope = c => c.scope.length ? c.scope.map(esc).join(", ") : `<span class="muted">everywhere</span>`;
  const added = c => `${c.created ? ago(c.created) : "-"}${c.by ? `<div class="sub2">${esc(c.by)}</div>` : ""}${c.origin ? `<div class="sub2">made by ${esc(c.origin)}</div>` : ""}`;
  const acts = c => `<td class="nw"><button class="btn" data-editcred="${esc(c.id)}">Edit</button> <button class="btn danger" data-delcred="${esc(c.id)}">Delete</button></td>`;
  const x = c => c.edit || {};
  const COLS = {
    snmp: [["Name", c => `<b>${esc(c.name)}</b>`], ["Version", c => c.kind === "snmp_v2c" ? "v2c community" : `v3 user <span class="mono">${esc(x(c).user)}</span><div class="sub2">${esc(x(c).level || "")}${x(c).auth_proto ? ` - ${esc(x(c).auth_proto)}/${esc(x(c).priv_proto || "-")}` : ""}</div>`],
           ["Scope", scope], ["Devices answering", c => `<span class="n">${c.devices}</span>`], ["Added", added]],
    ssh: [["Name", c => `<b>${esc(c.name)}</b>`], ["User", c => `<span class="mono">${esc(x(c).user)}</span>`], ["Signs in with", c => x(c).key ? `key${x(c).key === "in the vault" ? " (in the vault)" : ""}` : "password"],
          ["Port", c => x(c).port || 22], ["Scope", scope], ["Added", added]],
    winrm: [["Name", c => `<b>${esc(c.name)}</b>`], ["User", c => `<span class="mono">${esc(x(c).user)}</span>`], ["Transport", c => `${x(c).https === false ? "HTTP" : "HTTPS"} ${x(c).port || ""}`],
            ["Scope", scope], ["Added", added]],
    proxmox: [["Name", c => `<b>${esc(c.name)}</b>`], ["Token ID", c => `<span class="mono">${esc(x(c).user)}</span>`], ["Port", c => x(c).port || 8006], ["Scope", scope], ["Added", added]],
  };
  body.innerHTML = `
    <div class="card" style="margin-bottom:1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap">
      ${v.on ? `<span class="st ${v.error ? "off" : "on"}"><i></i>${v.error ? "vault unreachable" : "in the vault"}</span>
        <span class="small">Kept in Sentry Lens's vault - Vaultwarden, organization <b>${esc(v.org)}</b> / <b>${esc(v.collection)}</b>: you see and edit them in any Bitwarden app too.</span>
        <span style="flex:1"></span><a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">Open the vault</a>
        ${v.error ? `<div class="err small" style="flex-basis:100%">${esc(v.error)} - the collectors keep the last ones read.</div>` : ""}`
      : `<span class="st off"><i></i>no vault</span><span class="small">Kept here, encrypted with Sentry Lens's key. With Sentry Lens's vault (vaultwarden.yml) they move into it.</span>`}
    </div>
    ${v.on ? `<div id="vaultme"></div>` : ""}
    ${noKey.length ? `<p class="err small">${noKey.map(c => esc(c.name)).join(", ")}: made before credentials could be sent - regenerate its key on the Collectors tab, then restart it with the new one.</p>` : ""}
    <details class="card" id="creddet" style="margin-bottom:1.1rem" ${d.credentials.length ? "" : "open"}><summary style="cursor:pointer"><b id="credtitle">Add a credential</b></summary>
      <div class="kindpick" id="credkind" style="margin-top:.9rem">${Object.entries(CRED).map(([k, c]) => `<button type="button" data-kind="${k}"><b>${c.label}</b><span>${c.what}</span></button>`).join("")}</div>
      <form class="form" id="credf" style="margin-top:.9rem">
        <label>Name<input type="text" name="cname" class="filter" required maxlength="80" placeholder="what it's for - e.g. Linux servers"></label>
        <label>For these hosts or subnets<input type="text" name="scope" class="filter" placeholder="empty: everywhere - 192.168.1.0/24, 192.168.1.20"></label>
        <div id="credfields" style="display:contents"></div>
        <div style="grid-column:1/-1"><button class="btn primary" id="credsave">Add</button> <button type="button" class="btn" id="credcancel" hidden>Cancel</button></div>
      </form><div id="credmsg" class="small"></div></details>
    ${d.credentials.length ? CRED_GROUPS.filter(([g]) => byGroup(g).length).map(([g, title]) => `
      <div class="card" style="margin-bottom:1rem"><div class="head"><h3>${title}</h3><span class="small muted">${byGroup(g).length}</span></div>
        <div class="tbl"><table><thead><tr>${COLS[g].map(([h]) => `<th>${h}</th>`).join("")}<th></th></tr></thead><tbody>
        ${byGroup(g).map(c => `<tr>${COLS[g].map(([, f]) => `<td class="small">${f(c)}</td>`).join("")}${acts(c)}</tr>`).join("")}</tbody></table></div></div>`).join("")
      : `<div class="empty">No credential yet.</div>`}`;
  if (v.on) vaultMe();
  const f = document.getElementById("credf");
  let editing = null, kind = "snmp_v2c";  // the credential being edited, else adding
  const setKind = (k, keep) => {
    kind = k;
    document.querySelectorAll("#credkind button").forEach(b => b.classList.toggle("on", b.dataset.kind === k));
    document.getElementById("credfields").innerHTML = credFields(k).map(([n, label, input, hint]) =>
      `<label${n === "private_key" ? ' style="grid-column:1/-1"' : ""}>${label}${input}${hint ? `<span class="sub2">${hint}</span>` : ""}</label>`).join("");
    if (keep) keep();
  };
  document.querySelectorAll("#credkind button").forEach(b => b.onclick = () => { if (!editing || editing.kind.startsWith("snmp") === b.dataset.kind.startsWith("snmp")) setKind(b.dataset.kind); });
  setKind(kind);
  // Editing: the secrets are never sent back - one left empty keeps the stored one.
  body.querySelectorAll("[data-editcred]").forEach(btn => btn.onclick = () => {
    const c = d.credentials.find(c => c.id === btn.dataset.editcred), e = c.edit || {};
    editing = c;
    f.reset();
    f.cname.value = c.name; f.scope.value = c.scope.join(", ");
    setKind(c.kind, () => {
      for (const [k, val] of Object.entries(e)) if (f[k] && val !== undefined && val !== "") f[k].value = String(val);
      CRED_SECRETS.forEach(n => { if (f[n]) f[n].placeholder = n === "private_key" && e.key === "in the vault" ? "the key in the vault - paste one to replace it" : "unchanged - type to replace"; });
    });
    document.getElementById("credtitle").textContent = `Edit ${c.name}`;
    document.getElementById("credsave").textContent = "Save";
    document.getElementById("credcancel").hidden = false;
    document.getElementById("credmsg").innerHTML = "";
    const det = document.getElementById("creddet"); det.open = true; det.scrollIntoView({behavior: "smooth", block: "start"});
  });
  document.getElementById("credcancel").onclick = () => credsTab();
  f.onsubmit = async ev => {
    ev.preventDefault();
    const b = {name: f.cname.value, kind, scope: f.scope.value};
    credFields(kind).forEach(([n]) => { if (f[n] && f[n].value !== "") b[n] = f[n].value; });
    try {
      await post(editing ? `/api/credentials/${editing.id}` : "/api/credentials", b);
      await credsTab();
      document.getElementById("creddet").open = true;
      document.getElementById("credmsg").innerHTML = `<span class="ok">${esc(b.name)} ${editing ? "saved" : "added"}${v.on ? " in the vault" : ""} - the collectors use it from their next contact (within a minute).</span>`;
    } catch (err) { document.getElementById("credmsg").innerHTML = `<span class="err">${esc(err.message)}</span>`; }
  };
  body.querySelectorAll("[data-delcred]").forEach(btn => btn.onclick = async () => {
    const c = d.credentials.find(c => c.id === btn.dataset.delcred);
    if (!confirm(`Delete ${c.name}? The collectors stop using it from their next contact.${v.on ? " It goes to the vault's trash (restorable there for 30 days)." : ""}`)) return;
    try { await post(`/api/credentials/${btn.dataset.delcred}`, {delete: true}); credsTab(); } catch (err) { alert(err.message); }
  });
}

// The key (shown this once) and the line that installs the collector on each system, for the chosen Sentry Lens address.
function installBox(el, key, title) {
  const urls = S.cols.urls || [location.origin];
  let os = localGet("os") || "linux", url = urls[0];
  const lines = u => ({
    linux: `curl -fsSL ${u}/collector/install.sh | sudo bash -s -- --key ${key}`,
    windows: `& ([scriptblock]::Create((irm ${u}/collector/install.ps1))) -Key ${key}`,
    docker: `docker run -d --name sentry-collector --restart unless-stopped --network host -e SENTRY_URL=${u} -e SENTRY_KEY=${key} \\\n  -v sentry-collector:/var/lib/sentry-collector -e SENTRY_STATE=/var/lib/sentry-collector \\\n  alpine:3.20 sh -c 'a=$(uname -m); case $a in x86_64) a=amd64;; aarch64) a=arm64;; esac; f=sentry-collector-linux-$a; \\\n  wget -qO /tmp/c ${u}/collector/download/$f && wget -qO /tmp/s ${u}/collector/download/SHA256SUMS && \\\n  grep -q "$(sha256sum /tmp/c | cut -d" " -f1)  $f" /tmp/s && chmod +x /tmp/c && exec /tmp/c run'`,
    ansible: `./run.sh collector.yml --limit <that machine> -e collector_key=${key} -e collector_url=${u}`,
  });
  const NOTE = {linux: "On the Linux machine (any distribution with systemd, amd64 or arm64): it downloads the collector from Sentry Lens, checks it and runs it as a service.",
    windows: "In PowerShell as administrator (Windows 10/11, Server 2016+): it downloads the collector, checks it and runs it as a service - no Npcap needed.",
    docker: "On a Docker host: the collector in a small container on the host's network (it fetches the binary from Sentry Lens and checks it at each start).",
    ansible: "From the ansible-runner, for a Linux machine in its inventory (it runs the Linux installer there)."};
  const draw = () => {
    el.innerHTML = `<div class="keybox" style="margin-top:.7rem"><b>${esc(title)}</b> Its key is shown this once:
      <pre class="cmd">${esc(key)}</pre>
      <div class="filterbar" style="margin:.8rem 0 .3rem">
        <div class="seg" id="ibos">${[["linux", "Linux"], ["windows", "Windows"], ["docker", "Docker"], ["ansible", "Ansible"]].map(([v, l]) => `<button type="button" data-os="${v}" class="${v === os ? "active" : ""}">${l}</button>`).join("")}</div>
        ${urls.length > 1 ? `<label class="small muted">Sentry Lens at <select id="iburl">${urls.map(u => `<option ${u === url ? "selected" : ""}>${esc(u)}</option>`).join("")}</select></label>` : ""}
      </div>
      <p class="small" style="margin:.2rem 0">${NOTE[os]}${url.startsWith("http:") ? " Plain HTTP: fine on the LAN; from elsewhere use the https address." : ""}</p>
      <pre class="cmd" id="ibline">${esc(lines(url)[os])}</pre>
      <button type="button" class="btn" id="ibcopy">Copy</button> <span class="small muted" id="ibmsg"></span>
      <p class="small muted" style="margin:.5rem 0 0">Collector ${esc(S.cols.version || "")} · to remove it later: the same line with <span class="mono">${os === "windows" ? "-Uninstall" : "--uninstall"}</span>${os === "docker" ? " (Docker: docker rm -f sentry-collector)" : ""}.</p></div>`;
    el.querySelectorAll("#ibos button").forEach(b => b.onclick = () => { os = b.dataset.os; localSet("os", os); draw(); });
    const sel = el.querySelector("#iburl"); if (sel) sel.onchange = () => { url = sel.value; draw(); };
    el.querySelector("#ibcopy").onclick = async () => {
      try { await navigator.clipboard.writeText(lines(url)[os]); el.querySelector("#ibmsg").textContent = "copied"; }
      catch (e) { el.querySelector("#ibmsg").textContent = "select it and copy"; }
    };
  };
  draw();
}

function setTab(t) { S.tab = t; localSet("tab", t); render(); }
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setTab(b.dataset.t));
load();
setInterval(() => { if (!document.querySelector("tr.exp") && !document.activeElement?.closest("form, input")) load(); }, 60000);
</script>
