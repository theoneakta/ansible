<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Sentry Lens</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f16; --surface: #131a24; --surface2: #1a2330; --border: #262f3d;
    --text: #e6edf3; --muted: #8b96a5; --accent: #ff5c4d; --accent2: #ffb454; --fail: #f85149; --ok: #2ea043;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem 1rem;
    font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; color: var(--text);
    background:
      radial-gradient(60rem 30rem at 50% -10%, #ff5c4d1f, transparent 70%),
      radial-gradient(40rem 24rem at 90% 110%, #ffb4541a, transparent 70%),
      var(--bg);
  }
  .card {
    width: 100%; max-width: 400px; padding: 2.2rem 2rem 1.8rem; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 20px 60px #0009;
  }
  .logo { width: 76px; height: 76px; filter: drop-shadow(0 6px 22px #ff5c4d55); }
  h1 { margin: .8rem 0 .15rem; font-size: 1.6rem; letter-spacing: .01em; }
  h1 span { color: var(--accent2); }
  .tag { color: var(--muted); margin: 0 0 1.5rem; font-size: .92rem; }
  .msg { font-size: .88rem; margin: 0 0 1.1rem; padding: .6rem .75rem; border-radius: 10px; text-align: left; line-height: 1.4; }
  .msg.err { color: #ffd7d4; background: #f851491f; border: 1px solid #f8514955; }
  .msg.info { color: var(--text); background: #ffb4541a; border: 1px solid #ffb45455; }
  .providers { display: flex; flex-direction: column; gap: .55rem; }
  .pbtn {
    display: flex; align-items: center; justify-content: center; gap: .6rem; width: 100%; padding: .7rem 1rem;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    font: inherit; font-weight: 500; text-decoration: none; cursor: pointer;
  }
  .pbtn:hover { border-color: var(--accent2); }
  .pbtn svg { width: 18px; height: 18px; flex: none; }
  .or { display: flex; align-items: center; gap: .7rem; color: var(--muted); font-size: .78rem; margin: 1.2rem 0; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  form { display: flex; flex-direction: column; gap: .6rem; text-align: left; }
  label { font-size: .75rem; color: var(--muted); display: flex; flex-direction: column; gap: .25rem; }
  input {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 9px;
    padding: .6rem .7rem; font: inherit;
  }
  input:focus { outline: 2px solid var(--accent2); outline-offset: -1px; }
  .btn {
    margin-top: .3rem; padding: .75rem 1rem; border-radius: 10px; border: 0; cursor: pointer; text-decoration: none;
    font: inherit; font-weight: 600; color: #1a0d0d; background: linear-gradient(135deg, var(--accent2), var(--accent)); text-align: center;
  }
  .btn:hover { filter: brightness(1.08); }
  .switch { margin: 1rem 0 0; font-size: .85rem; color: var(--muted); }
  .switch a { color: var(--accent2); text-decoration: none; cursor: pointer; }
  .note { color: var(--muted); font-size: .76rem; margin: 1.2rem 0 0; line-height: 1.45; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/static/logo.svg" alt="">
  <h1>Sentry <span>Lens</span></h1>
  <p class="tag">See what your network is doing.</p>
  <div id="msg"></div>

  <!-- First run: the first admin, with the setup token from the host. -->
  <section id="setup" hidden>
    <p class="msg info">First run: create the administrator account. The setup token is on the server, in
      <code>/opt/netview/session.env</code> (root only).</p>
    <form method="post" action="/auth/setup">
      <label>Setup token<input name="token" required autocomplete="off"></label>
      <label>Your name<input name="name" autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password (10+ characters)<input name="password" type="password" minlength="10" required autocomplete="new-password"></label>
      <button class="btn">Create the admin and sign in</button>
    </form>
  </section>

  <section id="signin" hidden>
    <div class="providers" id="providers"></div>
    <div class="or" id="or" hidden>or</div>
    <form method="post" action="/auth/local" id="local">
      <label><span id="loginLabel">Email</span><input name="email" id="loginInput" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn">Sign in</button>
    </form>
    <p class="switch" id="toRegister">No account? <a>Create one</a> - an admin approves it.</p>
  </section>

  <section id="register" hidden>
    <form method="post" action="/auth/register">
      <label>Your name<input name="name" autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password (10+ characters)<input name="password" type="password" minlength="10" required autocomplete="new-password"></label>
      <button class="btn">Request access</button>
    </form>
    <p class="switch" id="toSignin">Already have an account? <a>Sign in</a></p>
  </section>

  <section id="proxy" hidden>
    <a class="btn" id="proxyBtn" href="/">Sign in</a>
  </section>

  <p class="note" id="note"></p>
</main>

<script>
// Provider marks (simple, recognisable; brand colours on the dark button).
const ICONS = {
  google: '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3a7.2 7.2 0 0 1-10.7-3.8h-4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1A7.2 7.2 0 0 1 12 4.8z"/></svg>',
  microsoft: '<svg viewBox="0 0 24 24"><path fill="#F25022" d="M1 1h10.5v10.5H1z"/><path fill="#7FBA00" d="M12.5 1H23v10.5H12.5z"/><path fill="#00A4EF" d="M1 12.5h10.5V23H1z"/><path fill="#FFB900" d="M12.5 12.5H23V23H12.5z"/></svg>',
  apple: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M16.4 12.7c0-2.6 2.1-3.8 2.2-3.9a4.8 4.8 0 0 0-3.8-2c-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9a5 5 0 0 0-4.2 2.6c-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.5 1.3 0 1.8-.8 3.4-.8s2 .8 3.4.8c1.4 0 2.3-1.3 3.1-2.5a11 11 0 0 0 1.4-2.9 4.5 4.5 0 0 1-2.7-4zM13.8 5a4.4 4.4 0 0 0 1-3.2 4.6 4.6 0 0 0-3 1.5 4.3 4.3 0 0 0-1.1 3.1A3.8 3.8 0 0 0 13.8 5z"/></svg>',
  github: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg>',
  oidc: '<svg viewBox="0 0 24 24" fill="none" stroke="#ffb454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const show = (...ids) => ["setup", "signin", "register", "proxy"].forEach(id => $(id).hidden = !ids.includes(id));
const q = new URLSearchParams(location.search);
function message(text, kind = "err") { $("msg").innerHTML = text ? `<p class="msg ${kind}">${esc(text)}</p>` : ""; }

fetch("/auth/state").then(r => r.json()).then(s => {
  if (s.signed_in) { location.replace("/"); return; }
  if (!s.enabled) { location.replace("/"); return; }
  if (q.get("error")) message(q.get("error"));
  else if (q.get("pending")) message(`Thanks${s.pending ? ", " + s.pending : ""} - your account is waiting for an administrator's approval. Try again once you've been approved.`, "info");
  else if (q.get("denied")) message("This account isn't allowed to use Sentry Lens. Ask an administrator for access.");

  if (s.setup) { show("setup"); return; }
  if (!s.builtin) {  // only an identity proxy (e.g. Cloudflare Access) in front
    $("proxyBtn").href = s.signin_url || "/";
    $("note").textContent = "Sign-in is handled by the identity service in front of this site.";
    show("proxy"); return;
  }
  $("providers").innerHTML = s.providers.map(p =>
    `<a class="pbtn" href="/auth/login/${encodeURIComponent(p.id)}">${ICONS[p.type] || ICONS.oidc}Continue with ${esc(p.name)}</a>`).join("");
  $("or").hidden = !s.providers.length;
  if (s.directory.length) {  // LDAP / AD: the password form takes directory usernames too
    $("loginLabel").textContent = `Email or ${s.directory.join(" / ")} username`;
    $("loginInput").type = "text";
  }
  show(q.get("register") ? "register" : "signin");
  $("note").textContent = "New accounts need an administrator's approval.";
}).catch(() => message("Sentry Lens isn't answering - try again in a moment."));

$("toRegister").querySelector("a").onclick = () => { message(""); show("register"); };
$("toSignin").querySelector("a").onclick = () => { message(""); show("signin"); };
</script>
</body>
</html>
