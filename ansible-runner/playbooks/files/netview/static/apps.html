<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentry Lens - Applications</title>
<link rel="icon" href="/static/logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<style>
  /* The main page's surfaces (index.html). Status colors are reserved for
     state and always come with their name: up / down / pending /
     maintenance / paused. The one chart (response time) is a single series. */
  :root {
    color-scheme: dark;
    --bg: #0b0f16; --surface: #131a24; --surface2: #1a2330; --border: #262f3d;
    --text: #e6edf3; --muted: #8b96a5; --accent2: #ffb454; --link: #79b8ff;
    --s1: #3987e5;
    --up: #2ea043; --down: #f85149; --pending: #d29922; --maint: #3987e5; --paused: #5c6675;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; font-size: 14px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: .7rem 1.4rem;
    background: linear-gradient(120deg, #1a0d0d, #1c1108 70%); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 1.15rem; letter-spacing: .02em; }
  header h1 a { color: inherit; display: flex; align-items: center; gap: .55rem; }
  header h1 a:hover { text-decoration: none; }
  header h1 img { width: 30px; height: 30px; filter: drop-shadow(0 2px 8px #ff5c4d55); }
  header h1 span { color: var(--accent2); }
  .sections { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .sections a { color: var(--muted); padding: .35rem .9rem; font-size: .88rem; }
  .sections a.active { color: var(--text); background: var(--surface2); box-shadow: inset 0 -2px 0 var(--accent2); }
  .sections a:hover { text-decoration: none; color: var(--text); }
  .spacer { flex: 1; }
  .who { display: flex; align-items: center; gap: .6rem; font-size: .8rem; color: var(--muted); }
  .who a { color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: .2rem .65rem; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
  .seg button { background: var(--surface); color: var(--muted); border: 0; padding: .3rem .7rem; cursor: pointer; font: inherit; font-size: .85rem; }
  .seg button.active { background: var(--surface2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent2); }

  main { padding: 1.4rem; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
  h2 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; font-weight: 600; }
  .muted { color: var(--muted); } .small { font-size: .8rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; min-width: 0; }
  .head { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .9rem; }
  .hero { display: flex; align-items: flex-end; gap: 2rem; flex-wrap: wrap; }
  .hero .title { flex: 1 1 260px; }
  .hero .sub { color: var(--muted); font-size: .85rem; margin-top: .25rem; }
  .kpis { display: flex; gap: 2rem; flex-wrap: wrap; }
  .kpi .v { font-size: 1.45rem; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: .45rem; }
  .kpi .l { font-size: .75rem; color: var(--muted); }
  .layout { display: grid; grid-template-columns: minmax(340px, 5fr) minmax(0, 7fr); gap: 1.25rem; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }

  /* status: a dot + its name, never color alone */
  .st { display: inline-flex; align-items: center; gap: .35rem; font-size: .75rem; font-weight: 600; border-radius: 999px; padding: .08rem .55rem; border: 1px solid; white-space: nowrap; }
  .st i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.up { color: #56d364; border-color: var(--up); background: #2ea04322; }
  .st.down { color: #ff7b72; border-color: var(--down); background: #f8514922; }
  .st.pending { color: #e3b341; border-color: var(--pending); background: #d2992222; }
  .st.maintenance { color: #79b8ff; border-color: var(--maint); background: #3987e522; }
  .st.paused { color: var(--muted); border-color: var(--paused); background: transparent; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
  .dot.up { background: var(--up); } .dot.down { background: var(--down); box-shadow: 0 0 0 3px #f8514933; }
  .dot.pending { background: var(--pending); } .dot.maintenance { background: var(--maint); } .dot.paused { background: var(--paused); }

  /* heartbeat bars: one cell per check, 2px apart */
  .beats { display: flex; gap: 2px; align-items: stretch; height: 18px; }
  .beats i { width: 5px; border-radius: 2px; background: var(--border); flex: none; }
  .beats i.b0 { background: var(--down); } .beats i.b1 { background: var(--up); }
  .beats i.b2 { background: var(--pending); } .beats i.b3 { background: var(--maint); }
  .beats.big { height: 28px; } .beats.big i { width: auto; flex: 1; max-width: 10px; }

  .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: .8rem; }
  input[type=text], input[type=number], input[type=url], select, textarea {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: .38rem .6rem; font: inherit; font-size: .85rem;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent2); outline-offset: -1px; }
  #q { flex: 1; min-width: 10rem; }
  .btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: .35rem .8rem; font: inherit; font-size: .85rem; cursor: pointer; white-space: nowrap; }
  .btn.primary { border-color: var(--accent2); color: var(--accent2); }
  .btn.danger { border-color: var(--down); color: #ff7b72; }
  .btn:disabled { opacity: .4; cursor: default; }
  .linkbtn { background: none; border: 0; color: var(--link); cursor: pointer; font: inherit; font-size: .8rem; padding: 0; }

  .mlist { display: flex; flex-direction: column; max-height: calc(100vh - 290px); min-height: 300px; overflow-y: auto; margin: 0 -.4rem; }
  .mrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .2rem .7rem; align-items: center; padding: .5rem .5rem; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .mrow:hover { background: var(--surface2); }
  .mrow.sel { background: var(--surface2); border-color: var(--accent2); }
  .mrow .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .tg { color: var(--muted); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; grid-column: 2; }
  .mrow .upt { font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted); text-align: right; }
  .mrow .bt { grid-column: 2 / 4; }
  .grp { display: flex; align-items: center; gap: .5rem; padding: .7rem .5rem .3rem; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; cursor: pointer; }
  .grp .cnt { text-transform: none; letter-spacing: 0; font-weight: 400; }

  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .42rem .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: .75rem; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; } td.nw { white-space: nowrap; }
  tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--surface2); }
  .empty { color: var(--muted); padding: 1.5rem 0; text-align: center; }
  .err { color: #ff7b72; font-size: .85rem; } .ok { color: #56d364; font-size: .85rem; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem 1.4rem; margin: 1rem 0; }
  .facts .v { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .facts .l { font-size: .72rem; color: var(--muted); }
  .dtitle { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  .dtitle h2 { margin-right: .3rem; }
  .target { color: var(--muted); font-size: .85rem; word-break: break-all; margin-top: .3rem; }
  .tip { position: absolute; pointer-events: none; z-index: 5; background: #0b0f16f2; border: 1px solid var(--border); border-radius: 8px;
         padding: .45rem .6rem; font-size: .78rem; white-space: nowrap; display: none; font-variant-numeric: tabular-nums; box-shadow: 0 4px 16px #0008; }
  .tip .t { color: var(--muted); margin-bottom: .25rem; }
  .uplot { font-family: inherit; }

  /* the add / edit dialog */
  dialog { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 0; width: min(640px, calc(100vw - 32px)); }
  dialog::backdrop { background: #000a; }
  dialog form { padding: 1.2rem 1.3rem; display: flex; flex-direction: column; gap: .9rem; max-height: 85vh; overflow-y: auto; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem .9rem; }
  .fgrid label { display: flex; flex-direction: column; gap: .25rem; font-size: .78rem; color: var(--muted); }
  .fgrid label.full { grid-column: 1 / -1; }
  .fgrid label.chk { flex-direction: row; align-items: center; gap: .5rem; color: var(--text); font-size: .85rem; }
  .fgrid input, .fgrid select, .fgrid textarea { width: 100%; }
  .fgrid label.chk input { width: auto; }
  .notifs { display: flex; flex-wrap: wrap; gap: .3rem 1rem; }
  .actions { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
  [hidden] { display: none !important; }
  @media (max-width: 700px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .fgrid { grid-template-columns: 1fr; }
    .kpis { gap: 1.2rem; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="/" title="Sentry Lens"><img src="/static/logo.svg" alt="">Sentry <span>Lens</span></a></h1>
  <nav class="sections" aria-label="Sections">
    <a href="/apps" class="active">Applications</a><a href="/#/">Network</a><a href="/infra">Infrastructure</a>
  </nav>
  <div class="spacer"></div>
  <span class="small muted" id="conn"></span>
  <div class="who" id="who"></div>
</header>
<main>
  <div class="hero">
    <div class="title">
      <h2>Applications</h2>
      <div class="sub" id="sub">Connecting to Uptime Kuma...</div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="layout">
    <div class="card">
      <div class="toolbar">
        <input type="text" id="q" placeholder="Search name or address" aria-label="Search monitors">
        <button class="btn primary" id="addBtn" hidden>+ Add monitor</button>
      </div>
      <div class="toolbar">
        <div class="seg" id="stf">
          <button data-s="">All</button><button data-s="down">Down</button><button data-s="up">Up</button><button data-s="pending">Pending</button><button data-s="paused">Paused</button>
        </div>
      </div>
      <div class="mlist" id="mlist"></div>
    </div>
    <div class="stack" id="right"></div>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="mform">
    <h2 id="dlgTitle">Add monitor</h2>
    <div class="fgrid">
      <label>Type<select name="type" id="ftype"></select></label>
      <label>Name<input type="text" name="name" required maxlength="150"></label>
      <label class="full" data-for="http keyword json-query">URL<input type="url" name="url" placeholder="https://"></label>
      <label data-for="port ping dns">Host name or address<input type="text" name="hostname"></label>
      <label data-for="port dns">Port<input type="number" name="port" min="1" max="65535"></label>
      <label data-for="keyword">Keyword<input type="text" name="keyword"></label>
      <label class="chk" data-for="keyword"><input type="checkbox" name="invertKeyword">Up when the keyword is <b>absent</b></label>
      <label data-for="http keyword json-query">Method<select name="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select></label>
      <label data-for="http keyword json-query">Accepted status codes<input type="text" name="accepted_statuscodes" placeholder="200-299"></label>
      <label data-for="dns">Record type<select name="dns_resolve_type"><option>A</option><option>AAAA</option><option>CNAME</option><option>MX</option><option>NS</option><option>TXT</option><option>SRV</option><option>CAA</option><option>PTR</option><option>SOA</option></select></label>
      <label data-for="dns">Resolver<input type="text" name="dns_resolve_server" placeholder="1.1.1.1"></label>
      <label>Check every (seconds)<input type="number" name="interval" min="20" value="60"></label>
      <label>Retries before down<input type="number" name="maxretries" min="0" value="0"></label>
      <label>Retry every (seconds)<input type="number" name="retryInterval" min="20" value="60"></label>
      <label data-for="http keyword json-query port ping dns">Timeout (seconds)<input type="number" name="timeout" min="1" step="0.1" value="48"></label>
      <label>Group<select name="parent"></select></label>
      <label>Resend the notification every (checks, 0 = never)<input type="number" name="resendInterval" min="0" value="0"></label>
      <label class="chk" data-for="http keyword json-query"><input type="checkbox" name="ignoreTls">Ignore TLS / certificate errors</label>
      <label class="chk" data-for="http keyword json-query"><input type="checkbox" name="expiryNotification">Notify before the certificate expires</label>
      <label class="chk"><input type="checkbox" name="upsideDown">Upside down (up when it fails)</label>
      <label class="full">Notifications<div class="notifs" id="fnotifs"></div></label>
      <label class="full">Description<textarea name="description" rows="2"></textarea></label>
    </div>
    <div class="err" id="ferr"></div>
    <div class="actions"><button type="button" class="btn" id="fcancel">Cancel</button><button type="submit" class="btn primary" id="fsave">Save</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const LABEL = {up: "up", down: "down", pending: "pending", maintenance: "maintenance", paused: "paused"};
const BEAT = {0: "down", 1: "up", 2: "pending", 3: "maintenance"};
const st = s => `<span class="st ${s}"><i></i>${LABEL[s] || s}</span>`;
// Kuma's times are UTC ("2026-10-25 22:23:56.558").
const utc = s => s ? Date.parse(s.replace(" ", "T") + "Z") / 1000 : 0;
const ago = t => { if (!t) return "never"; const s = Date.now() / 1000 - t; return s < 90 ? "just now" : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
const when = t => new Date(t * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
const pct = v => v == null ? "-" : (v * 100).toFixed(v >= 0.9995 || v === 0 ? 0 : 2) + "%";
const ms = v => v == null ? "-" : `${Math.round(v)} ms`;
const localGet = k => { try { return localStorage.getItem("apps." + k); } catch (e) { return null; } };
const localSet = (k, v) => { try { localStorage.setItem("apps." + k, v); } catch (e) {} };

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `${r.status} ${r.statusText}`);
  return body;
}
const post = (path, body) => api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});

const S = {data: null, sel: +(new URLSearchParams(location.search).get("m") || 0) || null, q: "", stf: localGet("stf") || "",
           hours: +(localGet("hours") || 24), me: {}, collapsed: new Set(JSON.parse(localGet("collapsed") || "[]")), chart: null};
const isAdmin = () => S.me.auth === false || S.me.role === "admin";

fetch("/api/me").then(r => r.ok ? r.json() : null).then(me => {
  if (!me) return;
  S.me = me;
  if (me.auth && me.email) document.getElementById("who").innerHTML = `<span>${esc(me.name || me.email)}</span>${me.logout ? `<a href="${esc(me.logout)}">Sign out</a>` : ""}`;
  document.getElementById("addBtn").hidden = !isAdmin();
  if (S.data) renderRight();
}).catch(() => {});

// ---------------------------------------------------------------- data
async function load() {
  try {
    S.data = await api("/api/apps");
    renderTop(); renderList();
    if (!document.querySelector("dialog[open]")) renderRight(true);
  } catch (e) {
    document.getElementById("sub").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

function renderTop() {
  const d = S.data, k = d.status;
  document.getElementById("conn").innerHTML = k.logged_in ? `<span class="dot up"></span> Uptime Kuma ${esc(k.version)}`
    : `<span class="dot down"></span> <span class="err">${k.connected ? "not signed in" : "not connected"}${k.last_error ? ": " + esc(k.last_error) : ""}</span>`;
  document.getElementById("sub").innerHTML = `${d.total} monitors in Uptime Kuma, live${d.counts.down ? ` · <span class="err">${d.counts.down} down</span>` : " · all reachable"}`;
  const c = d.counts;
  document.getElementById("kpis").innerHTML = [
    [c.up, "up", "up"], [c.down, "down", "down"], [c.pending + c.maintenance, "pending / maintenance", "pending"], [c.paused, "paused", "paused"],
    [pct(d.uptime_24h), "average uptime, 24 h"], [ms(d.avg_ping), "average response"]]
    .map(([v, l, s]) => `<div class="kpi"><div class="v">${s ? `<span class="dot ${s}"></span>` : ""}${v}</div><div class="l">${l}</div></div>`).join("");
}

// The monitors, under their groups (Kuma's "path"), filtered.
function renderList() {
  const d = S.data, q = S.q.toLowerCase();
  const match = m => (!S.stf || m.state === S.stf) && (!q || (m.name + " " + (m.target || "")).toLowerCase().includes(q));
  const groups = d.monitors.filter(m => m.type === "group");
  const kids = id => d.monitors.filter(m => m.parent === id && m.type !== "group");
  const row = m => `<div class="mrow ${m.id === S.sel ? "sel" : ""}" data-id="${m.id}">
      <span class="dot ${m.state}" title="${LABEL[m.state]}"></span><span class="nm">${esc(m.name)}</span>
      <span class="upt" title="Uptime, 24 h">${pct(m.uptime_24h)}</span>
      <span></span><span class="tg">${esc(m.target || m.type)}</span><span></span>
      <span></span><div class="bt">${beats(m.beats, 40)}</div></div>`;
  let html = "";
  const loose = d.monitors.filter(m => m.type !== "group" && !m.parent && match(m));
  for (const g of groups) {
    const list = kids(g.id).filter(match);
    if (!list.length && (q || S.stf)) continue;
    const down = kids(g.id).filter(m => m.state === "down").length, open = !S.collapsed.has(g.id);
    html += `<div class="grp" data-g="${g.id}"><span>${open ? "▾" : "▸"}</span><span>${esc(g.pathName || g.name)}</span>
      <span class="cnt">${kids(g.id).length}${down ? ` · <span class="err">${down} down</span>` : ""}</span></div>`;
    if (open) html += list.map(row).join("");
  }
  if (loose.length) html += (groups.length ? `<div class="grp"><span>Not in a group</span></div>` : "") + loose.map(row).join("");
  document.getElementById("mlist").innerHTML = html || `<div class="empty">No monitor matches.</div>`;
  document.querySelectorAll(".mrow").forEach(r => r.onclick = () => select(+r.dataset.id));
  document.querySelectorAll(".grp[data-g]").forEach(g => g.onclick = () => {
    const id = +g.dataset.g; S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id);
    localSet("collapsed", JSON.stringify([...S.collapsed])); renderList();
  });
  document.querySelectorAll("#stf button").forEach(b => b.classList.toggle("active", b.dataset.s === S.stf));
}
function beats(list, n, big) {
  const pad = Math.max(0, n - list.length);
  return `<div class="beats ${big ? "big" : ""}">${"<i></i>".repeat(pad)}${list.slice(-n).map(b =>
    `<i class="b${b.s}" title="${esc(`${BEAT[b.s] || "?"} · ${when(utc(b.t))}${b.p != null ? ` · ${b.p} ms` : ""}${b.m ? ` · ${b.m}` : ""}`)}"></i>`).join("")}</div>`;
}

function select(id) {
  S.sel = S.sel === id ? null : id;
  history.replaceState(null, "", S.sel ? `/apps?m=${S.sel}` : "/apps");
  renderList(); renderRight();
}

// ---------------------------------------------------------------- right side
// Nothing selected: what needs attention. A monitor: its page.
async function renderRight(refresh) {
  const el = document.getElementById("right");
  if (!S.sel || !S.data.monitors.some(m => m.id === S.sel)) {
    if (S.chart) { S.chart.destroy(); S.chart = null; }
    return overview(el);
  }
  if (refresh && S.chart && el.dataset.id == S.sel && el.dataset.hours == S.hours) return refreshDetail();
  try {
    const m = await api(`/api/apps/${S.sel}?hours=${S.hours}`);
    detail(el, m);
  } catch (e) { el.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

function overview(el) {
  const d = S.data;
  const down = d.monitors.filter(m => m.type !== "group" && m.state === "down");
  el.dataset.id = "";
  el.innerHTML = `
    <div class="card"><div class="head"><h3>Down now</h3></div>
      ${down.length ? `<div class="tbl"><table><tbody>${down.map(m => `<tr class="click" data-id="${m.id}"><td>${st("down")}</td><td><b>${esc(m.name)}</b><div class="small muted">${esc(m.target)}</div></td><td class="small">${esc(m.msg)}</td><td class="nw small muted">${ago(utc(m.last))}</td></tr>`).join("")}</tbody></table></div>`
        : `<div class="ok">Everything Uptime Kuma checks is up or paused.</div>`}</div>
    <div class="card"><div class="head"><h3>Recent incidents</h3><span class="small muted">status changes</span></div>
      ${d.events.length ? `<div class="tbl"><table><thead><tr><th>When</th><th>Status</th><th>Monitor</th><th>Message</th></tr></thead><tbody>
        ${d.events.map(e => `<tr class="click" data-id="${e.monitor_id}"><td class="nw" title="${when(utc(e.time))}">${ago(utc(e.time))}</td><td>${st(e.status)}</td><td class="nw">${esc(e.name)}</td><td class="small">${esc(e.msg)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">No status change recorded.</div>`}</div>
    <div class="card"><div class="head"><h3>Certificates</h3><span class="small muted">soonest to expire</span></div>
      ${d.certs.length ? `<div class="tbl"><table><thead><tr><th>Monitor</th><th>Certificate</th><th>Issuer</th><th class="n">Expires in</th></tr></thead><tbody>
        ${d.certs.map(c => `<tr class="click" data-id="${c.id}"><td>${esc(c.name)}</td><td class="small">${esc(c.subject)}</td><td class="small muted">${esc(c.issuer)}</td>
          <td class="n"><span class="${c.days < 14 ? "err" : c.days < 30 ? "" : "muted"}">${c.days} days</span>${c.valid ? "" : ` ${st("down")}`}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">No HTTPS monitor reports a certificate.</div>`}</div>`;
  el.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => select(+tr.dataset.id));
}

const PERIODS = [[1, "1h"], [6, "6h"], [24, "24h"], [168, "7d"], [720, "30d"]];
function detail(el, m) {
  el.dataset.id = m.id; el.dataset.hours = S.hours;
  const admin = isAdmin() && m.type !== "group";
  el.innerHTML = `<div class="card">
      <div class="dtitle"><h2>${esc(m.name)}</h2>${st(m.state)}<span class="spacer"></span>
        ${admin ? `<button class="btn" id="pauseBtn">${m.active ? "Pause" : "Resume"}</button><button class="btn" id="editBtn">Edit</button><button class="btn danger" id="delBtn">Delete</button>` : ""}
        <button class="btn" id="closeBtn" title="Back to the overview">&times;</button></div>
      <div class="target">${m.type === "http" || m.type === "keyword" || m.type === "json-query" ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a>` : esc(m.target)}
        · ${esc(m.type)} · every ${m.interval} s${(m.pathName || "").includes("/") ? ` · in ${esc(m.pathName.split("/").slice(0, -1).join(" / "))}` : ""}</div>
      ${m.description ? `<div class="small muted" style="margin-top:.4rem">${esc(m.description)}</div>` : ""}
      <div class="facts" id="facts"></div>
      <div id="dbeats"></div>
    </div>
    <div class="card">
      <div class="head"><h3>Response time</h3><span class="small muted" id="winInfo"></span><span class="spacer" style="flex:1"></span>
        <div class="seg" id="per">${PERIODS.map(([h, l]) => `<button data-h="${h}" class="${h === S.hours ? "active" : ""}">${l}</button>`).join("")}</div></div>
      <div id="chart" style="position:relative"></div>
      <div class="small muted" style="margin-top:.4rem" id="chartNote"></div>
    </div>
    <div class="card"><div class="head"><h3>Incidents</h3><span class="small muted">this monitor's status changes</span></div><div id="inc"></div></div>`;
  fillDetail(m);
  document.getElementById("closeBtn").onclick = () => select(m.id);
  document.querySelectorAll("#per button").forEach(b => b.onclick = () => { S.hours = +b.dataset.h; localSet("hours", S.hours); renderRight(); });
  if (admin) {
    document.getElementById("pauseBtn").onclick = () => act(m, m.active ? "pause" : "resume");
    document.getElementById("editBtn").onclick = () => openForm(m);
    document.getElementById("delBtn").onclick = () => {
      if (confirm(`Delete "${m.name}" in Uptime Kuma, with its history? This can't be undone.`)) act(m, "delete");
    };
  }
}
async function refreshDetail() {
  try { fillDetail(await api(`/api/apps/${S.sel}?hours=${S.hours}`)); } catch (e) {}
}
function fillDetail(m) {
  const c = m.cert;
  document.getElementById("facts").innerHTML = [
    [ms(m.ping), "response now"], [ms(m.avg_ping), "average response, 24 h"], [pct(m.uptime_24h), "uptime, 24 h"],
    [pct(m.uptime_30d), "uptime, 30 days"], [c && c.days != null ? `${c.days} days` : "-", c ? `certificate (${esc(c.issuer || "?")})` : "certificate"],
    [ago(utc(m.last)), "last check"]]
    .map(([v, l]) => `<div><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  document.getElementById("dbeats").innerHTML = `${beats(m.beats, 50, true)}<div class="small muted" style="margin-top:.35rem">${m.msg ? esc(m.msg) : ""}</div>`;
  document.getElementById("winInfo").textContent = m.checks ? `${m.checks.toLocaleString()} checks, ${pct(m.uptime_window)} up` : "";
  document.getElementById("inc").innerHTML = m.incidents.length ? `<div class="tbl"><table><thead><tr><th>When</th><th>Status</th><th>Message</th></tr></thead><tbody>
      ${m.incidents.map(e => `<tr><td class="nw" title="${when(utc(e.time))}">${when(utc(e.time))}</td><td>${st(e.status)}</td><td class="small">${esc(e.msg)}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">No status change recorded.</div>`;
  drawChart(m);
}

// Response time (ms) over the window - one series, the line; a check that
// failed has no time, so it's a gap, and the down checks are counted below.
function drawChart(m) {
  const el = document.getElementById("chart");
  if (S.chart) { S.chart.destroy(); S.chart = null; }
  const pts = m.series.filter(p => p.t);
  if (!pts.length) { el.innerHTML = `<div class="empty">No check in this window.</div>`; return; }
  el.innerHTML = "";
  const t = pts.map(p => utc(p.t)), v = pts.map(p => p.s === 1 && p.p != null ? p.p : null);
  const c1 = css("--s1"), tip = document.createElement("div");
  tip.className = "tip";
  const a = {stroke: css("--muted"), grid: {stroke: css("--border"), width: 1}, ticks: {show: false}, font: "11px system-ui"};
  S.chart = new uPlot({
    width: el.clientWidth, height: 230, legend: {show: false},
    cursor: {drag: {x: false, y: false}, points: {size: 8, stroke: css("--surface"), width: 2}},
    scales: {x: {time: true}, y: {range: (u, min, max) => [0, Math.max((max || 0) * 1.15, 10)]}},
    series: [{}, {stroke: c1, fill: c1 + "30", width: 2, points: {show: false}, spanGaps: false}],
    axes: [a, {...a, size: 60, values: (u, vals) => vals.map(x => `${x} ms`)}],
    hooks: {
      init: [u => u.over.appendChild(tip)],
      setCursor: [u => {
        const i = u.cursor.idx;
        if (i == null || u.cursor.left < 0) { tip.style.display = "none"; return; }
        const p = pts[i];
        tip.innerHTML = `<div class="t">${when(t[i])}</div>${st(BEAT[p.s] || "pending")} ${p.s === 1 && p.p != null ? `${p.p} ms` : ""}`;
        tip.style.display = "block";
        const w = tip.offsetWidth, x = u.cursor.left;
        tip.style.left = (x + 14 + w > u.over.clientWidth ? x - w - 14 : x + 14) + "px";
        tip.style.top = Math.max(0, u.cursor.top - 20) + "px";
      }],
    },
  }, [t, v], el);
  document.getElementById("chartNote").innerHTML = m.down_checks
    ? `<span class="err">${m.down_checks} failed check${m.down_checks > 1 ? "s" : ""} in this window</span> - gaps in the line.` : "No failed check in this window.";
}
window.addEventListener("resize", () => S.chart && S.chart.setSize({width: document.getElementById("chart").clientWidth, height: 230}));

async function act(m, action) {
  try { await post(`/api/apps/${m.id}/${action}`); if (action === "delete") S.sel = null; await load(); renderRight(); }
  catch (e) { alert(e.message); }
}

// ---------------------------------------------------------------- add / edit
const dlg = document.getElementById("dlg"), form = document.getElementById("mform");
let editing = null;
function openForm(m) {
  editing = m || null;
  const d = S.data;
  document.getElementById("dlgTitle").textContent = m ? `Edit ${m.name}` : "Add monitor";
  document.getElementById("ftype").innerHTML = d.types.map(t => `<option value="${t}">${t}</option>`).join("");
  form.parent.innerHTML = `<option value="">(none)</option>` + d.monitors.filter(g => g.type === "group" && (!m || g.id !== m.id))
    .map(g => `<option value="${g.id}">${esc(g.pathName || g.name)}</option>`).join("");
  document.getElementById("fnotifs").innerHTML = d.notifications.length ? d.notifications.map(n =>
    `<label class="chk"><input type="checkbox" data-n="${n.id}" ${(m ? m.notifications.includes(n.id) : n.isDefault) ? "checked" : ""}>${esc(n.name)}</label>`).join("")
    : `<span class="muted">None set up in Uptime Kuma.</span>`;
  const v = m || {type: "http", url: "https://", method: "GET", interval: 60, retryInterval: 60, maxretries: 0, timeout: 48, resendInterval: 0,
                  accepted_statuscodes: ["200-299"], dns_resolve_type: "A", dns_resolve_server: "1.1.1.1"};
  for (const el of form.elements) {
    if (!el.name) continue;
    const x = v[el.name];
    if (el.type === "checkbox") el.checked = !!x;
    else if (el.name === "accepted_statuscodes") el.value = (x || ["200-299"]).join(", ");
    else el.value = x ?? "";
  }
  form.type.disabled = !!m;  // Kuma's own page changes a monitor's type
  document.getElementById("ferr").textContent = "";
  showFields();
  dlg.showModal();
}
function showFields() {
  const t = form.type.value;
  form.querySelectorAll("[data-for]").forEach(l => l.hidden = !l.dataset.for.split(" ").includes(t));
}
form.type.onchange = showFields;
document.getElementById("fcancel").onclick = () => dlg.close();
document.getElementById("addBtn").onclick = () => openForm(null);
form.onsubmit = async e => {
  e.preventDefault();
  const t = form.type.value, body = {};
  for (const el of form.elements) {
    if (!el.name || el.closest("[hidden]") || (el.name === "type" && editing)) continue;
    if (el.type === "checkbox") body[el.name] = el.checked;
    else if (el.type === "number") body[el.name] = el.value === "" ? null : +el.value;
    else if (el.name === "accepted_statuscodes") body[el.name] = el.value.split(",").map(s => s.trim()).filter(Boolean);
    else if (el.name === "parent") body.parent = el.value ? +el.value : null;
    else body[el.name] = el.value;
  }
  body.notificationIDList = Object.fromEntries([...document.querySelectorAll("#fnotifs input[data-n]")].map(i => [i.dataset.n, i.checked]));
  const save = document.getElementById("fsave");
  save.disabled = true;
  try {
    const r = editing ? await post(`/api/apps/${editing.id}/edit`, body) : await post("/api/apps", body);
    dlg.close();
    if (!editing && r.id) S.sel = r.id;
    await load(); renderRight();
  } catch (err) { document.getElementById("ferr").textContent = err.message; }
  finally { save.disabled = false; }
};

// ---------------------------------------------------------------- wiring
document.getElementById("q").oninput = e => { S.q = e.target.value; renderList(); };
document.querySelectorAll("#stf button").forEach(b => b.onclick = () => { S.stf = b.dataset.s; localSet("stf", S.stf); renderList(); });
load();
setInterval(load, 15000);
</script>
</body>
</html>
