---
# Provisioning for Linux hosts (inventory group "linux") - Ubuntu and
# Rocky Linux. The GUI runs it together with install_software.yml through
# playbooks/install.yml, so one run can cover Windows and Linux hosts.
#
# Connection: SSH as the same vault account the Windows hosts use
# (vault_win_user / vault_win_password, the admin account the PXE images
# create too), with sudo - see inventory/group_vars/linux/vars.yml.
#
# Run:  ./run.sh install.yml --docker
#       ./run.sh install.yml --docker --docker-user alice --limit 192.168.3.150

- name: Provision Linux hosts
  hosts: linux
  # Facts only when a step needs them (Docker) - a Windows-only run with
  # "all hosts" shouldn't have to reach every Linux host for nothing.
  gather_facts: false
  become: true

  vars:
    # IPv6 is turned off on every managed machine, on every run - same as the
    # Windows hosts (install_software.yml) and the PXE images.
    disable_ipv6: true

    # Docker Engine + the Compose plugin, from Docker's own repositories
    # (Ubuntu: apt, Rocky: dnf). Off unless requested (--docker / GUI).
    docker_enabled: false
    # Users added to the docker group (docker without sudo) and to the
    # distro's sudo group (Ubuntu "sudo", Rocky "wheel"). A user that doesn't
    # exist yet is created - with no password, so set one before using sudo.
    docker_users: [theoneakta]

    # softflowd: exports NetFlow for the host's traffic to a collector - by
    # default netflow2ng on the Docker host (192.168.3.8, UDP 2055), which
    # feeds ntopng. Off unless requested (--softflowd / GUI).
    softflowd_enabled: false
    softflowd_collector: "192.168.3.8:2055"
    # Interface to watch; empty = the one holding the default route.
    softflowd_interface: ""
    # NetFlow v9 (what netflow2ng and most collectors expect); maxlife=60 exports
    # long-running flows every minute instead of only when they end, so ntopng
    # shows them live.
    softflowd_options: "-n {{ softflowd_collector }} -v 9 -t maxlife=60"
    # Rocky/RHEL: no package (not in EPEL 9/10) - built from this upstream
    # release instead (https://github.com/irino/softflowd).
    softflowd_version: "1.1.1"

  pre_tasks:
    # The login (vault_win_user/vault_win_password) comes from the host's own
    # inventory/host_vars/<host>/vault.yml when it has one - inventory loads
    # that by itself - otherwise from the group default, which only the
    # windows group loads. Load the default only for hosts without their own:
    # a play-level vars_files would override every host's own login.
    - name: Use the group default login for hosts without their own
      ansible.builtin.include_vars: "{{ playbook_dir }}/../inventory/group_vars/windows/vault.yml"
      when: vault_win_user is not defined

  tasks:
    # Ubuntu 25.10+ makes sudo-rs the default sudo, and Ansible's become never
    # sees its password prompt ("Timeout waiting for privilege escalation
    # prompt" - confirmed live on Ubuntu 26.04). Those releases still ship
    # the classic sudo as sudo.ws: use it wherever it exists.
    - name: Check for the classic sudo (sudo.ws)
      ansible.builtin.raw: command -v sudo.ws
      # A task var, not `become: false`: the inventory's ansible_become
      # variable outranks the keyword.
      vars:
        ansible_become: false
      register: sudo_ws
      changed_when: false
      failed_when: false

    - name: Use the classic sudo for privilege escalation
      ansible.builtin.set_fact:
        ansible_become_exe: sudo.ws
      when: sudo_ws.rc == 0

    # sysctl takes effect immediately and persists (/etc/sysctl.d). The PXE
    # Rocky image also boots with ipv6.disable=1.
    - name: Turn IPv6 off
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/90-disable-ipv6.conf
        reload: true
      loop:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6
      # With ipv6.disable=1 on the kernel line these keys don't exist at all -
      # IPv6 is already off.
      register: ipv6_sysctl
      failed_when:
        - ipv6_sysctl is failed
        - "'No such file or directory' not in (ipv6_sysctl.msg | default(''))"
        - "'cannot stat' not in (ipv6_sysctl.msg | default(''))"
      when: disable_ipv6 | bool

    - name: Docker Engine + Docker Compose
      when: docker_enabled | bool
      block:
        - name: Gather facts (distribution)
          ansible.builtin.setup:
            gather_subset: [min]

        - name: Check the distribution is supported
          ansible.builtin.assert:
            that: ansible_facts['os_family'] in ['Debian', 'RedHat']
            fail_msg: "Docker step supports Ubuntu/Debian and Rocky/RHEL only, not {{ ansible_facts['distribution'] }}."
            quiet: true

        # ------------------------------------------------- Ubuntu / Debian
        - name: Ubuntu / Debian
          when: ansible_facts['os_family'] == 'Debian'
          block:
            # Distro builds that conflict with Docker's own packages.
            - name: Remove conflicting distro packages
              ansible.builtin.apt:
                name: [docker.io, docker-doc, docker-compose, docker-compose-v2, podman-docker, containerd, runc]
                state: absent

            # python3-debian: what deb822_repository needs on the host.
            - name: Install repository prerequisites
              ansible.builtin.apt:
                name: [ca-certificates, curl, python3-debian]
                update_cache: true

            - name: Make sure the apt keyrings folder exists
              ansible.builtin.file:
                path: /etc/apt/keyrings
                state: directory
                mode: "0755"

            - name: Add Docker's signing key
              ansible.builtin.get_url:
                url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
                dest: /etc/apt/keyrings/docker.asc
                mode: "0644"

            - name: Add Docker's apt repository
              ansible.builtin.deb822_repository:
                name: docker
                types: [deb]
                uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
                suites: ["{{ ansible_facts['distribution_release'] }}"]
                components: [stable]
                architectures: ["{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"]
                signed_by: /etc/apt/keyrings/docker.asc

            - name: Install Docker Engine and the Compose plugin
              ansible.builtin.apt:
                name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
                state: present
                update_cache: true

        # ----------------------------------------------------- Rocky / RHEL
        - name: Rocky / RHEL
          when: ansible_facts['os_family'] == 'RedHat'
          block:
            - name: Remove conflicting packages
              ansible.builtin.dnf:
                name: [docker, docker-client, docker-client-latest, docker-common, docker-latest,
                       docker-latest-logrotate, docker-logrotate, docker-engine, podman-docker, runc]
                state: absent

            # Rocky is RHEL-compatible: Docker's RHEL repository.
            - name: Add Docker's dnf repository
              ansible.builtin.get_url:
                url: https://download.docker.com/linux/rhel/docker-ce.repo
                dest: /etc/yum.repos.d/docker-ce.repo
                mode: "0644"

            - name: Install Docker Engine and the Compose plugin
              ansible.builtin.dnf:
                name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
                state: present

        - name: Start Docker now and at boot
          ansible.builtin.systemd_service:
            name: docker
            state: started
            enabled: true

        - name: See which users exist already
          ansible.builtin.getent:
            database: passwd

        - name: Add the users to the docker and sudo groups (created if missing)
          ansible.builtin.user:
            name: "{{ item }}"
            groups: [docker, "{{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}"]
            append: true
            shell: "{{ omit if item in ansible_facts.getent_passwd else '/bin/bash' }}"
          loop: "{{ docker_users }}"

        - name: Check Docker and Compose work
          ansible.builtin.command: "{{ item }}"
          loop: [docker --version, docker compose version]
          register: docker_check
          changed_when: false

        - name: Report
          ansible.builtin.debug:
            msg:
              - "{{ docker_check.results | map(attribute='stdout') | join(' / ') }}"
              - >-
                In docker + {{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}:
                {{ docker_users | join(', ') }} (group changes apply at their next login).
              - >-
                {% set created = docker_users | reject('in', ansible_facts.getent_passwd) | list %}
                {{ ('Created with NO password - set one (sudo passwd <user>) before they can use sudo: ' ~ created | join(', ')) if created else 'No new users created.' }}

    # One instance, "default", configured the Debian way on every distro:
    # /etc/softflowd/default.conf (interface + options) and the
    # softflowd@default service. Ubuntu/Debian ship both with the package;
    # on Rocky/RHEL the binary is built from source and the same unit added.
    - name: softflowd (NetFlow exporter)
      when: softflowd_enabled | bool
      block:
        - name: Gather facts (distribution, default route)
          ansible.builtin.setup:
            gather_subset: [min, network]

        - name: Install softflowd (Ubuntu / Debian)
          ansible.builtin.apt:
            name: softflowd
            update_cache: true
          when: ansible_facts['os_family'] == 'Debian'

        - name: Build softflowd from source (Rocky / RHEL - not packaged)
          when: ansible_facts['os_family'] == 'RedHat'
          block:
            # softflowd -v sets the NetFlow version, it doesn't print one - so
            # the installed version is recorded next to the sources.
            - name: Check whether this version is installed already
              ansible.builtin.slurp:
                src: /usr/local/src/softflowd.installed-version
              register: softflowd_installed
              failed_when: false

            - name: Build and install
              when: (softflowd_installed.content | default('') | b64decode | trim) != softflowd_version
              block:
                # libpcap-devel is in CRB, off by default on EL9/EL10 - enabled
                # for this install only (the build failed without it, confirmed).
                - name: Install the build tools and libpcap headers
                  ansible.builtin.dnf:
                    name: [gcc, make, autoconf, automake, libpcap-devel, tar]
                    enablerepo: crb
                    state: present

                - name: Download the release
                  ansible.builtin.get_url:
                    url: "https://github.com/irino/softflowd/archive/refs/tags/softflowd-v{{ softflowd_version }}.tar.gz"
                    dest: "/usr/local/src/softflowd-{{ softflowd_version }}.tar.gz"
                    mode: "0644"

                - name: Unpack it
                  ansible.builtin.unarchive:
                    src: "/usr/local/src/softflowd-{{ softflowd_version }}.tar.gz"
                    dest: /usr/local/src
                    remote_src: true

                - name: Configure, compile and install (to /usr/local/sbin)
                  ansible.builtin.shell:
                    cmd: autoreconf -if && ./configure --prefix=/usr/local && make && make install
                    chdir: "/usr/local/src/softflowd-softflowd-v{{ softflowd_version }}"

                - name: Record the installed version
                  ansible.builtin.copy:
                    content: "{{ softflowd_version }}\n"
                    dest: /usr/local/src/softflowd.installed-version
                    mode: "0644"

            - name: Add the instance service (same as Debian's, binary in /usr/local)
              ansible.builtin.copy:
                dest: /etc/systemd/system/softflowd@.service
                mode: "0644"
                content: |
                  [Unit]
                  Description=softflowd %I instance
                  Documentation=man:softflowd(8)
                  After=network-online.target
                  Wants=network-online.target

                  [Service]
                  Type=forking
                  EnvironmentFile=/etc/softflowd/%I.conf
                  RuntimeDirectory=softflowd
                  ExecStart=/usr/local/sbin/softflowd -i $interface -p /run/softflowd/%I.pid -c /run/softflowd/%I.ctl $options
                  Restart=always
                  RestartSec=10
                  PIDFile=/run/softflowd/%I.pid

                  [Install]
                  WantedBy=multi-user.target

        # The Ubuntu package creates it; the source build doesn't.
        - name: Make sure the config folder exists
          ansible.builtin.file:
            path: /etc/softflowd
            state: directory
            mode: "0755"

        - name: Configure the default instance
          ansible.builtin.copy:
            dest: /etc/softflowd/default.conf
            mode: "0644"
            content: |
              # Managed by ansible-runner (linux_software.yml) - changes are overwritten.
              interface='{{ softflowd_interface or ansible_facts['default_ipv4']['interface'] }}'
              options='{{ softflowd_options }}'
          register: softflowd_conf

        - name: Start softflowd now and at boot
          ansible.builtin.systemd_service:
            name: softflowd@default
            state: "{{ 'restarted' if softflowd_conf is changed else 'started' }}"
            enabled: true
            daemon_reload: true

        - name: Report softflowd
          ansible.builtin.debug:
            msg: >-
              softflowd exporting NetFlow v9 for
              {{ softflowd_interface or ansible_facts['default_ipv4']['interface'] }}
              to {{ softflowd_collector }}.
