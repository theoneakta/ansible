---
# ClickHouse for Sentry Lens, on its own (it came with the Akvorado stack until
# akvorado_retire.yml): the flows (flowd_stack.yml writes default.flows) and
# Sentry Lens's tables (netview.*), on the "sentrylens" Docker network as
# "clickhouse" - flowd, Sentry Lens and Prometheus join that network.
#   flowd -> ClickHouse <- Sentry Lens :8082
#
# Its data stays in the volume Akvorado made (akvorado_akvorado-clickhouse),
# and the GeoIP files flowd reads in akvorado_akvorado-geoip - only the names
# are left from Akvorado. With ipinfo_token set (a free ipinfo.io account),
# a small container keeps those files fresh; without it they stay as they are.
#
# Run:  ./run.sh clickhouse_stack.yml                  (the monitoring host)
#
# Built to survive CIS Level 1 (cis_hardening_linux.yml): container UIDs/GIDs
# writing to the volumes get host accounts (7.1.12), /opt/clickhouse is
# labelled for containers (SELinux).

- name: ClickHouse
  hosts: "{{ akvorado_host | default('monitoring') }}"
  become: true
  gather_facts: false
  vars:
    clickhouse_dir: /opt/clickhouse
    clickhouse_image: clickhouse/clickhouse-server:26.8
    clickhouse_ram_ratio: 0.4
    clickhouse_network: sentrylens
    clickhouse_subnet: 247.16.15.0/24   # IPv4 only: IPv6 is off on these hosts
    clickhouse_volume: akvorado_akvorado-clickhouse
    geoip_volume: akvorado_akvorado-geoip
    ipinfo_token: ""

  pre_tasks:
    # Same login handling as linux_software.yml.
    - name: Use the group default login for hosts without their own
      ansible.builtin.include_vars: "{{ playbook_dir }}/../inventory/group_vars/windows/vault.yml"
      when: vault_win_user is not defined

    - name: Check for the classic sudo (sudo.ws)
      ansible.builtin.raw: command -v sudo.ws
      check_mode: false
      vars:
        ansible_become: false
      register: sudo_ws
      changed_when: false
      failed_when: false

    - name: Use the classic sudo for privilege escalation
      ansible.builtin.set_fact:
        ansible_become_exe: sudo.ws
      when: sudo_ws.rc == 0

    - name: Gather facts
      ansible.builtin.setup:
        gather_subset: [min, selinux]

  tasks:
    - name: Folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: ["{{ clickhouse_dir }}", "{{ clickhouse_dir }}/config.d"]

    - name: Label the folder for containers (SELinux)
      when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
      block:
        - name: Install semanage
          ansible.builtin.dnf:
            name: policycoreutils-python-utils
            state: present

        - name: Store the label rule
          ansible.builtin.shell: >-
            semanage fcontext -l -C | grep -qF '{{ clickhouse_dir }}(/.*)?' && echo present ||
            semanage fcontext -a -t container_file_t '{{ clickhouse_dir }}(/.*)?'
          register: sefcontext
          changed_when: sefcontext.stdout != 'present'

        - name: Apply it
          ansible.builtin.command: restorecon -R {{ clickhouse_dir }}
          when: sefcontext is changed

    # Memory capped, the system log tables off (they filled 192.168.3.8's disk
    # under ntopng, 2026-10-09), metrics for Prometheus, logs as JSON to Docker.
    - name: Settings
      ansible.builtin.copy:
        dest: "{{ clickhouse_dir }}/config.d/sentrylens.xml"
        owner: root
        group: root
        mode: "0644"
        content: |
          <!-- Managed by ansible-runner (clickhouse_stack.yml) - changes are overwritten. -->
          <clickhouse>
              <max_server_memory_usage_to_ram_ratio>{{ clickhouse_ram_ratio }}</max_server_memory_usage_to_ram_ratio>
              <mark_cache_size>268435456</mark_cache_size>
          {% for log in ['query_log', 'query_thread_log', 'query_views_log', 'part_log', 'trace_log',
                         'metric_log', 'asynchronous_metric_log', 'text_log', 'processors_profile_log',
                         'opentelemetry_span_log', 'session_log', 'asynchronous_insert_log',
                         'backup_log', 's3queue_log', 'blob_storage_log', 'latency_log', 'error_log',
                         'query_metric_log'] %}
              <{{ log }} remove="1"/>
          {% endfor %}
              <prometheus>
                  <endpoint>/metrics</endpoint>
                  <metrics>true</metrics>
                  <events>true</events>
                  <asynchronous_metrics>true</asynchronous_metrics>
              </prometheus>
              <logger>
                  <level>warning</level>
                  <errorlog remove="1"></errorlog>
                  <log remove="1"></log>
                  <console>1</console>
              </logger>
          </clickhouse>
      register: clickhouse_conf

    - name: The network (flowd, Sentry Lens and Prometheus join it)
      ansible.builtin.shell: >-
        docker network inspect {{ clickhouse_network }} >/dev/null 2>&1 && echo present ||
        docker network create --subnet {{ clickhouse_subnet }} {{ clickhouse_network }}
      register: net
      changed_when: net.stdout != 'present'

    - name: Compose file
      ansible.builtin.copy:
        dest: "{{ clickhouse_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible-runner (clickhouse_stack.yml) - changes are overwritten.
          name: clickhouse
          x-logging: &logging
            driver: json-file
            options: {max-size: 10m, max-file: "3"}
          services:
            clickhouse:
              image: {{ clickhouse_image }}
              container_name: clickhouse
              restart: unless-stopped
              stop_grace_period: 30s
              cap_add: [SYS_NICE]
              environment:
                CLICKHOUSE_INIT_TIMEOUT: 60
                CLICKHOUSE_SKIP_USER_SETUP: 1
              volumes:
                - data:/var/lib/clickhouse
                - ./config.d/sentrylens.xml:/etc/clickhouse-server/config.d/zz-sentrylens.xml:ro
              healthcheck:
                interval: 20s
                test: ["CMD", "wget", "-T", "1", "--spider", "--no-proxy", "http://127.0.0.1:8123/ping"]
              networks:
                sentrylens: {aliases: [clickhouse]}
              logging: *logging
          {% if ipinfo_token %}
            geoip:
              image: quay.io/akvorado/ipinfo-geoipupdate:latest
              restart: unless-stopped
              env_file: [./geoip.env]
              volumes: [geoip:/data]
              network_mode: bridge
              logging: *logging
          {% endif %}
          networks:
            sentrylens: {external: true, name: {{ clickhouse_network }}}
          volumes:
            # Made by the Akvorado stack - the data, kept.
            data: {external: true, name: {{ clickhouse_volume }}}
            geoip: {external: true, name: {{ geoip_volume }}}
      register: clickhouse_compose

    - name: ipinfo token (root only)
      ansible.builtin.copy:
        dest: "{{ clickhouse_dir }}/geoip.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          IPINFO_TOKEN={{ ipinfo_token }}
          IPINFO_DATABASES=country asn
          UPDATE_FREQUENCY=48h
      no_log: true
      when: ipinfo_token | length > 0

    - name: Start
      ansible.builtin.command: docker compose up -d --wait --pull missing --remove-orphans
      args:
        chdir: "{{ clickhouse_dir }}"
      register: ch_up
      changed_when: "'Started' in ch_up.stderr or 'Created' in ch_up.stderr or 'Recreated' in ch_up.stderr"

    - name: Restart for changed settings
      ansible.builtin.command: docker compose restart clickhouse
      args:
        chdir: "{{ clickhouse_dir }}"
      when: clickhouse_conf is changed and ch_up is not changed
      changed_when: true

    # ------------------------------------------------ host accounts (CIS 7.1.12)
    - name: Find volume files with no host owner
      ansible.builtin.shell: >-
        find /var/lib/docker/volumes/{{ clickhouse_volume }} /var/lib/docker/volumes/{{ geoip_volume }}
        -xdev \( -nouser -o -nogroup \) -printf '%U %G\n' 2>/dev/null | sort -u
      register: unowned_ids
      changed_when: false

    - name: Add a group for each container GID without one
      ansible.builtin.group:
        name: "ctr-clickhouse-{{ item }}"
        gid: "{{ item }}"
        system: true
      loop: "{{ unowned_ids.stdout_lines | map('split') | map('last') | unique }}"

    - name: Add a no-login account for each container UID without one
      ansible.builtin.user:
        name: "ctr-clickhouse-{{ item.split()[0] }}"
        uid: "{{ item.split()[0] }}"
        group: "{{ item.split()[1] }}"
        system: true
        create_home: false
        shell: /sbin/nologin
      loop: "{{ unowned_ids.stdout_lines }}"

    - name: Wait for it
      ansible.builtin.command: docker exec clickhouse clickhouse-client -q "SELECT version()"
      register: ch_version
      until: ch_version.rc == 0
      retries: 30
      delay: 3
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg:
          - "ClickHouse {{ ch_version.stdout }} on the {{ clickhouse_network }} network (as clickhouse)"
          - "{{ 'GeoIP files kept fresh by ipinfo' if ipinfo_token else 'GeoIP files kept as they are (set ipinfo_token to update them)' }}"
