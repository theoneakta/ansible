---
# Installs / upgrades the software list on Windows hosts using Chocolatey.
#
# Requirements (control node):
#   ansible-galaxy collection install chocolatey.chocolatey ansible.windows
#
# Inventory: hosts in group "windows" (WinRM or SSH connection).
# Run:  ansible-playbook -i inventory install_software.yml
#       ansible-playbook -i inventory install_software.yml -e wazuh_manager=10.0.0.5

- name: Install latest versions of standard software
  hosts: windows
  gather_facts: false

  vars:
    # Wazuh agent enrollment (wazuh_manager is required to install the agent at all)
    wazuh_manager: ""
    wazuh_manager_port: "1514"
    wazuh_protocol: "tcp"
    wazuh_registration_password: ""
    wazuh_group: ""
    wazuh_agent_name: ""

    # Tailscale: off unless explicitly requested for this run (--tailscale-join,
    # or just --tailscale-authkey - passing a key IS the explicit request).
    # The key itself still defaults from vault via group_vars/windows/vars.yml
    # (vault_tailscale_authkey) once joining is enabled, so you don't have to
    # retype it - but a stored vault key alone must never be enough to make a
    # run silently join every time.
    tailscale_join_enabled: false

    # Git: set global identity after install
    git_user_name: ""
    git_user_email: ""

    # WSL: off by default - only runs when explicitly enabled with distro(s) picked.
    wsl_enabled: false
    wsl_distros_selected: []   # e.g. ["Ubuntu", "kali-linux"]

    # Enabling the underlying Windows feature for the first WSL distro on a
    # machine can require a reboot to finish. Off by default since a PC
    # provisioning run shouldn't reboot someone's machine out from under them;
    # set to true (or -e wsl_allow_reboot=true / --wsl-allow-reboot) to let it
    # reboot and finish automatically.
    wsl_allow_reboot: false

    # WSL distros are registered per-Windows-user, not machine-wide - only
    # whichever account actually ran `wsl --install` (this playbook's WinRM
    # user, by default) can see/use them. List other Windows usernames here
    # to also provision the selected distro(s) for them specifically, via a
    # per-user logon Scheduled Task (see the tasks below) - no password
    # needed, it just runs using that user's own session at their next
    # logon. e.g. ["jsmith", "jdoe"]
    wsl_target_users: []

    # Win11Debloat (https://github.com/Raphire/Win11Debloat): off by default.
    # When enabled, downloads and runs the latest script straight from
    # debloat.raphi.re with its own recommended defaults, unattended -
    # removes the maintainers' default bloatware list and applies their
    # default privacy/UI tweaks. No custom app list/options here deliberately;
    # this is meant to be their standard "basic default" profile as-is.
    win11debloat_enabled: false

    # RSAT (Remote Server Administration Tools): off by default. RSAT ships
    # as Windows Capabilities (Features on Demand), not Chocolatey packages,
    # so it's installed separately via Add-WindowsCapability rather than
    # through choco_packages above. When enabled, installs ALL available
    # Rsat.* capabilities (AD DS, DNS, DHCP, Group Policy, Hyper-V, etc) -
    # there's no per-tool picker here, matching "with all options".
    rsat_enabled: false

    # IPv6 is turned off on every managed PC, on every run (same as the PXE
    # images, see playbooks/packer/windows/scripts/prepare-sysprep.ps1).
    # -e disable_ipv6=false skips the step; it never turns IPv6 back on.
    disable_ipv6: true

    # Bitdefender (consumer, Bitdefender Central account): off by default.
    # There's no package for it - the installer is tied to your account, so
    # download it from https://central.bitdefender.com (My Devices > Install
    # protection > Protect this device > Download) and put the .exe in
    # playbooks/files/bitdefender/ (git-ignored). Skipped on PCs that already
    # have a Bitdefender product.
    bitdefender_enabled: false
    bitdefender_install_args: /silent

    # Distros installable via `wsl --install -d <name>` (see `wsl --list --online`
    # on a Windows host for the current catalog).
    wsl_distros_available:
      - { name: Ubuntu,                label: "Ubuntu (latest)" }
      - { name: Ubuntu-24.04,          label: "Ubuntu 24.04 LTS" }
      - { name: Ubuntu-22.04,          label: "Ubuntu 22.04 LTS" }
      - { name: Debian,                label: Debian }
      - { name: kali-linux,            label: Kali Linux }
      - { name: openSUSE-Tumbleweed,   label: "openSUSE Tumbleweed" }
      - { name: openSUSE-Leap-15.6,    label: "openSUSE Leap 15.6" }
      - { name: FedoraLinux-42,        label: "Fedora Linux 42" }
      - { name: AlmaLinux-9,           label: "AlmaLinux 9" }
      - { name: OracleLinux_9_5,       label: "Oracle Linux 9.5" }

    # Set to false to skip the Chocolatey step entirely (e.g. a run that
    # should only do WSL/Wazuh/Tailscale/Git and touch no packages at all).
    install_packages: true

    # Which packages to install this run, by name (see choco_packages below).
    # Empty/unset = install everything in the list.
    choco_packages_selected: []

    # state: latest -> installs if missing, upgrades if outdated
    # category groups the GUI's package list (Multimedia / Internet / Dev / Tools).
    # ignore_checksums: true - only for packages whose installer comes from an
    # unversioned "always latest" vendor URL: every time the vendor ships a
    # new build, the package's pinned checksum stops matching until its
    # maintainer catches up, and the install fails outright ("Checksum ...
    # did not meet ..."). Confirmed live on 192.168.3.15/.17 for googlechrome
    # (googlechromestandaloneenterprise64.msi) and potplayer
    # (.../Version/Latest/PotPlayerSetup64.exe). The download is still HTTPS
    # from the vendor's own CDN, but nothing verifies the file itself - so
    # keep this to packages that actually need it.
    choco_packages:
      # --- Confident package IDs ---
      - { name: 7zip,             label: 7zip,                            category: tools }
      - { name: adobereader,      label: Acrobat (Reader),                category: tools }
      - { name: advanced-renamer, label: Advanced Renamer,                category: tools }
      - { name: azure-cli,        label: Azure CLI,                       category: dev }
      - { name: etcher,           label: balenaEtcher,                    category: tools }
      - { name: bulkrenameutility, label: Bulk Rename Utility,            category: tools }
      - { name: filebot,          label: FileBot,                         category: multimedia }
      - { name: git,              label: Git,                             category: dev }
      - { name: googlechrome,     label: Chrome,                          category: internet, ignore_checksums: true }
      - { name: googledrive,      label: Google Drive,                    category: internet }
      - { name: handbrake,        label: HandBrake,                       category: multimedia }
      - { name: temurinjre,       label: Java Runtime (Eclipse Temurin JRE), category: tools }
      - { name: jdownloader,      label: JDownloader,                     category: internet }
      - { name: vscode,           label: VS Code,                         category: dev }
      - { name: firefox,          label: Firefox,                         category: internet }
      - { name: notepadplusplus,  label: Notepad++,                       category: dev }
      - { name: potplayer,        label: PotPlayer,                       category: multimedia, ignore_checksums: true }
      - { name: powershell-core,  label: PowerShell 7,                    category: dev }
      - { name: powertoys,        label: PowerToys,                       category: tools }
      - { name: rambox,           label: Rambox,                          category: internet }
      - { name: rpi-imager,       label: Raspberry Pi Imager,             category: tools }
      - { name: rdm,              label: Remote Desktop Manager,          category: tools }
      - { name: screenpresso,     label: Screenpresso,                    category: tools }
      - { name: steam-client,     label: Steam,                           category: multimedia }
      - { name: tailscale,        label: Tailscale,                       category: internet }
      - { name: windirstat,       label: WinDirStat,                      category: tools }
      - { name: winscp,           label: WinSCP,                          category: tools }
      # --- Verify these IDs with: choco search <name> ---
      - { name: pdfgear,          label: PDFgear,                         category: tools }
      - { name: battle.net,       label: Battle.net,                      category: multimedia }

  tasks:
    # DisabledComponents=0xFF is Microsoft's documented "IPv6 off" (all
    # interfaces except loopback) and takes effect at the next reboot - this
    # run doesn't reboot anyone's PC. Unbinding IPv6 from the network
    # adapters takes effect straight away. The Tailscale adapter is left
    # alone: its IPv4 tailnet address is unaffected either way, and the
    # tunnel isn't ours to reconfigure underneath tailscaled.
    - name: Turn IPv6 off (adapters now, everything after the next reboot)
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
          if ((Get-ItemProperty $key -Name DisabledComponents -ErrorAction SilentlyContinue).DisabledComponents -ne 0xFF) {
            New-ItemProperty $key -Name DisabledComponents -Value 0xFF -PropertyType DWord -Force | Out-Null
            $Ansible.Changed = $true
            'DisabledComponents set to 0xFF - reboot to finish turning IPv6 off'
          }
          $tailscale = Get-NetAdapter -IncludeHidden -ErrorAction SilentlyContinue |
            Where-Object { $_.InterfaceDescription -like 'Tailscale*' -or $_.Name -like 'Tailscale*' } |
            Select-Object -ExpandProperty Name
          Get-NetAdapterBinding -ComponentID ms_tcpip6 -ErrorAction SilentlyContinue |
            Where-Object { $_.Enabled -and $_.Name -notin $tailscale } | ForEach-Object {
              Disable-NetAdapterBinding -Name $_.Name -ComponentID ms_tcpip6 -Confirm:$false
              $Ansible.Changed = $true
              "IPv6 unbound from $($_.Name)"
            }
      when: disable_ipv6 | bool

    # win_chocolatey's bootstrap writes chocolateyInstall.ps1 to a temp FILE
    # and runs it with `&`, so it's subject to the execution policy. A fresh
    # Windows 11 client has every scope Undefined, which means effectively
    # Restricted - and the bootstrap fails with PSSecurityException
    # ("running scripts is disabled on this system"), reported only as the
    # generic "Chocolatey bootstrap installation failed." Confirmed live on
    # 192.168.3.181. Hosts that already have Chocolatey never hit this (no
    # bootstrap). Same fix as cis_hardening.yml's audit-script step:
    # RemoteSigned, only when LocalMachine actually blocks local scripts.
    - name: Check LocalMachine execution policy allows the Chocolatey bootstrap to run
      ansible.windows.win_shell: (Get-ExecutionPolicy -Scope LocalMachine).ToString()
      changed_when: false
      register: local_machine_execution_policy
      when: install_packages | bool

    - name: Allow local scripts to run (RemoteSigned) if LocalMachine policy currently blocks them
      ansible.windows.win_shell: Set-ExecutionPolicy -Scope LocalMachine -ExecutionPolicy RemoteSigned -Force
      when:
        - install_packages | bool
        - (local_machine_execution_policy.stdout | trim) in ['Undefined', 'Restricted', 'AllSigned']

    - name: Ensure Chocolatey is installed
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey
        state: present
      when: install_packages | bool

    - name: Install / upgrade packages to latest
      chocolatey.chocolatey.win_chocolatey:
        name: "{{ item.name }}"
        state: latest
        ignore_checksums: "{{ item.ignore_checksums | default(false) }}"
      loop: "{{ choco_packages if not choco_packages_selected else (choco_packages | selectattr('name', 'in', choco_packages_selected) | list) }}"
      loop_control:
        label: "{{ item.label }}"
      when: install_packages | bool
      # Large installers can take minutes to download; a synchronous WinRM
      # call that long risks hitting the connection's read/operation timeout
      # mid-download, which aborts the WHOLE loop (remaining packages never
      # even attempted) rather than just that one item. async+poll avoids
      # holding a single WinRM request open for the full install duration.
      async: 1800
      poll: 15
      register: choco_results
      ignore_errors: true   # one bad package ID shouldn't stop the rest

    - name: Check installed WSL distros
      # Skipped entirely when wsl_target_users is set: that means "install
      # for these specific other users only", not also for this run's own
      # WinRM account (theoneakta, a pure automation account never used
      # interactively - there's no point installing a distro for it).
      ansible.windows.win_shell: >-
        (wsl --list --quiet | Out-String) -replace '\x00', ''
      register: wsl_distros_before
      changed_when: false
      failed_when: false
      when: wsl_enabled and (wsl_distros_selected | length > 0) and (wsl_target_users | length == 0)

    - name: Install selected WSL distros
      # --no-launch: plain `wsl --install -d` also auto-launches the distro
      # for its first-run setup, which prompts interactively for a Linux
      # username/password. Over a non-interactive WinRM session that prompt
      # never gets answered, so the command hangs indefinitely even though
      # the actual install already succeeded. Skip the auto-launch entirely -
      # the first-run account setup still needs a manual `wsl -d <name>` step
      # regardless (see the README note on this).
      ansible.windows.win_shell: "wsl --install -d {{ item }} --no-launch"
      loop: "{{ wsl_distros_selected }}"
      register: wsl_install
      when: >-
        wsl_enabled and (wsl_distros_selected | length > 0) and (wsl_target_users | length == 0)
        and (item not in (wsl_distros_before.stdout | default('')))
      changed_when: wsl_install.rc == 0
      failed_when: wsl_install.rc is defined and wsl_install.rc != 0

    - name: Reboot to finish the WSL distro install(s)
      ansible.windows.win_reboot:
        reboot_timeout: 900
      when: wsl_enabled and wsl_install is changed and wsl_allow_reboot | bool

    - name: Re-check installed WSL distros after reboot
      ansible.windows.win_shell: >-
        (wsl --list --quiet | Out-String) -replace '\x00', ''
      register: wsl_distros_after
      when: wsl_enabled and wsl_install is changed and wsl_allow_reboot | bool
      changed_when: false
      failed_when: false

    - name: Finish any WSL distro installs after reboot
      ansible.windows.win_shell: "wsl --install -d {{ item }} --no-launch"
      loop: "{{ wsl_distros_selected }}"
      when: >-
        wsl_enabled and wsl_install is changed and wsl_allow_reboot | bool
        and (item not in (wsl_distros_after.stdout | default('')))
      changed_when: true

    - name: Warn that a reboot is needed to finish the WSL distro install(s)
      ansible.builtin.debug:
        msg: >-
          WSL distro install may need a reboot to finish. Re-run this playbook after
          rebooting, or pass -e wsl_allow_reboot=true (--wsl-allow-reboot from run.sh)
          to let this run reboot the PC automatically.
      when: wsl_enabled and wsl_install is changed and not (wsl_allow_reboot | bool)

    - name: Create per-user logon tasks to install WSL distro(s) for requested users
      # WSL distros are per-Windows-user; only the account that ran
      # `wsl --install` (this run's WinRM user) can see/use them by default.
      # A Scheduled Task with an "At log on" trigger scoped to a SPECIFIC
      # named user, logon_type=interactive_token, runs using THAT user's own
      # session the next time they log on - no password needed at all.
      #
      # This is a different mechanism than a Startup-folder script (which
      # was tried first and abandoned: Bitdefender blocked the write
      # outright, treating that folder as a protected autostart location,
      # regardless of the script's content). Creating a Scheduled Task via
      # the normal Task Scheduler API is a much more mundane, everyday admin
      # operation and did not hit the same block in testing - but this is
      # still new/unverified on a from-scratch machine, so check the actual
      # run results here rather than assuming it always sails through.
      community.windows.win_scheduled_task:
        name: "WSL-Provision-{{ item[0] }}-{{ item[1] }}"
        description: >-
          Registers the {{ item[1] }} WSL distro for {{ item[0] }} at their
          next logon (WSL distros are per-user). Managed by
          install_software.yml (wsl_target_users) - safe to delete once
          {{ item[0] }} has logged in and it's run.
        actions:
          - path: wsl.exe
            arguments: "--install -d {{ item[1] }} --no-launch"
        triggers:
          - type: logon
            user_id: "{{ item[0] }}"
        username: "{{ item[0] }}"
        logon_type: interactive_token
        state: present
        enabled: true
      loop: "{{ wsl_target_users | product(wsl_distros_selected) | list }}"
      loop_control:
        label: "{{ item[0] }} / {{ item[1] }}"
      when: wsl_enabled and (wsl_distros_selected | length > 0) and (wsl_target_users | length > 0)

    - name: Try starting each provisioning task now, in case that user is already logged on
      ansible.windows.win_shell: >-
        Start-ScheduledTask -TaskName "WSL-Provision-{{ item[0] }}-{{ item[1] }}"
      loop: "{{ wsl_target_users | product(wsl_distros_selected) | list }}"
      loop_control:
        label: "{{ item[0] }} / {{ item[1] }}"
      when: wsl_enabled and (wsl_distros_selected | length > 0) and (wsl_target_users | length > 0)
      failed_when: false
      changed_when: false

    - name: Tell the operator how other users can get these WSL distro(s)
      # Always shown as a reference/fallback, including for anyone not
      # listed in wsl_target_users above.
      ansible.builtin.debug:
        msg: >-
          {% if wsl_target_users | length > 0 %}
          WSL distro(s) installed only for: {{ wsl_target_users | join(', ') }}
          (via a logon task each - not for this run's own WinRM account).
          {% else %}
          WSL distro(s) installed for this run's account only (WSL is per-user).
          {% endif %}
          For any other Windows user on this PC to get them too, have them
          open a terminal and run:
          {% for distro in wsl_distros_selected %}`wsl --install -d {{ distro }} --no-launch`{{ ", " if not loop.last else "" }}{% endfor %}
      when: wsl_enabled and (wsl_distros_selected | length > 0)

    - name: Install Wazuh agent (needs manager address)
      chocolatey.chocolatey.win_chocolatey:
        name: wazuh-agent
        state: latest
        # win_chocolatey only reruns the MSI (and thus reapplies
        # package_params) when it detects an actual version change - once
        # installed, a later run with a different manager/params here would
        # otherwise be a silent no-op ("already up to date") that never
        # touches the existing config. Force it so a changed manager address
        # always takes effect.
        force: true
        # Keys here are the wazuh-agent Chocolatey package's OWN parameter
        # names (its chocolateyinstall.ps1 reads them via Get-PackageParameters
        # and maps them to the real WAZUH_* MSI properties itself) - they are
        # NOT the MSI property names directly. Get-PackageParameters expects
        # `/Key:Value` (or `/Key=Value`), never a raw WAZUH_* flag.
        package_params: >-
          /Manager:{{ wazuh_manager }}
          /ManagerPort:{{ wazuh_manager_port }}
          /Protocol:{{ wazuh_protocol }}
          {% if wazuh_registration_password %}/RegistrationPassword:{{ wazuh_registration_password }}{% endif %}
          {% if wazuh_group %}/AgentGroup:{{ wazuh_group }}{% endif %}
          {% if wazuh_agent_name %}/AgentName:{{ wazuh_agent_name }}{% endif %}
      when: wazuh_manager | length > 0

    - name: Ensure the Wazuh agent config points at the right manager
      # win_chocolatey's `force` above reruns the MSI, but Windows Installer
      # preserves an existing ossec.conf on a repair/upgrade rather than
      # rewriting it - so on a host that already had wazuh-agent installed, a
      # changed wazuh_manager can silently never take effect even though the
      # MSI parameters were correct and the install reported success.
      # Enforce the address directly instead of relying on the MSI for it.
      community.windows.win_lineinfile:
        path: 'C:\Program Files (x86)\ossec-agent\ossec.conf'
        regexp: '<address>.*</address>'
        line: "      <address>{{ wazuh_manager }}</address>"
      when: wazuh_manager | length > 0
      register: wazuh_config_fixed

    - name: Restart the Wazuh agent service if its config changed
      ansible.windows.win_service:
        name: WazuhSvc
        state: restarted
      when: wazuh_manager | length > 0 and wazuh_config_fixed is changed

    - name: Warn about Wazuh agent being skipped
      ansible.builtin.debug:
        msg: "wazuh_manager not set - Wazuh agent skipped."
      when: wazuh_manager | length == 0

    # Tailscale is joined as the MACHINE, not as whichever Windows user happens
    # to be logged on. The Chocolatey package already installs it machine-wide
    # (MSI, "Tailscale" service as LocalSystem) - installed here too, so a join
    # works even when this run skips the package list.
    - name: Ensure Tailscale is installed (machine-wide service)
      chocolatey.chocolatey.win_chocolatey:
        name: tailscale
        state: present
      when: tailscale_join_enabled | bool and (tailscale_authkey | default('')) | length > 0

    # Joined as the MACHINE, not as whichever Windows user is logged on.
    # tailscaled only accepts commands from the user that owns it (normally
    # the logged-on desktop user, via the tray app) - this toolkit's WinRM
    # account gets "401 Unauthorized: Tailscale already in use by <PC>\<user>"
    # (confirmed live on 192.168.3.181, where the old plain `tailscale up`
    # failed with a bare "non-zero return code"). LocalSystem, however, is
    # always allowed (also confirmed live), so `up --unattended` runs as SYSTEM
    # via a one-off scheduled task, deleted right after - the node then belongs
    # to the machine and stays connected whoever logs on or off. Machine-wide
    # system policies (HKLM\SOFTWARE\Policies\Tailscale) pin that down:
    #   UnattendedMode=always   - a user can't switch it back to per-user
    #   AlwaysOn.Enabled=1      - (1.84+) always connected; users can't
    #                             disconnect it from the tray
    #   UseTailscaleSubnets     - =always is --accept-routes
    # Not the AuthKey policy: a fresh/logged-out service never acts on it by
    # itself (confirmed live: "want=true loggedout=true", no login attempt).
    # "Joined" = a 100.x address on the Tailscale adapter, since `tailscale
    # status` itself 401s for a non-owner.
    - name: Join Tailscale tailnet as the machine (unattended, always on)
      ansible.windows.win_powershell:
        parameters:
          AuthKey: "{{ tailscale_authkey }}"
        script: |
          param([string]$AuthKey)
          $pol = 'HKLM:\SOFTWARE\Policies\Tailscale'
          $exe = 'C:\Program Files\Tailscale\tailscale.exe'
          function Get-TailnetIP {
            Get-NetIPAddress -InterfaceAlias 'Tailscale*' -AddressFamily IPv4 -ErrorAction SilentlyContinue |
              Where-Object IPAddress -like '100.*' | Select-Object -First 1 -ExpandProperty IPAddress
          }
          function Set-Policy($Name, $Value, $Type) {
            if ((Get-ItemProperty $pol -Name $Name -ErrorAction SilentlyContinue).$Name -ne $Value) {
              New-ItemProperty $pol -Name $Name -Value $Value -PropertyType $Type -Force | Out-Null
              $Ansible.Changed = $true
            }
          }

          $Ansible.Changed = $false
          New-Item $pol -Force -ErrorAction SilentlyContinue | Out-Null
          Set-Policy UnattendedMode 'always' String
          Set-Policy 'AlwaysOn.Enabled' 1 DWord
          Set-Policy UseTailscaleSubnets 'always' String

          if ($ip = Get-TailnetIP) { "Already joined: $ip"; return }

          $Ansible.Changed = $true
          $outFile = "$env:ProgramData\Tailscale\ansible-up.txt"
          $task = 'Ansible-TailscaleUp'
          $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"`"$exe`" up --authkey=$AuthKey --unattended --accept-routes --timeout=90s > `"$outFile`" 2>&1`""
          Register-ScheduledTask $task -Action $action -User 'SYSTEM' -RunLevel Highest -Force | Out-Null
          try {
            Start-ScheduledTask $task
            $deadline = (Get-Date).AddSeconds(120)
            do { Start-Sleep 3 } while (-not ($ip = Get-TailnetIP) -and (Get-Date) -lt $deadline)
          } finally {
            Unregister-ScheduledTask $task -Confirm:$false
          }
          $out = if (Test-Path $outFile) { (Get-Content $outFile -Raw) -replace 'tskey-[A-Za-z0-9-]+', 'tskey-REDACTED'; Remove-Item $outFile -Force }
          if (-not $ip) { throw "Tailscale did not join within 120s: $out Check the auth key is valid, unexpired, and reusable if already used." }
          "Joined: $ip"
      no_log: true
      when: tailscale_join_enabled | bool and (tailscale_authkey | default('')) | length > 0

    # Bitdefender consumer (Central): installer downloaded from the account,
    # see bitdefender_enabled above. The newest .exe in the folder is used.
    - name: Bitdefender (installer from your Bitdefender Central account)
      when: bitdefender_enabled | bool
      block:
        - name: Find the Bitdefender installer in playbooks/files/bitdefender/
          ansible.builtin.find:
            paths: "{{ playbook_dir }}/files/bitdefender"
            patterns: ["*.exe", "*.EXE"]
          delegate_to: localhost
          run_once: true
          register: bitdefender_found

        - name: Fail if there's no installer
          ansible.builtin.fail:
            msg: >-
              No Bitdefender installer: download it from https://central.bitdefender.com
              (My Devices > Install protection > Protect this device > Download) and put the
              .exe in playbooks/files/bitdefender/ on the Docker host.
          when: bitdefender_found.files | length == 0

        - name: Check whether a Bitdefender product is already installed
          ansible.windows.win_powershell:
            script: &bitdefender_check |
              $Ansible.Changed = $false
              Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                               'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                Where-Object DisplayName -like 'Bitdefender*' | Select-Object -ExpandProperty DisplayName -Unique
          register: bitdefender_before

        - name: Install Bitdefender
          when: bitdefender_before.output | length == 0
          vars:
            bitdefender_src: "{{ (bitdefender_found.files | sort(attribute='mtime') | last).path }}"
            bitdefender_dest: 'C:\ProgramData\Ansible\bitdefender\{{ bitdefender_src | basename }}'
          block:
            - name: Copy the installer to the PC
              ansible.windows.win_copy:
                src: "{{ bitdefender_src }}"
                dest: "{{ bitdefender_dest }}"

            # The Central installer is a downloader: it fetches the product
            # itself, which can take a while - async keeps WinRM out of it.
            - name: Run the installer unattended
              ansible.windows.win_command: '"{{ bitdefender_dest }}" {{ bitdefender_install_args }}'
              async: 3600
              poll: 30
              register: bitdefender_install
              failed_when: false

            # The downloader can exit before the product it launched has
            # finished installing, so wait for the product itself.
            - name: Wait for Bitdefender to show up as installed (up to 30 minutes)
              ansible.windows.win_powershell:
                script: *bitdefender_check
              register: bitdefender_after
              until: bitdefender_after.output | length > 0
              retries: 60
              delay: 30
              failed_when: false

            - name: Remove the copied installer
              ansible.windows.win_file:
                path: 'C:\ProgramData\Ansible\bitdefender'
                state: absent

            - name: Fail if Bitdefender didn't install
              ansible.builtin.fail:
                msg: >-
                  Bitdefender isn't installed after the installer ran (exit code
                  {{ bitdefender_install.rc | default('unknown') }}, args "{{ bitdefender_install_args }}").
                  Run the installer by hand on this PC once to see what it asks for.
              when: bitdefender_after.output | default([]) | length == 0

        - name: Report Bitdefender
          ansible.builtin.debug:
            msg: >-
              {{ (bitdefender_before.output | length > 0) | ternary('Already installed', 'Installed') }}:
              {{ (bitdefender_before.output + (bitdefender_after.output | default([]))) | unique | join(', ') }}.
              Check the PC appears under My Devices in Bitdefender Central; if it doesn't,
              open Bitdefender on it and sign in to the account once.

    - name: Configure Git global user.name
      ansible.windows.win_command: >-
        git config --global user.name "{{ git_user_name }}"
      when: git_user_name | length > 0

    - name: Configure Git global user.email
      ansible.windows.win_command: >-
        git config --global user.email "{{ git_user_email }}"
      when: git_user_email | length > 0

    - name: Run Win11Debloat (basic defaults, silent)
      ansible.windows.win_shell: >-
        & ([scriptblock]::Create((irm "https://debloat.raphi.re/"))) -RunDefaults -Silent
      # Downloading the script and applying its full default set of removals
      # and tweaks can easily run past the WinRM connection's operation/read
      # timeout (group_vars/windows/vars.yml) if left as a single blocking
      # call - same issue the Chocolatey loop above had. async+poll avoids
      # holding one WinRM request open for the whole duration.
      async: 1800
      poll: 15
      when: win11debloat_enabled | bool

    - name: Check which RSAT capabilities still need installing
      ansible.windows.win_shell: >-
        (Get-WindowsCapability -Online | Where-Object { $_.Name -like 'Rsat*' -and $_.State -ne 'Installed' }).Name -join ','
      register: rsat_missing
      changed_when: false
      when: rsat_enabled | bool

    - name: Create a one-off task to install RSAT capabilities as SYSTEM
      # Add-WindowsCapability returns "Access is denied" (a COMException)
      # when invoked directly over WinRM - confirmed in testing - because
      # DISM servicing operations need a genuinely elevated/interactive-
      # equivalent token, which a WinRM network-logon session doesn't carry
      # even for a full local admin. A Scheduled Task gets a real token
      # regardless of how it was created, so route the actual install
      # through one instead (same idea as the per-user WSL provisioning
      # above). Fires once, immediately, via a "registration" trigger.
      community.windows.win_scheduled_task:
        name: RSAT-Install-OneOff
        actions:
          - path: powershell.exe
            arguments: >-
              -NoProfile -Command "(Get-WindowsCapability -Online | Where-Object { $_.Name -like 'Rsat*' -and $_.State -ne 'Installed' } | Add-WindowsCapability -Online) *>&1 | Out-File C:\Windows\Temp\rsat-install.log"
        triggers:
          - type: registration
        username: SYSTEM
        run_level: highest
        state: present
        enabled: true
      when: rsat_enabled | bool and (rsat_missing.stdout | default('')) | length > 0

    - name: Wait for the RSAT install task to finish
      # Confirmed in testing this can take 15+ minutes for a full set of
      # missing capabilities (each downloads from Windows Update) - poll
      # rather than block a single WinRM call for that whole duration.
      # 267009 (0x41301, SCHED_S_TASK_RUNNING) means still running; 0 means
      # it finished successfully; anything else is a real failure.
      ansible.windows.win_shell: (Get-ScheduledTaskInfo -TaskName RSAT-Install-OneOff).LastTaskResult
      register: rsat_wait
      until: rsat_wait.stdout | trim != '267009'
      retries: 120
      delay: 15
      changed_when: false
      when: rsat_enabled | bool and (rsat_missing.stdout | default('')) | length > 0

    - name: Report the RSAT install result
      ansible.builtin.debug:
        msg: >-
          RSAT install finished with result code {{ rsat_wait.stdout | trim }}
          (0 = success; anything else, check C:\Windows\Temp\rsat-install.log
          on the target for details).
      when: rsat_enabled | bool and (rsat_missing.stdout | default('')) | length > 0

    - name: Remove the one-off RSAT install task
      community.windows.win_scheduled_task:
        name: RSAT-Install-OneOff
        state: absent
      when: rsat_enabled | bool and (rsat_missing.stdout | default('')) | length > 0
      changed_when: true

    - name: Report packages that failed
      ansible.builtin.debug:
        msg: "FAILED: {{ item.item.label }} ({{ item.item.name }}) - check package ID"
      loop: "{{ choco_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.failed | default(false)

    - name: Items that need manual install (not in Chocolatey / licensed / unclear)
      ansible.builtin.debug:
        msg:
          - "Punch! Software 22     - commercial, no public package; deploy your licensed installer"
          - "Duplicate Cleaner Pro  - licensed; deploy your installer/key"
          - "DownloadHelper         - browser extension (+ optional CoApp); deploy via browser policy"
          - "Deadpool / Future Fragments - unclear what these are; please confirm"
          - "Plantronics Hub        - now Poly Lens; verify with 'choco search poly' or deploy installer"
