---
# The Proxmox nodes copy the traffic of their LAN bridge to the traffic sensor
# (sensor_stack.yml) over GRE - configuration only, nothing installed, nothing
# in the VMs. Every frame entering the bridge (from the LAN, from each VM or
# container) is copied once as it comes in, so VM-to-VM traffic is seen too.
#
#   uplink / tapN / fwprN --tc ingress mirror--> slmirror (gretap) --> sensor host
#
# Left out: GRE itself (the copies - no loops), SMB and NFS (backups and
# storage, heavy and of little interest). The copies are capped
# (proxmox_mirror_rate) so they never crowd the uplink - over the cap, copies
# are dropped, never the traffic itself.
# A timer puts the mirror on ports that appear (a VM started) every 30 seconds.
#
# Nodes are "SSH only" hosts with a per-host root login, like proxmox_softflowd.yml.
#
# Run:  ./run.sh proxmox_mirror.yml                                   (sensor_stack.yml first)
#       ./run.sh proxmox_mirror.yml --limit 192.168.3.236
#       ./run.sh proxmox_mirror.yml -e proxmox_mirror_state=absent

- name: Mirror the Proxmox bridges to the traffic sensor
  hosts: "{{ proxmox_mirror_nodes | default('hypervisors') }}"
  gather_facts: false
  vars:
    proxmox_mirror_state: present
    proxmox_mirror_sensor: "{{ site_server_ip }}"
    proxmox_mirror_rate: 200mbit
    proxmox_mirror_dev: slmirror
  tasks:
    - name: The node's address and LAN bridge (the one with the default route)
      ansible.builtin.shell: |
        set -eu
        br=$(ip -o route show default | awk '{print $5; exit}')
        echo "$br $(ip -o -4 addr show dev "$br" | awk '{split($4, a, "/"); print a[1]; exit}')"
      register: node_net
      changed_when: false

    - name: Check them
      ansible.builtin.assert:
        that:
          - node_net.stdout.split() | length == 2
          - (node_net.stdout.split() | first) is match('^vmbr')
        fail_msg: "No vmbr bridge with the default route here: {{ node_net.stdout }}"

    - name: The mirror's script
      ansible.builtin.copy:
        dest: /usr/local/sbin/sentrylens-mirror
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by ansible-runner (proxmox_mirror.yml): copies every frame entering
          # {{ node_net.stdout.split() | first }} to the Sentry Lens sensor over GRE.
          #   sentrylens-mirror start | sync | stop | status
          set -u
          BRIDGE={{ node_net.stdout.split() | first }}
          LOCAL={{ node_net.stdout.split() | last }}
          SENSOR={{ proxmox_mirror_sensor }}
          DEV={{ proxmox_mirror_dev }}
          RATE={{ proxmox_mirror_rate }}
          PREFS="49001 49002 49003 49004 49005 49009"

          ports() { ls "/sys/class/net/$BRIDGE/brif" 2>/dev/null; }

          detach() {
            for p in $PREFS; do tc filter del dev "$1" ingress pref "$p" 2>/dev/null; done
          }

          attach() {
            p=$1
            tc filter show dev "$p" ingress 2>/dev/null | grep -q "device $DEV)" && return 0
            # A port with another ingress queue (a rate limit) is left alone.
            if ! tc qdisc show dev "$p" | grep -q "clsact\|ingress"; then
              tc qdisc add dev "$p" clsact || return 0
            elif ! tc qdisc show dev "$p" | grep -q clsact; then
              echo "$p: has its own ingress queue - not mirrored"; return 0
            fi
            detach "$p"
            tc filter add dev "$p" ingress pref 49001 protocol ip flower ip_proto gre action pass
            tc filter add dev "$p" ingress pref 49002 protocol ip flower ip_proto tcp dst_port 445 action pass
            tc filter add dev "$p" ingress pref 49003 protocol ip flower ip_proto tcp src_port 445 action pass
            tc filter add dev "$p" ingress pref 49004 protocol ip flower ip_proto tcp dst_port 2049 action pass
            tc filter add dev "$p" ingress pref 49005 protocol ip flower ip_proto tcp src_port 2049 action pass
            tc filter add dev "$p" ingress pref 49009 matchall action mirred egress mirror dev "$DEV"
            echo "$p: mirrored"
          }

          tunnel() {
            [ -e "/sys/class/net/$DEV" ] || ip link add "$DEV" type gretap local "$LOCAL" remote "$SENSOR" nopmtudisc
            ip link set "$DEV" mtu 1500 up
            # The cap: over it, copies are dropped here - never the traffic itself.
            tc qdisc replace dev "$DEV" root tbf rate "$RATE" burst 512kb latency 200ms
          }

          case "${1:-sync}" in
            start) tunnel; for p in $(ports); do attach "$p"; done ;;
            sync)  [ -e "/sys/class/net/$DEV" ] || tunnel; for p in $(ports); do attach "$p"; done ;;
            stop)  for p in $(ports); do detach "$p"; done; ip link del "$DEV" 2>/dev/null ;;
            status) ip -s link show "$DEV"; for p in $(ports); do printf '%s: ' "$p"; tc filter show dev "$p" ingress | grep -q "device $DEV)" && echo mirrored || echo -; done ;;
          esac
          exit 0
      register: mirror_script

    - name: Its units (started at boot, and a sync every 30 seconds for ports that appear)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: sentrylens-mirror.service
          content: |
            # Managed by ansible-runner (proxmox_mirror.yml).
            [Unit]
            Description=Sentry Lens: mirror the LAN bridge to the traffic sensor
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/sentrylens-mirror sync
        - name: sentrylens-mirror.timer
          content: |
            # Managed by ansible-runner (proxmox_mirror.yml).
            [Unit]
            Description=Sentry Lens: keep the bridge mirrored (VMs that start)

            [Timer]
            OnBootSec=30s
            OnUnitActiveSec=30s
            AccuracySec=5s

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      register: mirror_units
      when: proxmox_mirror_state == 'present'

    # Mirrors an earlier test left on the uplink, to a device that's gone (they copy to nowhere).
    - name: Leftover mirrors to a device that's gone
      ansible.builtin.shell: |
        for p in $(ls /sys/class/net/{{ node_net.stdout.split() | first }}/brif); do
          for dir in ingress egress; do
            tc filter show dev "$p" $dir 2>/dev/null | awk '/^filter .* pref [0-9]+ matchall/ {pref=$5} /Mirror to device \*\)/ {print pref}' | sort -u |
              while read -r pref; do tc filter del dev "$p" $dir pref "$pref" && echo "$p $dir pref $pref removed"; done
          done
        done
      register: leftovers
      changed_when: leftovers.stdout | length > 0

    - name: Mirror on
      when: proxmox_mirror_state == 'present'
      block:
        - name: Start it
          ansible.builtin.command: /usr/local/sbin/sentrylens-mirror start
          register: mirror_start
          changed_when: "'mirrored' in mirror_start.stdout"

        - name: The timer
          ansible.builtin.systemd_service:
            name: sentrylens-mirror.timer
            enabled: true
            state: started
            daemon_reload: "{{ mirror_units is changed }}"

    - name: Mirror off
      when: proxmox_mirror_state == 'absent'
      block:
        - name: The timer
          ansible.builtin.systemd_service:
            name: sentrylens-mirror.timer
            enabled: false
            state: stopped
          failed_when: false

        - name: Stop it
          ansible.builtin.command: /usr/local/sbin/sentrylens-mirror stop
          changed_when: true
          failed_when: false

        - name: Its files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: [/usr/local/sbin/sentrylens-mirror, /etc/systemd/system/sentrylens-mirror.service, /etc/systemd/system/sentrylens-mirror.timer]

    - name: State
      ansible.builtin.command: /usr/local/sbin/sentrylens-mirror status
      register: mirror_status
      changed_when: false
      failed_when: false
      when: proxmox_mirror_state == 'present'

    - name: Report
      ansible.builtin.debug:
        msg: "{{ (leftovers.stdout_lines | default([])) + (mirror_status.stdout_lines | default(['mirror removed'])) }}"
